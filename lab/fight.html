<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>必要成功数のたたかい</title>
<style>
:root{
  --bg:#1b1d18; --panel:#232720; --panel2:#2b3028; --line:#3a3f34;
  --bone:#e9e4d4; --dim:#8b9080; --brass:#c9a227; --moss:#8fa261;
  --blood:#b1544a; --ink:#6f7a63; --blue:#6f92ab;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--bone);
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  font-size:15px;line-height:1.7;padding:12px 12px 40px;max-width:520px;margin:0 auto}
button{font-family:inherit}

/* ---- 舞台 ---- */
.stagebar{font-size:10px;letter-spacing:.2em;color:var(--brass);text-align:center;margin-bottom:7px}
.lead{color:var(--dim);font-size:11.5px;line-height:1.8;margin:0 0 12px;
  border-left:2px solid var(--line);padding-left:10px}
.lead b{color:var(--brass);font-weight:600}

/* ---- 盤面 ---- */
.field{background:var(--panel);border:1px solid var(--line);padding:10px 6px 9px;position:relative}
.hdr,.board{display:grid;grid-template-columns:1fr 18px 1fr;gap:3px}
.hdr{margin-bottom:4px}
.hdr div{font-size:9px;letter-spacing:.16em;text-align:center;color:var(--ink)}
.hdr .mine{color:var(--moss)} .hdr .theirs{color:var(--blood)}
.gap{position:relative}
.gap::before{content:"";position:absolute;left:50%;top:2px;bottom:2px;width:1px;background:#2f3429}
.cell{min-height:132px;padding:3px 1px;display:flex;flex-direction:column;
  align-items:center;justify-content:flex-start;position:relative}
.cell.dead{opacity:.24;filter:grayscale(1)}
.cell.acting{background:#1d2117;box-shadow:inset 0 0 0 1px #6f7a63}
.cell.acting .cn{color:var(--brass)}
.por{padding:2px 4px;transition:.12s}
.por svg{display:block}
.cn{font-size:10px;line-height:1.3;text-align:center;margin-top:3px;letter-spacing:.02em}
.cn.mine{color:var(--moss)} .cn.foe{color:var(--blood)}
.chp{font-family:ui-monospace,monospace;font-size:9px;color:var(--dim);margin-top:1px}
.bar{height:3px;background:#14160f;width:76%;margin-top:3px}
.bar i{display:block;height:100%;background:var(--blood);transition:width .25s ease-out}
.bar.me i{background:var(--moss)}
.bar.mpb i{background:var(--blue)}
.cst{font-size:9px;color:var(--ink);margin-top:4px;text-align:center;line-height:1.4}
.cst b{color:var(--bone);font-weight:600}

/* とんでいく数字 */
.pop{position:absolute;top:34px;left:50%;transform:translateX(-50%);
  font-family:"Hiragino Mincho ProN",serif;font-size:24px;color:var(--blood);
  pointer-events:none;animation:pop 1s ease-out forwards;text-shadow:0 0 8px #1b1d18}
.pop.miss{color:var(--dim);font-size:16px}
.pop.heal{color:var(--moss)}
@keyframes pop{0%{opacity:0;transform:translate(-50%,6px) scale(.8)}
  22%{opacity:1;transform:translate(-50%,-4px) scale(1.1)}
  70%{opacity:1;transform:translate(-50%,-10px) scale(1)}
  100%{opacity:0;transform:translate(-50%,-22px) scale(1)}}

/* ---- ダイスの覆い ---- */
.diceOv{position:absolute;inset:0;background:rgba(20,22,15,.94);
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:9px;
  z-index:20;padding:10px}
.diceOv.on{display:flex}
.dvWho{font-size:10px;letter-spacing:.2em;color:var(--brass)}
.dvNeed{font-size:11px;color:var(--dim);letter-spacing:.08em}
.dvNeed b{color:var(--bone)}
.dice{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
.die{width:40px;height:40px;border:1px solid var(--line);background:#171a14;
  display:grid;place-items:center;font-family:"Hiragino Mincho ProN",serif;
  font-size:21px;color:#5d6356;font-variant-numeric:tabular-nums}
.die.roll{animation:shake .13s linear infinite}
.die.hit{border-color:var(--moss);color:var(--moss);background:#1e2419;
  box-shadow:0 0 10px -2px rgba(143,162,97,.55)}
.die.set{animation:land .18s ease-out}
@keyframes shake{0%{transform:translate(-1px,1px) rotate(-3deg)}
  50%{transform:translate(1px,-1px) rotate(3deg)}100%{transform:translate(-1px,1px) rotate(-3deg)}}
@keyframes land{from{transform:scale(1.35)}to{transform:scale(1)}}
.dvRes{font-size:14px;letter-spacing:.06em;min-height:24px;text-align:center;line-height:1.5}
.dvRes .ok{color:var(--moss)} .dvRes .ng{color:var(--blood)}
.dvRes small{display:block;font-size:10.5px;color:var(--dim);letter-spacing:0}

/* ---- 命中閾値 ---- */
.thrline{display:flex;align-items:center;gap:10px;background:var(--panel2);
  border:1px solid var(--line);border-top:none;padding:7px 11px}
.thrn{font-family:"Hiragino Mincho ProN",serif;font-size:23px;color:var(--brass);line-height:1;
  font-variant-numeric:tabular-nums}
.thrt{font-size:10.5px;color:var(--dim);line-height:1.5}
.thrt b{color:var(--bone)}
.thrx{margin-left:auto;text-align:right;font-size:9.5px;color:var(--ink);line-height:1.55}

/* ---- 行動 ---- */
.prompt{font-size:12px;color:var(--brass);letter-spacing:.1em;margin:12px 0 5px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.act{background:var(--panel);border:1px solid var(--line);padding:7px 9px;cursor:pointer;
  text-align:left;color:var(--bone);display:flex;flex-direction:column;gap:3px;
  min-height:62px;justify-content:center}
.act:hover:not(:disabled){border-color:var(--brass);background:var(--panel2)}
.act:disabled{opacity:.34;cursor:not-allowed}
.act:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
.act.atk{border-left:3px solid var(--blood)}
.act.sk{border-left:3px solid var(--brass)}
.act.def{border-left:3px solid var(--blue)}
.act.wide{grid-column:1/-1;min-height:0;flex-direction:row;align-items:center;gap:9px}
.an{font-size:13.5px;letter-spacing:.04em;line-height:1.25;display:flex;
  align-items:center;gap:7px;flex-wrap:wrap}
.ad{font-size:10px;color:var(--dim);line-height:1.45;font-variant-numeric:tabular-nums}
.ad em{font-style:normal;color:var(--moss)}
.ad em.mid{color:var(--brass)} .ad em.bad{color:var(--blood)}
/* 必要成功の玉。これが分かれば この仕組みは分かる */
.pips{display:inline-flex;gap:3px;align-items:center}
.pip{width:8px;height:8px;border:1px solid var(--brass);border-radius:50%;
  background:var(--brass);flex:none}
.pip.off{background:transparent;border-color:#4d5346}
.nogo{font-size:9.5px;color:var(--blood);letter-spacing:.06em}

/* ---- ログ ---- */
.log{background:var(--panel);border:1px solid var(--line);margin-top:12px;
  height:132px;overflow-y:auto;padding:8px 0}
.lg{padding:4px 12px;font-size:12px;line-height:1.55}
.lg.rnd{color:var(--brass);font-family:ui-monospace,monospace;font-size:9.5px;
  letter-spacing:.2em;border-top:1px solid #2e332a;padding-top:8px;margin-top:4px}
.lg .a{color:var(--moss)} .lg .b{color:var(--blood)} .lg .m{font-family:ui-monospace,monospace}
.end{margin-top:10px;padding:12px;text-align:center;border:1px solid var(--brass);
  color:var(--brass);font-family:"Hiragino Mincho ProN",serif;letter-spacing:.2em;font-size:14px}
.end.lose{border-color:var(--blood);color:var(--blood)}

/* ---- 稽古（試作だけのつまみ） ---- */
.train{margin-top:16px;background:var(--panel);border:1px dashed var(--line);padding:10px 12px}
.ttl{font-size:9.5px;letter-spacing:.22em;color:var(--ink);margin-bottom:8px}
.trow{display:flex;align-items:center;gap:9px;margin:7px 0;flex-wrap:wrap}
.trow>.k{font-size:11px;color:var(--dim);letter-spacing:.1em;width:88px;flex:none}
.tval{font-family:ui-monospace,monospace;font-size:13px;color:var(--brass);
  min-width:26px;text-align:center;font-variant-numeric:tabular-nums}
.tbtn{background:var(--panel2);border:1px solid var(--line);color:var(--bone);
  width:30px;height:28px;font-size:15px;cursor:pointer;line-height:1}
.tbtn:hover:not(:disabled){border-color:var(--brass);color:var(--brass)}
.tbtn:disabled{opacity:.3;cursor:default}
.tbtn.w{width:auto;padding:0 12px;font-size:12px}
.tbtn.on{border-color:var(--brass);color:var(--brass);background:#2f3327}
.tnote{font-size:10px;color:var(--ink);line-height:1.65;margin-top:8px}
.tnote b{color:var(--dim)}
@media(prefers-reduced-motion:reduce){
  .die.roll,.pop,.die.set{animation:none}
}
</style>
</head>
<body>

<div class="stagebar">必 要 成 功 数 ── た た か い の 試 作</div>
<p class="lead">
技には <b>必要な成功の数</b>があります。玉（<b>●●○</b>）がその数。<br>
振れるダイスは<b>技能</b>で決まります。<b>足りない技は選べません。</b><br>
下の「稽古」でダイスを増やすと、<b>選べる技が増えていきます。</b>
</p>

<div class="field">
  <div class="hdr"><div class="mine">こ ち ら</div><div></div><div class="theirs">相 手</div></div>
  <div class="board">
    <div class="cell" id="cMe"></div>
    <div class="gap"></div>
    <div class="cell" id="cFoe"></div>
  </div>
  <div class="diceOv" id="diceOv"></div>
</div>
<div class="thrline">
  <div class="thrn" id="thrN">4</div>
  <div class="thrt">以上が<b>成功</b><br><span id="thrP"></span></div>
  <div class="thrx" id="thrX"></div>
</div>

<div class="prompt" id="prompt">ど う す る</div>
<div class="acts" id="acts"></div>
<div id="endBox"></div>
<div class="log" id="log"></div>

<div class="train">
  <div class="ttl">稽 古（試 作 だ け の つ ま み）</div>
  <div class="trow"><span class="k">格闘ダイス</span>
    <button class="tbtn" id="dMinus">−</button>
    <span class="tval" id="dVal">2</span>
    <button class="tbtn" id="dPlus">＋</button>
    <span class="tnote" style="margin:0" id="dNote"></span></div>
  <div class="trow"><span class="k">こちらの DEX</span>
    <button class="tbtn" id="xMinus">−</button>
    <span class="tval" id="xVal">20</span>
    <button class="tbtn" id="xPlus">＋</button>
    <span class="tnote" style="margin:0" id="xNote"></span></div>
  <div class="trow"><span class="k">相 手</span>
    <div id="foePick" style="display:flex;gap:5px;flex-wrap:wrap"></div></div>
  <div class="trow"><span class="k">　</span>
    <button class="tbtn w" id="again">も う 一 度</button></div>
  <div class="tnote" id="tips"></div>
</div>

<script>
"use strict";
const $=s=>document.querySelector(s);
const r6=()=>1+Math.floor(Math.random()*6);
const wait=ms=>new Promise(r=>setTimeout(r,ms));

/* ================= 決めごと =================
   ・技ごとに「必要な成功の数」がある。届かなければ **ダメージなし**（MP は消える）
   ・振れるダイスの数は 技能（ここでは格闘）で決まる
   ・威力は 物理＝STR の n%、魔法＝INT の n%
   ・しきい値は素 4。DEX の差 25 で ±1、40 で ±2。上は 2以上、下は 6のみ
   ・敵も同じ仕組みで振る                                          */
const DEXA=25, DEXB=40;
const dexShift=d=>Math.sign(d)*(Math.abs(d)>=DEXB?2:Math.abs(d)>=DEXA?1:0);
const threshold=(atk,def)=>Math.max(2,Math.min(6,4-dexShift(atk-def)));

/* ヒュームのナイト Lv1。数字は本編の JOB.knight から借りている */
const BASE={n:"ヒュームのナイト",STR:32,INT:16,DEX:20,HP:175,MP:16};
/* 敵は本編の FOE から借りている（スライム／草スライム／水スライム） */
const FOES={
  slime:  {n:"スライム",   HP:95, STR:22, DEX:6,  dice:2, art:"slime",
    acts:[{n:"体当たり",need:1,mul:100},{n:"のびる",need:2,mul:210}]},
  gslime: {n:"草スライム",  HP:80, STR:23, DEX:26, dice:2, art:"gslime",
    acts:[{n:"跳ねかかる",need:1,mul:100},{n:"芽を飛ばす",need:2,mul:200}]},
  wslime: {n:"水スライム",  HP:175,STR:36, DEX:5,  dice:3, art:"wslime",
    acts:[{n:"押し流す",need:1,mul:90},{n:"飲み込む",need:3,mul:300}]},
};
/* 技。通常攻撃・斬撃・強撃 はご提案のもの。大技は名前が未定なので仮 */
const ACTS=[
  {id:"a1",n:"通常攻撃",  cls:"atk", need:1, mul:100, mp:0,  d:"武器で殴る"},
  {id:"a2",n:"斬 撃",    cls:"sk",  need:2, mul:200, mp:3,  d:"踏み込んで断つ"},
  {id:"a3",n:"強 撃",    cls:"sk",  need:3, mul:360, mp:6,  d:"体重を乗せる"},
  {id:"a4",n:"大技（仮）", cls:"sk",  need:4, mul:560, mp:10, d:"名前は未定"},
];

/* ---------- 図 ---------- */
function knightFig(s){
  return `<svg width="${s}" height="${s}" viewBox="0 0 40 40" aria-hidden="true">
    <g fill="none" stroke="#8fa261" stroke-width="1.4" stroke-linejoin="round">
      <path d="M14 12h12v9a6 6 0 0 1-6 6 6 6 0 0 1-6-6z"/>
      <path d="M14 12l6-6 6 6"/><path d="M17 17h6" stroke-width="2"/>
      <path d="M13 28h14l2 9H11z"/><path d="M31 9v22" stroke-width="2"/>
      <path d="M28 15h6"/>
    </g></svg>`;
}
function slimeFig(s,c){
  return `<svg width="${s}" height="${s}" viewBox="0 0 40 40" aria-hidden="true">
    <path d="M6 32c0-9 5-18 14-18s14 9 14 18z" fill="${c}22" stroke="${c}"
      stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M6 32h28" stroke="${c}" stroke-width="1.4"/>
    <circle cx="16" cy="25" r="1.6" fill="${c}"/><circle cx="24" cy="25" r="1.6" fill="${c}"/>
    <path d="M13 19q3-4 7-3" stroke="${c}" stroke-width="1.1" fill="none" opacity=".7"/>
  </svg>`;
}
const foeFig=(k,s)=>slimeFig(s, k==="gslime"?"#8fa261":k==="wslime"?"#6f92ab":"#b1544a");

/* ---------- 状態 ---------- */
let me, foe, foeKey="slime", nDice=2, round=0, busy=false, over=false;

function reset(keepDice){
  if(!keepDice)nDice=2;
  const F=FOES[foeKey];
  const keepDex=(keepDice&&me)?me.DEX:BASE.DEX;
  me ={...BASE, DEX:keepDex, hp:BASE.HP, mp:BASE.MP};
  foe={...F,    hp:F.HP};
  round=0; over=false; busy=false;
  $("#log").innerHTML=""; $("#endBox").innerHTML="";
  log(`<span class="b">${foe.n}</span> が現れた`,"rnd");
  newRound();
}
function log(html,cls){
  const d=document.createElement("div");
  d.className="lg"+(cls?" "+cls:"");
  d.innerHTML=html;
  $("#log").appendChild(d); $("#log").scrollTop=1e6;
}
function newRound(){ round++; log(`ラウンド ${round}`,"rnd"); drawAll(); }

/* ---------- 描く ---------- */
function drawAll(){ drawBoard(); drawThr(); drawActs(); drawTrain(); }

function drawBoard(){
  $("#cMe").className="cell"+(over?"":" acting")+(me.hp<=0?" dead":"");
  $("#cMe").innerHTML=
    `<div class="por">${knightFig(46)}</div>
     <div class="cn mine">${me.n}</div>
     <div class="chp">HP ${Math.max(0,Math.round(me.hp))}/${me.HP}</div>
     <div class="bar me"><i style="width:${Math.max(0,me.hp/me.HP*100)}%"></i></div>
     <div class="chp" style="color:var(--blue)">MP ${me.mp}/${me.MP}</div>
     <div class="bar mpb"><i style="width:${me.mp/me.MP*100}%"></i></div>
     <div class="cst">STR <b>${me.STR}</b>　DEX <b>${me.DEX}</b><br>格闘ダイス <b>${nDice}</b>個</div>`;
  $("#cFoe").className="cell"+(foe.hp<=0?" dead":"");
  $("#cFoe").innerHTML=
    `<div class="por">${foeFig(foe.art,46)}</div>
     <div class="cn foe">${foe.n}</div>
     <div class="chp">HP ${Math.max(0,Math.round(foe.hp))}/${foe.HP}</div>
     <div class="bar"><i style="width:${Math.max(0,foe.hp/foe.HP*100)}%"></i></div>
     <div class="cst" style="margin-top:9px">STR <b>${foe.STR}</b>　DEX <b>${foe.DEX}</b><br>ダイス <b>${foe.dice}</b>個</div>`;
}

function drawThr(){
  const t=threshold(me.DEX,foe.DEX), d=me.DEX-foe.DEX, sh=dexShift(d);
  $("#thrN").textContent=t;
  $("#thrP").textContent=`ダイス1個が成功する見込み ${Math.round((7-t)/6*100)}%`;
  $("#thrX").innerHTML=
    `素 4　DEX の差 ${d>0?"+":""}${d} → <b style="color:${
      sh>0?"var(--moss)":sh<0?"var(--blood)":"var(--ink)"}">${
      sh>0?"−"+sh:sh<0?"+"+(-sh):"±0"}</b>`+
    `<br>相手が振るときは ${threshold(foe.DEX,me.DEX)}以上`;
}

/* 必要成功の玉。振れるダイスのぶんだけ枠を出し、必要な数だけ塗る */
function pips(need,have){
  const n=Math.max(need,have);
  let h="";
  for(let i=0;i<n;i++)h+=`<span class="pip${i<need?"":" off"}"></span>`;
  return `<span class="pips" aria-label="必要な成功 ${need}">${h}</span>`;
}
const comb=(n,k)=>{let r=1;for(let i=0;i<k;i++)r=r*(n-i)/(i+1);return r;};
function atLeast(n,k,p){ if(k>n)return 0; let s=0;
  for(let i=k;i<=n;i++)s+=comb(n,i)*Math.pow(p,i)*Math.pow(1-p,n-i); return s; }

function drawActs(){
  if(over){ $("#acts").innerHTML=""; $("#prompt").textContent=""; return; }
  $("#prompt").textContent="ど う す る";
  const t=threshold(me.DEX,foe.DEX), p=(7-t)/6;
  $("#acts").innerHTML=ACTS.map(a=>{
    const noDice=a.need>nDice, noMp=a.mp>me.mp, off=noDice||noMp||busy;
    const ok=atLeast(nDice,a.need,p);
    const cls=ok>=.6?"":ok>=.3?"mid":"bad";
    return `<button class="act ${a.cls}" data-a="${a.id}"${off?" disabled":""}>
      <span class="an">${a.n} ${pips(a.need,nDice)}</span>
      <span class="ad">${
        noDice?`<span class="nogo">ダイスが ${a.need}個 要る（いま ${nDice}個）</span>`
        :noMp ?`<span class="nogo">MP が足りない</span>`
        :`成功 <em class="${cls}">${Math.round(ok*100)}%</em>　威力 ${
           Math.round(me.STR*a.mul/100)}${a.mp?`　MP ${a.mp}`:""}`}</span>
    </button>`;}).join("")+
    `<button class="act def wide" data-a="guard"${busy?" disabled":""}>
      <span class="an">守 る</span>
      <span class="ad">この番の被害を半分にして MP を 4 戻す</span></button>`;
  $("#acts").querySelectorAll("[data-a]").forEach(b=>{
    b.onclick=()=>doTurn(b.dataset.a);});
}

function drawTrain(){
  $("#dVal").textContent=nDice;
  $("#dMinus").disabled=nDice<=1||busy; $("#dPlus").disabled=nDice>=8||busy;
  $("#xVal").textContent=me.DEX;
  $("#xMinus").disabled=me.DEX<=5||busy; $("#xPlus").disabled=me.DEX>=120||busy;
  {const now=threshold(me.DEX,foe.DEX),
     up=threshold(Math.min(120,me.DEX+5),foe.DEX),
     dn=threshold(Math.max(5,me.DEX-5),foe.DEX);
   $("#xNote").innerHTML= (up!==now)?`＋5 で しきい値が <b>${up}</b> になる`
     : (dn!==now)?`−5 で しきい値が <b>${dn}</b> になる`
     : `相手との差 ${me.DEX-foe.DEX}　（<b>25</b> でしきい値が動く）`;}
  const next=ACTS.find(a=>a.need===nDice+1);
  $("#dNote").innerHTML=next
    ? `＋1 で <b>${next.n}</b> が選べる`
    : `<b>ぜんぶ選べる</b>`;
  $("#foePick").innerHTML=Object.keys(FOES).map(k=>
    `<button class="tbtn w${k===foeKey?" on":""}" data-f="${k}"${busy?" disabled":""}>${
      FOES[k].n}</button>`).join("");
  $("#foePick").querySelectorAll("[data-f]").forEach(b=>{
    b.onclick=()=>{ foeKey=b.dataset.f; reset(true); };});
  const t=threshold(me.DEX,foe.DEX), p=(7-t)/6;
  const just=ACTS.filter(a=>a.need<=nDice).sort((x,y)=>y.need-x.need)[0];
  $("#tips").innerHTML=just
    ? `いま覚えたての <b>${just.n}</b>（必要 ${just.need}）は ダイス ${nDice}個 で `+
      `<b>${Math.round(atLeast(nDice,just.need,p)*100)}%</b>。`+
      `ダイスを ＋2 すると <b>${Math.round(atLeast(nDice+2,just.need,p)*100)}%</b>。`+
      `<br>── <b>覚えた瞬間がいちばん弱い</b>のがこの仕組みの弱点。`+
      `覚える段を「ダイス＝必要成功＋2」に寄せるのが手当ての案。`
    : "";
}

/* ---------- ダイスを振る ---------- */
async function rollDice(who,n,thr,need,label){
  const ov=$("#diceOv");
  ov.className="diceOv on";
  ov.innerHTML=
    `<div class="dvWho">${who}</div>
     <div class="dvNeed">${label}　${n}d6・<b>${thr}以上</b>　必要な成功 <b>${need}</b></div>
     <div class="dice" id="dvDice">${
       Array.from({length:n},()=>`<div class="die roll">?</div>`).join("")}</div>
     <div class="dvRes" id="dvRes"></div>`;
  const els=[...ov.querySelectorAll(".die")];
  /* まず全部まわす */
  const spin=setInterval(()=>els.forEach(e=>{ if(!e.dataset.set)e.textContent=r6(); }),70);
  await wait(420);
  /* 1つずつ止める */
  const rolls=[];
  for(const e of els){
    const v=r6(); rolls.push(v);
    e.dataset.set="1"; e.textContent=v;
    e.classList.remove("roll"); e.classList.add("set");
    if(v>=thr)e.classList.add("hit");
    await wait(155);
  }
  clearInterval(spin);
  const k=rolls.filter(v=>v>=thr).length, ok=k>=need;
  $("#dvRes").innerHTML= ok
    ? `<span class="ok">成功 ${k} ／ 必要 ${need}　通った</span>`
    : `<span class="ng">成功 ${k} ／ 必要 ${need}　届かなかった</span>`;
  await wait(ok?620:780);
  ov.className="diceOv";
  return k;
}
function popNum(sel,txt,cls){
  const c=$(sel), d=document.createElement("div");
  d.className="pop"+(cls?" "+cls:""); d.textContent=txt;
  c.appendChild(d); setTimeout(()=>d.remove(),1000);
}

/* ---------- 手番 ---------- */
async function doTurn(id){
  if(busy||over)return;
  busy=true; drawActs(); drawTrain();
  let guard=false;
  if(id==="guard"){
    guard=true; me.mp=Math.min(me.MP,me.mp+4);
    log(`<span class="a">${me.n}</span> は身を固めた　<span class="m">MP +4</span>`);
    drawBoard();
    await wait(420);
  }else{
    const a=ACTS.find(x=>x.id===id);
    const thr=threshold(me.DEX,foe.DEX);
    me.mp-=a.mp;
    const k=await rollDice("こ ち ら の 番",nDice,thr,a.need,a.n);
    if(k>=a.need){
      const dmg=Math.round(me.STR*a.mul/100);
      foe.hp-=dmg;
      popNum("#cFoe","−"+dmg);
      log(`<span class="a">${me.n}</span> の ${a.n}　`+
        `<span class="m">成功 ${k}/${a.need}</span> → <span class="b">${dmg}</span> のダメージ`);
    }else{
      popNum("#cFoe","届かず","miss");
      log(`<span class="a">${me.n}</span> の ${a.n}　`+
        `<span class="m">成功 ${k}/${a.need}</span> → 届かなかった`+
        (a.mp?`　<span class="m">MP −${a.mp}</span>`:""));
    }
    drawBoard();
    await wait(360);
  }
  if(foe.hp<=0)return finish(true);
  await foeTurn(guard);
}

async function foeTurn(guard){
  const thr=threshold(foe.DEX,me.DEX), p=(7-thr)/6;
  /* 相手は 使える中で 見込みのいちばん高い技を選ぶ */
  let best=foe.acts[0], bv=-1;
  for(const a of foe.acts){
    if(a.need>foe.dice)continue;
    const v=atLeast(foe.dice,a.need,p)*foe.STR*a.mul/100;
    if(v>bv){bv=v;best=a;}
  }
  const k=await rollDice("相 手 の 番",foe.dice,thr,best.need,best.n);
  if(k>=best.need){
    let dmg=Math.round(foe.STR*best.mul/100);
    if(guard)dmg=Math.round(dmg/2);
    me.hp-=dmg;
    popNum("#cMe","−"+dmg);
    log(`<span class="b">${foe.n}</span> の ${best.n}　`+
      `<span class="m">成功 ${k}/${best.need}</span> → <span class="b">${dmg}</span> のダメージ`+
      (guard?`　<span class="m">（守って半分）</span>`:""));
  }else{
    popNum("#cMe","届かず","miss");
    log(`<span class="b">${foe.n}</span> の ${best.n}　`+
      `<span class="m">成功 ${k}/${best.need}</span> → 届かなかった`);
  }
  drawBoard();
  await wait(360);
  if(me.hp<=0)return finish(false);
  busy=false; newRound();
}

function finish(win){
  over=true; busy=false; drawAll();
  $("#endBox").innerHTML=`<div class="end${win?"":" lose"}">${
    win?"相 手 を 退 け た":"倒 れ た"}</div>`;
  log(win?`<span class="a">${foe.n}</span> を退けた`:`<span class="b">${me.n}</span> は倒れた`,"rnd");
}

/* ---------- つまみ ---------- */
$("#dMinus").onclick=()=>{ if(nDice>1){nDice--;drawAll();} };
$("#dPlus").onclick =()=>{ if(nDice<8){nDice++;drawAll();} };
$("#xMinus").onclick=()=>{ me.DEX=Math.max(5,me.DEX-5);drawAll(); };
$("#xPlus").onclick =()=>{ me.DEX=Math.min(120,me.DEX+5);drawAll(); };
$("#again").onclick =()=>reset(true);
reset(false);
</script>
