    await wait(105);
  }
  clearInterval(spin);
  const hits=rolls.filter(v=>v>=thr).length;
  rolls.forEach((v,i)=>{
    if(noBonus||v<thr||!els[i])return;
    const r=dieRate(v,thr);
    const b=document.createElement("i");
    b.className="dvup"+(r>0?" on":"");
    b.textContent=r>0?("+"+Math.round(r*100)+"%"):"±0";
    els[i].appendChild(b);
  });
  $("#dvRes").innerHTML=`<div class="dvRes">${hits} ${noBonus?"成功":"ヒット"}`+
    (noBonus?"":`<span class="dvnote">この目ごとに威力が変わる</span>`)+`</div>`;
  await wait(430);
  return hits;
}
async function addDice(extra,thr){
  const row=$("#dvRow");const out=[];
  for(const v of extra){
    const s=document.createElement("span");s.className="dv roll";s.textContent=r6();
    row.appendChild(s);SFX.diceOne();await wait(230);
    s.classList.remove("roll");s.textContent=v;
    if(v>=6){s.classList.add("six");SFX.crit();}else if(v>=thr)s.classList.add("hit");
    out.push(v);await wait(110);
  }
  return out;
}
function cellOf(u){
  return u===me?document.querySelector('.cell[data-me="1"]')
               :document.querySelector(`.cell[data-id="${u.id}"]`);
}
async function lungeUnit(u){
  const c=cellOf(u);if(!c)return;
  const p=c.querySelector(".por");if(!p)return;
  const dir=(u===me)?1:-1;
  p.style.transform=`translateX(${dir*16}px)`;
  await wait(130);
  p.style.transform="translateX(0)";
}
function fxOn(u,kind){
  const c=cellOf(u);if(!c)return;
  const d=document.createElement("div");
  d.className="fx "+kind;
  c.appendChild(d);
  setTimeout(()=>{if(d.parentNode)d.parentNode.removeChild(d);},760);
  const sv=c.querySelector(".por svg");
  if(sv&&(kind==="slash"||kind==="blunt"||kind==="bow"||kind==="magic")){
    sv.classList.remove("hitfx");void sv.offsetWidth;sv.classList.add("hitfx");
  }
}
function setHPBar(u,val){
  const c=cellOf(u);if(!c)return;
  const bar=c.querySelector(".bar i"), num=c.querySelector(".chp");
  if(bar)bar.style.width=Math.max(0,val/u.maxHP*100)+"%";
  if(num)num.textContent=`${Math.max(0,Math.round(val))}/${u.maxHP}`;
}
function popOn(f,text,cls){
  const el=document.querySelector(`.cell[data-id="${f.id}"]`);
  if(!el)return;
  const p=document.createElement("div");p.className="pop "+(cls||"");p.textContent=text;
  el.appendChild(p);

}
function popSelf(text,cls){
  const el=document.querySelector('.cell[data-me="1"]');
  if(!el)return;
  const p=document.createElement("div");p.className="pop "+(cls||"");p.textContent=text;
  el.appendChild(p);
}
function log(html,cls){
  const d=document.createElement("div");d.className="lg "+(cls||"");d.innerHTML=html;
  $("#log").appendChild(d);$("#log").scrollTop=$("#log").scrollHeight;
}

/* ---------- 攻撃の解決 ---------- */
let killedThisAttack=false,sawSix=false;
async function playerAttack(targets,opt){
  opt=opt||{};
  killedThisAttack=false;sawSix=false;me.attackedLast=true;
  let n=Math.max(1,me.wep.hands+(opt.dice||0)+scoutBonus+passOn("dice")
    -ailSum(me,"shrink"));
  const pn=passNames("dice");
  if(pn.length)log(`<span class="c">${pn.join("・")}</span> 攻撃ダイス <span class="m">+${passOn("dice")}</span>`);
  if(scoutBonus){
    log(`<span class="a">先制</span> 探索で先を取った　攻撃ダイス <span class="m">+${scoutBonus}</span>`);
    scoutBonus=0;
  }
  const thr=threshold(me,targets[0],{...opt,thr:(opt.thr||0)+passOn("thr")});
  let rolls=[];for(let i=0;i<n;i++)rolls.push(r6());
  await rollDice(rolls,thr,`${me.name} → ${targets.map(t=>t.name).join("・")}　<em>${n}d6 ・ ${thr}以上</em>`);
  if(opt.chain||passOn("chain")){
    let q=rolls.filter(v=>v>=6).length,add=[],g=0;
    while(q>0&&g++<6){const v=r6();add.push(v);q--;if(v>=6)q++;}
    if(add.length){
      log(`<span class="a">連撃</span> 6の目から <span class="m">+${add.length}</span> ダイス`);
      rolls=rolls.concat(await addDice(add,thr));
    }
  }
  let hits=rolls.filter(v=>v>=thr).length;
  let sixes=rolls.filter(v=>v>=6).length;
  ovHide();
  /* 一つも当たらなかったとき、もう一度だけ振る。
     ヒュームの「人の業」は必ず 1 つ、幸運は 1d100 ≦ 幸運 でもう 1 つ。
     重なれば 2 つ振れる。
     （ここは早期 return の手前。以前は的ごとの判定の中に書いてあって、
       ふつうの攻撃では一度も届いていなかった） */
  let rerolled=false;
  if(!hits){
    let luck=passOn("luck");
    let lnames=passNames("luck");
    const lr=lukRoll(lukOf());       /* 段階のぶんだけ増える。はずれなら 0 */
    if(lr.k>0){luck+=lr.k;lnames=lnames.concat([`幸運 ${lr.s}　<em>1d100 ${lr.v}／${lr.p}</em>`]);}
    if(luck>0){
      rerolled=true;
      const extra=[];for(let i=0;i<luck;i++)extra.push(r6());
      log(`<span class="c">${lnames.join("・")}</span> 空振り → もう <span class="m">${luck}</span> つ振る　[${extra.join("][")}]`);
      await rollDice(extra,thr,`${me.name}　<em>振り直し ${luck}d6</em>`,"再 挑 戦");
      ovHide();
      rolls=rolls.concat(extra);
      hits=rolls.filter(v=>v>=thr).length;
      sixes=rolls.filter(v=>v>=6).length;
    }
  }
  if(!hits){SFX.miss();log(`<span class="a">${me.name}</span> ${n}d6・${thr}以上 → 空振り`);await wait(450);return;}
  for(const t of targets){
    if(t.HP<=0)continue;
    let pow=powOf(me,opt)+passOn("pow")+(me.tmpPow||0);
    if(passOn("fixate")>0){
      if(me.fixId===t.id)me.fixN=Math.min(3,(me.fixN||0)+1);
      else {me.fixId=t.id;me.fixN=0;}
    }
    let pmul=1+(passOn("powp")+passOn("allround")*6+passOn("fang")*8
      +(me.beast?me.beast.pow:0)+(me.goldPow?me.goldPow.v:0)
      +(me.selfPow?me.selfPow.v:0))/100;
    if(passOn("blood")>0&&t.HP<=t.maxHP*0.5)pmul+=passOn("blood")/100;
    let skm=1;
    if(opt.jealous&&t){
      const r=1+Math.min(0.6,Math.max(0,(t.HP-me.HP)/Math.max(1,me.maxHP))*0.6);
      skm*=r;
      log(`<span class="c">妬 心</span> 相手のほうが多く持っている　威力 <span class="m">×${r.toFixed(2)}</span>`);
    }
    if(opt.rage){
      const r=1+Math.min(0.6,(me.taken||0)/me.maxHP*0.8);
      skm*=r;
      log(`<span class="c">逆 境</span> これまでに受けた ${me.taken||0} が 威力 <span class="m">×${r.toFixed(2)}</span> になる`);
    }
    if(opt.lostPow){
      const r=1+Math.min(0.45,(1-me.HP/me.maxHP)*0.6);
      skm*=r;
      log(`<span class="c">火事場の力</span> 威力 <span class="m">×${r.toFixed(2)}</span>`);
    }
    pow=Math.round(pow*pmul*skm);
    if(opt.jealous&&t){
      const r=1+Math.min(0.6,Math.max(0,(t.HP-me.HP)/Math.max(1,me.maxHP))*0.6);
      skm*=r;
      log(`<span class="c">妬 心</span> 相手のほうが多く持っている　威力 <span class="m">×${r.toFixed(2)}</span>`);
    }
    if(opt.rage){
      const r=1+Math.min(0.6,(me.taken||0)/me.maxHP*0.8);
      skm*=r;
      log(`<span class="c">逆 境</span> これまでに受けた ${me.taken||0} が 威力 <span class="m">×${r.toFixed(2)}</span> になる`);
    }
    if(opt.lostPow){
      const lost=1-me.HP/me.maxHP;
      const add=Math.round(Math.min(30,lost*40));
      pow+=add;
      if(add)log(`<span class="c">火事場の力</span> 失った HP のぶん 威力 <span class="m">+${add}</span>`);
    }
    const pen=Math.min(1,(opt.pen||0)+passOn("pen")/100);
    const per=perHit(pow,Math.round(defOf(t)*(1-pen)));
    let vals=(opt.even?rolls.filter(v=>v%2===0):rolls.filter(v=>v>=thr)).sort((a,b)=>a-b);
    /* 一つも当たらなかったとき、もう一度だけ振る */
    /* 「偶数の目だけ当たる」技は、当たりはあっても偶数が無いことがある。
       そのときだけ、まだ振り直していなければもう一度だけ振る。 */
    let luck=opt.even&&!rerolled?passOn("luck"):0;
    let lnames=passNames("luck");
    if(opt.even&&!rerolled&&!vals.length){
      const lr2=lukRoll(lukOf());
      if(lr2.k>0){luck+=lr2.k;lnames=lnames.concat([`幸運 ${lr2.s}`]);}
    }
    if(luck>0&&!vals.length){
      rerolled=true;
      const extra=[];for(let i=0;i<luck;i++)extra.push(r6());
      log(`<span class="c">${lnames.join("・")}</span> 空振り → もう <span class="m">${luck}</span> つ振る　[${extra.join("][")}]`);
      await rollDice(extra,thr,`${me.name}　<em>振り直し ${luck}d6</em>`,"再 挑 戦");
      ovHide();
      rolls.push(...extra);
      vals=(opt.even?extra.filter(v=>v%2===0):extra.filter(v=>v>=thr)).sort((a,b)=>a-b);
    }
    const each=vals.map(v=>hitDmg(per,v,opt.even?2:thr));
    const base=per*hits;
    const atkEl=opt.el||(me.coat&&me.coat.el)||me.wep.el||"none";
    const em=elemMul(atkEl,t);
    let dmg=Math.round((each.reduce((a,b)=>a+b,0)+sixes*((opt.six||0)+passOn("six")))
      *orgMul("outMul")*em);
    const rate=base?dmg/base-1:0;
    const startHP=t.HP, endHP=Math.max(0,t.HP-dmg);
    const shown=Math.min(hits,5);
    for(let i=0;i<shown;i++){
      await lungeUnit(me);
      SFX.atk(me.wep.snd);
      fxOn(t,me.wep.snd);
      const v=(i===shown-1)?each.slice(i).reduce((a,b)=>a+b,0):each[i];
      popOn(t,"−"+v,"each"+(em>1?" weakhit":em<1?" resisthit":""));
      setHPBar(t,startHP-(startHP-endHP)*(i+1)/shown);
      await wait(170);
    }
    t.HP=endHP;
    const pin=passOn("pin");
    if(pin>0&&vals.length>=pin&&t.HP>0){
      ailAdd(t,"slow",8,2);
      popOn(t,"鈍 足","blk");
      log(`　<span class="c">影縫い</span>　<span class="b">${t.name}</span> が 鈍足になった`);
    }
    if(opt.ail&&t.HP>0){
      opt.ail.forEach(a=>{
        ailAdd(t,a.k,a.v||0,a.t||2);
        popOn(t,AIL[a.k].n,"blk");
      });
      log(`　<span class="b">${t.name}</span> に `+
        opt.ail.map(a=>`<span class="c">${AIL[a.k].n}</span>`).join("・"));
      draw();
    }
    if(em>1&&t.key){learnElem(t.key,"weak",atkEl);
      fxOn(t,"charge");popOn(t,"弱 点","weakhit");}
    else if(em<1&&t.key)learnElem(t.key,"resist",atkEl);
    if(opt.stun)t.stun=true;
    draw();popOn(t,"−"+dmg,(em>1?"weakhit":em<1?"resisthit":""));SFX.dmg();
    log(`<span class="a">${me.name}</span> → <span class="b">${t.name}</span>　`+
      `${n}d6・${thr}以上 <span class="m">${hits}ヒット</span>　`+
      `基礎 ${per} → ${vals.map((v,i)=>`${v}の目 ${each[i]}`).join("　")}`+
      (sixes&&opt.six?`　6の目 ${sixes}×${opt.six}`:"")+
      (t.block?`　<span class="c">相手の軽減 −${t.block}/ヒット</span>`:"")+
      (em>1?`　<span class="m">${ELEM[atkEl].n} が弱点　×${em.toFixed(2)}</span>`
        :em<1?`　<span class="c">${ELEM[atkEl].n} に耐性　×${em.toFixed(2)}</span>`:"")+
      `　→ <span class="m">${dmg}</span>`+(t.HP<=0?`　<span class="b">撃破</span>`:""));
    if(opt.charm&&t.HP>0){
      ailAdd(t,"charm",0,opt.charm);
      popOn(t,"混 乱","blk");
      log(`　<span class="c">魅 了</span>　<span class="b">${t.name}</span> は 誰が敵か 分からなくなった`);
      draw();
    }
    if(opt.steal&&t.buffs&&t.buffs.length){
      const b=t.buffs.shift();
      const pct=Math.max(5,Math.round(b.v/Math.max(1,t.STR)*100));
      me.selfPow={v:pct,t:Math.max(1,b.t)};
      popOn(t,"奪 取","weakhit");popSelf("+"+pct+"%","blk");
      log(`　<span class="c">簒 奪</span>　<span class="b">${t.name}</span> の強化を奪った（威力 <span class="m">+${pct}%</span>）`);
      draw();
    }
    if(opt.lifeSteal&&dmg>0){
      const h=Math.min(Math.round(dmg*opt.lifeSteal),me.maxHP-me.HP);
      if(h>0){me.HP+=h;popSelf("+"+h,"heal");
        log(`　<span class="c">捕 食</span>　HP <span class="m">+${h}</span>`);}
    }
    if(opt.devour&&t.HP>0&&t.HP<=t.maxHP*opt.devour&&!RUN.boss){
      log(`　<span class="c">丸 呑 み</span>　<span class="b">${t.name}</span> を 呑み込んだ`);
      t.HP=0;fxOn(t,"blunt");popOn(t,"呑 込","weakhit");SFX.dmg();
    }
    if(opt.mpDrain&&dmg>0){
      const g=Math.min(Math.round(me.maxMP*opt.mpDrain),me.maxMP-me.MP);
      if(g>0){me.MP+=g;popSelf("MP+"+g,"blk");
        log(`　<span class="c">魔力を吸い取った</span>　MP <span class="m">+${g}</span>`);}
    }
    if(opt.loot&&dmg>0){
      const g=Math.max(1,Math.round(dmg*opt.loot*(1+passOn("gold")/100)));
      me.gold+=g;popOn(t,"金"+g,"blk");
      log(`　<span class="c">略奪</span>　金貨 <span class="m">+${g}</span>`);
    }
    if(t.HP<=0){
      killedThisAttack=true;
      if(opt.feast){
        const h=Math.min(Math.round(me.maxHP*opt.feast),me.maxHP-me.HP);
        if(h>0){me.HP+=h;popSelf("+"+h,"heal");
          log(`　<span class="c">暴飲暴食</span>　HP <span class="m">+${h}</span>`);}
      }
      const dh=passOn("devourHeal");
      if(dh>0&&me.HP<me.maxHP){
        const h=Math.min(Math.round(t.maxHP*dh/100),me.maxHP-me.HP);
        if(h>0){me.HP+=h;popSelf("+"+h,"heal");
          log(`　<span class="c">悪 食</span>　HP <span class="m">+${h}</span>`);}
      }
      const fd=passOn("feed");
      if(fd>0&&me.HP<me.maxHP){
        const h=Math.min(Math.round(me.maxHP*fd/100),me.maxHP-me.HP);
        me.HP+=h;popSelf("+"+h,"heal");
        log(`<span class="c">捕 食</span> HP <span class="m">+${h}</span>`);
      }
    }
    if(sixes>0)sawSix=true;
    await wait(420);
  }
  draw();
}

/* ---------- プレイヤーの手番 ---------- */
async function resolvePlayer(a,target){
  if(busy||over)return;
  busy=true;$("#acts").innerHTML="";$("#prompt").textContent="";
  if(a.kind==="atk"){
    me.lastSk=null;
    await playerAttack([target],{});
  }else if(a.kind==="skill"){
    const s=me.sk[a.i];
    me.MP-=s.mp;s.cdLeft=s.cd;
    if(s.toBack&&me.rank!=="back"){
      me.rank="back";draw();
      log(`<span class="a">${me.name}</span> は後衛へ下がった`);
    }
    log(`<span class="a">${me.name}</span> が <span class="c">${s.n}</span>（MP −${s.mp}）`);
    if(s.kind==="guard"){
      me.block+=s.block;
      if(s.counter)me.counter=s.counter;
      draw();fxOn(me,"guard");popSelf("+"+s.block,"blk");SFX.open();
      if(s.counter)log(`<span class="a">${me.name}</span> は反撃の構えを取った（受けた分の ${
        Math.round(s.counter*100)}% を返す）`);
      await wait(650);}
    else if(s.kind==="focus"&&s.goldPow){
      if(me.gold<s.payGold){
        log(`金貨が足りない`);busy=false;drawActs();return;
      }
      me.gold-=s.payGold;
      me.goldPow={v:s.goldPow,t:s.dur||2};
      draw();fxOn(me,"charge");popSelf("+"+s.goldPow+"%","blk");SFX.buff();
      log(`<span class="a">${me.name}</span> は 金貨 ${s.payGold} を撒いた（威力 +${s.goldPow}%　${(s.dur||2)+1}ターン）`);
      await wait(650);}
    else if(s.kind==="focus"&&s.beast){
      me.beast={...s.beast,t:s.dur||2};
      draw();fxOn(me,"charge");popSelf("獣 化","blk");SFX.buff();
      log(`<span class="a">${me.name}</span> が <span class="c">獣</span> になった`+
        `（威力 +${s.beast.pow}%　DEX +${s.beast.dex}　DEF 半減　${(s.dur||2)+1}ターン）`);
      await wait(700);}
    else if(s.kind==="focus"&&s.elCoat){
      me.coat={el:s.elCoat,t:s.dur||2};
      draw();fxOn(me,"charge");popSelf(ELEM[s.elCoat].n,"blk");SFX.buff();
      log(`<span class="a">${me.name}</span> に <span class="c">${ELEM[s.elCoat].n}</span> の力が宿った（${(s.dur||2)+1}ターン）`);
      await wait(650);}
    else if(s.kind==="focus"&&s.dex){
      me.dexUp=(me.dexUp||0)+s.dex;
      buildQueue&&null;
      draw();fxOn(me,"charge");popSelf("DEX+"+s.dex,"blk");SFX.buff();
      log(`<span class="a">${me.name}</span> は身を軽くした（DEX +${s.dex}　この戦闘のあいだ）`);
      await wait(650);}
    else if(s.kind==="focus"){
      me.focus={v:s.thr,t:s.dur||1};
      draw();fxOn(me,"charge");popSelf("集 中","blk");SFX.buff();
      log(`<span class="a">${me.name}</span> は狙いを定めた（命中閾値 −${s.thr}　${(s.dur||1)+1}ターン）`);
      await wait(650);}
    else if(s.kind==="buff"){me.half=true;draw();fxOn(me,"charge");popSelf("半減","blk");SFX.buff();await wait(650);}
    else if(s.kind==="heal"){
      const h=Math.min(Math.round(me.maxHP*s.heal),me.maxHP-me.HP);
      me.HP+=h;draw();fxOn(me,"charge");popSelf("+"+h,"heal");SFX.found();
      log(`<span class="a">${me.name}</span> は傷を手当てした　HP <span class="m">+${h}</span>`);
      await wait(650);
    }
    else if(s.kind==="breath"){
      const g=Math.min(s.mpGain,me.maxMP-me.MP);
      me.MP+=g;me.block+=s.block;draw();fxOn(me,"guard");
      popSelf("MP+"+g,"blk");SFX.open();
      log(`<span class="a">${me.name}</span> は息を整えた　MP <span class="m">+${g}</span>　DEF +${s.block}`);
      await wait(650);
    }
    else{
      let ts=[target];
      if(s.all){
        const rank=s.anyRank?(aliveIn("back").length&&me.wep.type==="ranged"&&aliveIn("front").length===0?"back":"front"):"front";
        ts=aliveIn(rank);
        if(!ts.length)ts=alive();
        log(`<span class="a">範囲攻撃</span> ${ts.map(x=>x.name).join("・")} を巻き込む`);
      }
      if(s.pierce){
        const same=alive().filter(x=>x.rank===target.rank);
        ts=same.slice(0,2);
        if(ts.length>1)log(`<span class="a">貫通</span> ${ts.map(x=>x.name).join("・")} を貫く`);
      }
      if(s.allFoes){
        ts=alive();
        log(`<span class="a">${s.n}</span> が 場のすべてに 響く`);
      }
      if(s.column){
        const mate=columnMate(target);
        ts=mate?[target,mate]:[target];
        if(mate)log(`<span class="a">縦に貫く</span> ${ts.map(x=>x.name).join("・")}`);
      }
      await playerAttack(ts,{pow:s.pow||0,thr:s.thr||0,dice:s.dice||0,
        chain:s.chain,six:s.six,powMul:s.powMul,stun:s.stun,
        el:s.el,ail:s.ail,fixDice:s.fixDice,pen:s.pen,even:s.even,column:s.column,
        lostPow:s.lostPow,mpDrain:s.mpDrain,loot:s.loot,allFoes:s.allFoes,
        rage:s.rage,lostDice:s.lostDice,lifeSteal:s.lifeSteal,devour:s.devour,feast:s.feast,
        steal:s.steal,jealous:s.jealous,charm:s.charm,
        again:s.again&&!s.usedAgain,killed:[]});
      if(s.selfDef)me.selfDef=(me.selfDef||0)+s.selfDef;
      if(s.selfBuff){
        me.selfPow={v:s.selfBuff.pow,t:s.selfBuff.t||1};
        log(`<span class="a">${me.name}</span> の血が滾る（威力 +${s.selfBuff.pow}%　${(s.selfBuff.t||1)+1}ターン）`);
      }
      if(passOn("quick")>0&&sawSix&&s.cdLeft>0){
        s.cdLeft=Math.max(0,s.cdLeft-passOn("quick"));
        log(`<span class="c">詠唱短縮</span>　<span class="a">${s.n}</span> の再使用待ちが 1 減った`);
      }
      if(s.again&&!s.usedAgain&&killedThisAttack&&alive().length){
        s.usedAgain=true;
        me.again=true;
        SFX.found();
        log(`<span class="a">追い討ち</span> 仕留めた勢いで もう一度 動ける`);
      }
    }
  }else if(a.kind==="guard"){
    me.block+=a.block;
    me.idle=true;
    const gm=Math.min(GUARD_MP+passOn("medit"),me.maxMP-me.MP);
    me.MP+=gm;
    me.sk.forEach(k=>{if(k.cdLeft>0)k.cdLeft--;});
    const gh=(ORIG[sel.orig]&&ORIG[sel.orig].guardHeal)||0;
    if(gh){const hh=Math.min(Math.round(me.maxHP*gh),me.maxHP-me.HP);
      if(hh){me.HP+=hh;popSelf("+"+hh,"heal");}}
    draw();fxOn(me,"guard");popSelf("+"+a.block,"blk");SFX.open();
    log(`<span class="a">${me.name}</span> は身を固めた　<span class="c">DEF ${me.DEF}+${me.block}</span>`+
      (gm?`　MP <span class="m">+${gm}</span>`:"")+`　再使用待ちが1進む`);
    await wait(600);
  }else if(a.kind==="move"){
    me.rank=a.to;SFX.move();draw();
    log(`<span class="a">${me.name}</span> は ${a.to==="front"?"前へ出た":"後ろへ下がった"}`);
    await wait(500);
  }else if(a.kind==="flee"){
    fleeUsed=true;
    const ok=await fleeRoll();
    if(ok){
      over=true;busy=false;pending=null;
      me.ail=[];                    /* 状態異常は戦闘の中だけのもの（finish と同じ） */
      $("#prompt").textContent="";$("#acts").innerHTML="";
      fleeBack();
      return;
    }
    /* 失敗。1ターンを使ったので そのまま敵の手番へ流れる */
  }
  if(!alive().length)return finish(true);
  qi++;
  await runQueue();
}

/* ---------- 待ち行列 ---------- */
/* DEX順の並び。次のラウンドも同じ規則で決まるので、前もって見せられる。
   （鈍足や強化で DEX が変われば当然そのぶん変わる） */
/* first に "me" / "foe" を渡すと、その回だけ DEX を飛び越えて並べ替える。
   索敵で片方だけ成功したときの 1ラウンド目に使う。 */
function orderOf(first){
  const dx=u=>(u===me?dexOf():Math.max(1,u.DEX-ailSum(u,"slow")));
  const list=[me,...alive()].sort((a,b)=>{
    const d=dx(b)-dx(a);
    if(d)return d;
    return a===me?-1:1;
  });
  if(first==="me"||first==="foe"){
    const rest=list.filter(u=>u!==me);
    return first==="me"?[me,...rest]:[...rest,me];
  }
  return list;
}
function buildQueue(){
  /* 索敵の先制が効くのは 1ラウンド目だけ */
  queue=orderOf(round===1?scoutFirst:null); qi=0;
}
async function runQueue(){
  while(qi<queue.length){
    const u=queue[qi];
    if(u.HP<=0){qi++;continue;}
    if(u===me){
      if(me.again){me.again=false;log(`<span class="a">${me.name}</span> は続けて動く`);busy=false;draw();drawActs();return;}
      me.block=0;me.counter=0;me.selfDef=0;
      if(me.holdDef){
        me.holdDef.t--;
        if(me.holdDef.t<0)me.holdDef=null;
        else me.block+=me.holdDef.v;
      }
      if(me.focus){me.focus.t--;if(me.focus.t<0)me.focus=null;}
      if(me.coat){me.coat.t--;if(me.coat.t<0)me.coat=null;}
      if(me.beast){me.beast.t--;if(me.beast.t<0)me.beast=null;}
      if(me.goldPow){me.goldPow.t--;if(me.goldPow.t<0)me.goldPow=null;}
      if(me.selfPow){me.selfPow.t--;if(me.selfPow.t<0)me.selfPow=null;}
      me.vow=null;me.hurtThisRound=false;me.fixId=null;me.fixN=0;me.attackedLast=false;me.whim=null;me.holdDef=null;
      if(await ailDot(me)){
        if(passOn("endure")>0&&!me.endured){me.endured=true;me.HP=1;draw();
          popSelf("気 合","heal");log(`<span class="a">気 合</span> HP 1 で耐えた`);}
        else return finish(false);
      }
      ailTick(me);
      if(ailHas(me,"palsy")){
        me.ail=(me.ail||[]).filter(a=>a.k!=="palsy");
        draw();fxOn(me,"guard");popSelf("麻 痺","blk");
        log(`<span class="a">${me.name}</span> は痺れて動けない`);
        await wait(600);qi++;await runQueue();return;}
      busy=false;draw();drawActs();return;}
    await enemyAct(u);
    if(me.HP<=0)return finish(false);
    if(!alive().length)return finish(true);
    qi++;draw();
  }
  await endRound();
}

/* ---------- 敵1体の行動 ---------- */
async function enemyAct(f){
  f.block=0;tickBuffs(f);if(f.sumCd>0)f.sumCd--;   // 構えとバフはここで切れる
  draw();
  await wait(260);
  if(await ailDot(f)){draw();return;}
  ailTick(f);
  if(f.stun||ailHas(f,"palsy")){
    f.stun=false;
    f.ail=(f.ail||[]).filter(a=>a.k!=="palsy");
    draw();fxOn(f,"guard");popOn(f,"麻 痺","blk");
    log(`<span class="b">${f.name}</span> は痺れて動けない`);await wait(500);return;}
  const t=f.tele;
  if(t.k==="atk"){
    const reach=(f.rank==="front"&&me.rank==="back");   // 後衛には手が届きにくい
    let per=perHit(powOf(f,{pow:t.pow||0}),defOf(me));
    if(reach)per=Math.max(1,Math.round(per*0.6));
    const rolls=[];for(let i=0;i<t.dice;i++)rolls.push(r6());
    const thr=threshold(f,me,{});
    await rollDice(rolls,thr,`${f.name} → ${me.name}　<em>${t.dice}d6 ・ ${thr}以上</em>`);
    const hits=rolls.filter(v=>v>=thr).length;
    ovHide();
    const ev=rolls.filter(v=>v>=thr).sort((a,b)=>a-b);
    const evals=ev.map(v=>hitDmg(per,v,thr));
    let dmg=Math.round(evals.reduce((a,b)=>a+b,0)*orgMul("inMul"));
    if(me.half){dmg=Math.round(dmg/2);me.half=false;}
    let endHP0=me.HP-dmg;
    if(endHP0<=0&&passOn("endure")>0&&!me.endured){
      me.endured=true;endHP0=1;
      log(`<span class="a">気 合</span> 倒れずに <span class="m">HP 1</span> で踏みとどまった`);
    }
    const startHP=me.HP, endHP=Math.max(0,endHP0);
    me.taken=(me.taken||0)+Math.max(0,startHP-endHP);
    if(startHP>endHP)me.hurtThisRound=true;
    if(hits){
      const shown=Math.min(hits,5);
      for(let i=0;i<shown;i++){
        await lungeUnit(f);
        SFX.atk(f.snd);
        fxOn(me,f.snd);
        const v=(i===shown-1)?evals.slice(i).reduce((a,b)=>a+b,0):evals[i];
        popSelf("−"+v,"each");
        setHPBar(me,startHP-(startHP-endHP)*(i+1)/shown);
        await wait(160);
      }
    }else SFX.miss();
    me.HP=endHP;
    if(t.drain&&dmg>0){
      const hl=Math.min(Math.round(dmg*t.drain),f.maxHP-f.HP);
      if(hl>0){f.HP+=hl;fxOn(f,"charge");popOn(f,"+"+hl,"heal");
        log(`<span class="b">${f.name}</span> が <span class="m">${hl}</span> 吸い取った`);}
    }
    draw();
    if(hits){popSelf("−"+dmg);SFX.dmg();}
    if(me.counter&&dmg>0&&f.HP>0){
      const back=Math.max(1,Math.round(dmg*me.counter));
      f.HP=Math.max(0,f.HP-back);
      fxOn(f,"slash");popOn(f,"−"+back,"each");SFX.dmg();
      log(`　<span class="a">反撃</span>　<span class="b">${f.name}</span> に <span class="m">${back}</span>`);
      draw();await wait(360);
      if(f.HP<=0)draw();
    }
    log(`<span class="b">${f.name}</span> → <span class="a">${me.name}</span>　`+
      `${t.dice}d6 <span class="m">${hits}ヒット</span>　`+
      `基礎 ${per} → ${ev.map((v,i)=>`${v}の目 ${evals[i]}`).join("　")}`+
      (me.block?`　<span class="c">軽減 −${me.block}/ヒット</span>`:"")+`　→ <span class="m">${dmg}</span>`);
    await wait(430);
  }else if(t.k==="guard"){
    f.block+=t.block;draw();fxOn(f,"guard");popOn(f,"+"+t.block,"blk");SFX.open();
    log(`<span class="b">${f.name}</span> は身を固めた（防御 +${f.block}／ヒット）`);await wait(450);
  }else if(t.k==="buff"){
    addBuff(f,t.pow,t.dur||1);f.lastAid=t.n;
    if(t.forceNext)f.forceNext=t.forceNext;
    draw();fxOn(f,"charge");popOn(f,"力+"+t.pow,"blk");SFX.open();
    log(`<span class="b">${f.name}</span> が力をためた（威力 +${t.pow}　${(t.dur||1)+1}ターン）`);
    await wait(450);
  }else if(t.k==="cheer"){
    f.lastAid=t.n;aliveIn("front").forEach(x=>{addBuff(x,t.pow,t.dur||1);});
    draw();aliveIn("front").forEach(x=>{fxOn(x,"charge");popOn(x,"力+"+t.pow,"blk");});SFX.open();
    log(`<span class="b">${f.name}</span> が前列を鼓舞した（威力 +${t.pow}）`);await wait(500);
  }else if(t.k==="summon"){
    f.lastAid=t.n;f.sumUsed=true;f.sumCd=t.cd||0;
    const n=Math.min(1+Math.floor(Math.random()*3),3-aliveIn("front").length);
    if(n<=0){log(`<span class="b">${f.name}</span> は呼んだが、誰も来なかった`);await wait(450);}
    else{
      const dm=depthMul();
      for(let i=0;i<n;i++){
        const base=FOE[t.who];
        const hp=Math.round(base.HP*dm);
        const nf={...base,id:foes.length,key:t.who,
          name:base.n+" "+"ABCDEF"[foes.filter(x=>x.key===t.who).length],
          maxHP:hp,HP:hp,STR:Math.round(base.STR*(1+(dm-1)*0.6)),
          block:0,buffs:[],ail:[],stun:false,isFoe:true,
          rank:"front",tele:null,next:null,lastAid:null,turn:0,sumCd:0,sumUsed:false};
        nf.tele=chooseTele(nf);nf.next=chooseTele(nf);
        foes.push(nf);
        /* 呼ばれた者は この場ですぐ 順番に加わる */
        queue.push(nf);
      }
      draw();drawOrder();SFX.found();
      log(`<span class="b">${f.name}</span> が <span class="c">${FOE[t.who].n}</span> を ${n} 体 呼び寄せた`);
      await wait(700);
    }
  }else if(t.k==="regen"){
    const hl=Math.min(t.heal,f.maxHP-f.HP);
    f.HP+=hl;draw();fxOn(f,"charge");popOn(f,"+"+hl,"heal");SFX.found();
    log(`<span class="b">${f.name}</span> は傷を塞いだ　HP <span class="m">+${hl}</span>`);
    await wait(620);
  }else if(t.k==="hex"){
    /* 弱体は状態異常として乗せる。前は me.curse / me.weak に足していたが、
       それを読む計算がどこにも無く、ログと表示だけ出て数字が動いていなかった。
       weak は 1 につき 15% の威力低下（前の表示に合わせてある）。 */
    const dur=t.dur||2, msg=[];
    if(t.curse){ailAdd(me,"break",t.curse,dur);msg.push(`DEF <span class="m">−${t.curse}</span>`);}
    if(t.weak){ailAdd(me,"weakp",t.weak*15,dur);msg.push(`威力 <span class="m">−${t.weak*15}%</span>`);}
    if(t.slow){ailAdd(me,"slow",t.slow,dur);msg.push(`DEX <span class="m">−${t.slow}</span>`);}
    if(t.blind){ailAdd(me,"blur",t.blind,dur);msg.push(`命中が <span class="m">${t.blind}</span> 遠のく`);}
    if(t.dice){ailAdd(me,"shrink",t.dice,dur);msg.push(`攻撃ダイス <span class="m">−${t.dice}</span>`);}
    draw();fxOn(me,"magic");
    popSelf(t.curse?"防御−":t.dice?"手数−":"威力−","each");SFX.atk("magic");
    log(`<span class="b">${f.name}</span> の <span class="c">${t.n}</span>　`+
      (msg.length?msg.join("　")+`　<span class="s">（${dur+1}ターン）</span>`:"効き目がなかった"));
    await wait(620);
  }else if(t.k==="veil"){
    aliveIn("front").forEach(x=>{x.block+=t.block;});
    draw();aliveIn("front").forEach(x=>{fxOn(x,"guard");popOn(x,"+"+t.block,"blk");});SFX.open();
    log(`<span class="b">${f.name}</span> が霧を張った（前列に防御 +${t.block}／ヒット）`);await wait(500);
  }
}

async function endRound(){
  me.sk.forEach(s=>{if(s.cdLeft>0)s.cdLeft--;});
  me.MP=Math.min(me.maxMP,me.MP+1);
  round++;me.hurtThisRound=false;
  foes.forEach(f=>{if(f.HP>0){f.tele=f.next||chooseTele(f);f.next=chooseTele(f);}});
  buildQueue();
  draw();
  log(`ラウンド ${round}`,"rnd");
  ovMsg(`ラウンド ${round}`,true);
  await wait(620);
  ovHide();
  await runQueue();
}
async function finish(win){
  over=true;busy=false;pending=null;
  /* 状態異常は戦闘の中だけのもの。持続をターン数で測っているので、
     手番の無い探索中に持ち越すと永久に減らない。戦闘が終わったら必ず落とす。
     （前は次の戦闘の開始時に消していたので、探索中だけ中途半端に残っていた） */
  me.ail=[];
  $("#prompt").textContent="";
  if(!win){
    $("#acts").innerHTML=`<div class="end lose">戦 死</div>`;
    SFX.lose();
    await wait(1200);
    endRun(false);return;
  }
  SFX.win();
  ovMsg(`討 伐`,true);
  log(`<span class="a">討伐</span> ${round} ラウンド　残 HP ${me.HP}`);
  await wait(900);
  const kind=RUN.boss?"boss":(RUN.elite?"elite":"battle");
  const xp=expFor(kind);
  me.exp+=xp;
  ovMsg(`<span class="k">討 伐</span><br>経験 <span class="win">+${xp}</span>`+
    (expToNext()<=0?`<br><span style="color:#c9a227">L E V E L　U P</span>`
      :`<br><span style="font-size:11px;color:#6f7a63">次まで ${expToNext()}</span>`));
  log(`<span class="a">討伐</span> 経験 <span class="m">+${xp}</span>`);
  await wait(1100);
  ovHide();
  showRewards();
}

/* ============ 探索 ============ */
/* ===== 周回をまたぐ記録 =====
   1周ごとに作り直すキャラの外側に残るもの。図鑑・殿堂・弱点の記録・到達階層。
   「強さは持ち帰らせない。持ち帰るのは知識だけ」（HANDOVER §9）の“知識”がこれ。

   localStorage に置く。読めない環境（プライベート窓・容量切れ・
   site data を切っている）でも、保存を諦めるだけで遊べるようにしてある。 */
const META={codex:{},rooms:{},elem:{},mats:{},seen:{},hall:[],runs:0,best:0,
  areas:{},                 /* 踏み入れたことのある区画。世界地図の明るさに使う */
  ended:{},                 /* 終わった潜行の id。古い控えが生き返らないようにする */
  tutSeen:false,newsSeen:""};
const MKEY="dd.meta";
const MVER=1;                /* 中身の形を変えたら上げる。読み込み側で移行する */
const HALLMAX=50;            /* 殿堂は増え続けるので上限を置く。古いものから捨てる */
let metaTimer=null, metaBroken=false;
/* クラウド保存への差し込み口。Cloud が用意できたら中身が入れ替わる。
   Firebase を設定していない・つながらないときは何もしない空のままで、
   ゲームはこれまでどおり端末内(localStorage)だけで動く。 */
const CloudHook={mark(){},flush(){}};

function metaLoad(){
  let raw;
  try{ raw=localStorage.getItem(MKEY); }catch(e){ metaBroken=true; return; }
  if(!raw)return;
  let o;
  try{ o=JSON.parse(raw); }catch(e){ return; }        /* 壊れていたら無かったことにする */
  if(!o||typeof o!=="object")return;
  if(o.v!==MVER)return;                               /* 形が違う。今は捨てる */
  const obj=k=>(o[k]&&typeof o[k]==="object"&&!Array.isArray(o[k]))?o[k]:{};
  META.codex=obj("codex"); META.rooms=obj("rooms");
  META.elem =obj("elem");  META.mats =obj("mats");
  META.seen =obj("seen");  META.areas=obj("areas");
  META.ended=obj("ended");
  META.hall =Array.isArray(o.hall)?o.hall.slice(-HALLMAX):[];
  META.runs =Number.isFinite(o.runs)?o.runs:0;
  META.best =Number.isFinite(o.best)?o.best:0;
  META.tutSeen=!!o.tutSeen;
  META.newsSeen=typeof o.newsSeen==="string"?o.newsSeen:"";
}
function metaWrite(){
  metaTimer=null;
  if(metaBroken)return;
  try{
    if(META.hall.length>HALLMAX)META.hall=META.hall.slice(-HALLMAX);
    localStorage.setItem(MKEY,JSON.stringify({v:MVER,
      codex:META.codex,rooms:META.rooms,elem:META.elem,mats:META.mats,
      seen:META.seen,areas:META.areas,ended:META.ended,
      hall:META.hall,runs:META.runs,best:META.best,
      tutSeen:META.tutSeen,newsSeen:META.newsSeen}));
  }catch(e){ metaBroken=true; }   /* 容量切れなど。以降は諦めて遊べるようにする */
  CloudHook.mark();               /* クラウドへは間を置いてまとめて送る */
}
/* 記録が変わったら呼ぶ。まとめて少し後で書く（1戦で何度も呼ばれるため） */
function touchMeta(){
  if(metaBroken||metaTimer)return;
  metaTimer=setTimeout(metaWrite,400);
}
/* 書く前に閉じられても落とさない */
function metaFlush(){ if(metaTimer){clearTimeout(metaTimer);metaWrite();} CloudHook.flush(); }
function metaClear(){
  META.codex={};META.rooms={};META.elem={};META.mats={};META.seen={};META.areas={};
  META.ended={};
  META.hall=[];META.runs=0;META.best=0;
  /* 遊び方を見たか・お知らせを読んだかは残す。
     消すと毎回チュートリアルに戻され、読んだお知らせがまた未読になって煩わしい */
  metaTimer&&clearTimeout(metaTimer);metaTimer=null;
  metaWrite();
  CloudHook.flush();              /* 消したことはすぐクラウドにも伝える */
}

/* ---------- 潜 行 の 保 存 （つ づ き か ら） ----------
   ノードを1つ抜けるたびに、いまの冒険者と地図をまるごと控える。
   控える瞬間は次の3つ。
     1. 部屋に踏み込む直前（stepTo の頭）… 中で落ちても踏み込む前に戻る
     2. 部屋を抜けて地図に戻ったとき（backToFloor）
     3. 新しい区画に入ったとき（enterArea）
   1 があるので、戦闘中にページを閉じても その戦闘の開始前から続けられる。

   RUN.cur は RUN.M.node の中身を指しているだけなので控えない。
   読み戻すときに curKey から繋ぎ直す。
   RUN.preview・RUN.lootLines はその場かぎりのものなので落とす。 */
const RKEY="dd.run", RVER=1;
let runBroken=false;
function runNewId(){
  return Date.now().toString(36)+Math.random().toString(36).slice(2,8);
}
function runSnapshot(){
  if(!RUN||RUN.over||!RUN.M||!me)return null;
  return {
    v:RVER, ver:VERSION, t:Date.now(), id:RUN.id||null,
    sel:{job:sel.job,race:sel.race,orig:sel.orig,area:sel.area,
         luk:sel.luk,lukD:sel.lukD},
    me, owned,
    run:{act:RUN.act,area:RUN.area,seen:RUN.seen||[],curKey:RUN.curKey||null,
         path:RUN.path||[],M:RUN.M,stock:RUN.stock||null,
         shopRecipe:RUN.shopRecipe===undefined?null:RUN.shopRecipe},
  };
}
function runSave(){
  if(runBroken)return;
  const o=runSnapshot();
  if(!o)return;
  runPut(o);
  CloudHook.mark();                /* クラウドへは間を置いてまとめて送る */
}
/* 控えを端末に置くだけ。RUN には触らない */
function runPut(o){
  try{ localStorage.setItem(RKEY,JSON.stringify(o)); }
  catch(e){ runBroken=true; }      /* 容量切れなど。保存を諦めて遊べるようにする */
}
function runRaw(){
  try{ return JSON.parse(localStorage.getItem(RKEY)||"null"); }catch(e){ return null; }
}
function runClear(){
  try{localStorage.removeItem(RKEY);}catch(e){}
  CloudHook.mark();                /* 消したことをクラウドにも伝える */
}
/* 読めるかどうかまで見る。表の中身が変わって指し先が消えていたら捨てる */
function runLoad(r){
  if(r===undefined)r=runRaw();
  if(!r||r.v!==RVER||!r.me||!r.run||!r.run.M||!r.sel)return null;
  if(r.id&&META.ended[r.id])return null;   /* もう終わった潜行 */
  if(!JOB[r.sel.job]||!RACE[r.sel.race]||!ORIG[r.sel.orig])return null;
  if(!AREAS[r.run.area])return null;
  const N=r.run.M.node||{};
  const ok=Object.keys(N).every(k=>{
    const nd=N[k];
    return !nd.e||!!ENCS[nd.e];        /* 遭遇の鍵が今の表にあるか */
  });
  if(!ok||!Object.keys(N).length)return null;
  return r;
}
function runHas(){ return !!runLoad(); }
const ENDEDMAX=30;               /* 印は増え続けるので、古いものから捨てる */
function endedTrim(){
  const k=Object.keys(META.ended||{});
  if(k.length>ENDEDMAX)k.slice(0,k.length-ENDEDMAX).forEach(x=>delete META.ended[x]);
}
/* クラウドから来た控えと、この端末の控えを突き合わせる。
     どちらか片方しか無い    … あるほうを採る
     同じ潜行（id が同じ）    … 新しいほう（＝先へ進んでいるほう）を採る
     別々の潜行（id が違う）  … どちらを残すか選ばせる
   潜っている最中は触らない。遊んでいる手元の控えが正しいものとして扱う。 */
function runMerge(cloud){
  const c=runLoad(cloud), l=runLoad();
  if(!c&&!l)return;
  if(RUN&&!RUN.over)return;
  if(!l&&c){ runPut(c); if(curScreen==="home")drawHome(); return; }
  if(l&&!c){ CloudHook.mark(); return; }        /* こちらだけ。次の送りで届く */
  if(l.id&&c.id&&l.id===c.id){                  /* 同じ潜行の進み具合の違い */
    if((c.t||0)>(l.t||0)){ runPut(c); if(curScreen==="home")drawHome(); }
    else CloudHook.mark();
    return;
  }
  runPickModal(l,c);
}
/* 別々の潜行が2つあるとき、どちらを残すか選ばせる */
function runPickModal(l,c){
  const row=(ttl,r)=>`<div class="mitem"><b>${ttl}</b><br>${runLabel(r)}</div>`;
  openModal(`<div class="mtitle">続 き が 2 つ あ る</div>
    <div class="msub">この端末とクラウドに、別々の潜行が残っている。<br>
      残すほうを選ぶ。選ばなかったほうは消える。</div>
    ${row("こ の 端 末",l)}${row("ク ラ ウ ド",c)}
    <div class="ndbtn" style="margin-top:12px">
      <button class="no2" id="rpL">この端末のを残す</button>
      <button class="go2" id="rpC">クラウドのを残す</button>
    </div>`);
  $("#rpL").onclick=()=>{ closeModal(); CloudHook.mark();
    if(curScreen==="home")drawHome(); };
  $("#rpC").onclick=()=>{ closeModal(); runPut(c);
    if(curScreen==="home")drawHome(); };
}
/* 続きから始める */
function runResume(){
  const r=runLoad();
  if(!r){ runClear(); drawHome(); return; }
  sel.job=r.sel.job;sel.race=r.sel.race;sel.orig=r.sel.orig;
  sel.area=r.sel.area;sel.luk=r.sel.luk;sel.lukD=r.sel.lukD;
  me=r.me; owned=r.owned||[];
  RUN={id:r.id||runNewId(), act:r.run.act||0, area:r.run.area, seen:r.run.seen||[],
       curKey:r.run.curKey||null, cur:null, path:r.run.path||[],
       M:r.run.M, stock:r.run.stock||null, shopRecipe:r.run.shopRecipe,
       preview:null, over:false, cleared:false, elite:false, boss:false};
  RUN.cur=RUN.curKey?(RUN.M.node[RUN.curKey]||null):null;
  recalcMe(me);                       /* 式が変わっていても組み直す */
  $("#log").innerHTML="";
  drawFloor();showScreen("floor");window.scrollTo(0,0);
  setTimeout(introScroll,120);
}
/* 家に出す一行。どこまで潜っていたか */
function runLabel(rec){
  const r=runLoad(rec); if(!r)return null;
  const A=AREAS[r.run.area]||{};
  const nd=r.run.curKey?(r.run.M.node||{})[r.run.curKey]:null;
  const d=Math.round((Date.now()-(r.t||0))/60000);
  const ago=d<1?"たったいま":d<60?`${d} 分前`:
    (d<1440?`${Math.floor(d/60)} 時間前`:`${Math.floor(d/1440)} 日前`);
  return `${A.n||""}　${nd?`${nd.r+1} / ${ROWS} 段目`:"入口"}`+
    `　<span class="s">${RACE[r.sel.race].n}の${JOB[r.sel.job].n}　Lv ${r.me.lv}`+
    `　HP ${Math.max(0,r.me.HP)}/${r.me.maxHP}　${ago}</span>`;
}

/* ---- 記録の統合 ----
   2台で別々に遊んでいることがある。どちらかを捨てるのではなく、
   数は大きいほう、印は付いているほう、殿堂は両方を混ぜて拾う。
   クラウドから取ってきたものを、いま端末にあるものへ混ぜ込む。      */
const metaMax=(a,b)=>Math.max(Number(a)||0,Number(b)||0);
function metaMergeCount(a,b){          /* 戦った数など。大きいほうを採る */
  const o={...(a||{})};
  Object.keys(b||{}).forEach(k=>{o[k]=Math.max(Number(o[k])||0,Number(b[k])||0);});
  return o;
}
function metaMergeFlag(a,b){           /* 見た・持ったの印。片方でも付いていれば付く */
  const o={...(a||{})};
  Object.keys(b||{}).forEach(k=>{if(b[k])o[k]=true;});
  return o;
}
function metaMergeElem(a,b){           /* elem は {敵:{weak:…,resist:…}} の入れ子 */
  const o={};
  new Set([...Object.keys(a||{}),...Object.keys(b||{})]).forEach(k=>{
    o[k]={...(((b||{})[k])||{}),...(((a||{})[k])||{})};
  });
  return o;
}
function metaMergeHall(a,b){           /* 殿堂は両方を混ぜ、同じ一件は一度だけ */
  const seen=new Set(), out=[];
  [].concat(a||[],b||[]).forEach(h=>{
    if(!h||typeof h!=="object")return;
    const k=h.t!=null?"t"+h.t:"j"+JSON.stringify(h);   /* t が無いのは古い記録 */
    if(seen.has(k))return;
    seen.add(k);out.push(h);
  });
  out.sort((x,y)=>(x.t||0)-(y.t||0));
  return out.slice(-HALLMAX);
}
function metaNewerNews(a,b){           /* NEWS は先頭が新しい。番号が小さいほうを採る */
  const ix=v=>{const i=NEWS.findIndex(x=>x.id===v);return i<0?Infinity:i;};
  return ix(a)<=ix(b)?a:b;
}
function metaSnapshot(){
  return {codex:META.codex,rooms:META.rooms,elem:META.elem,mats:META.mats,
    seen:META.seen,areas:META.areas,ended:META.ended,
    hall:META.hall,runs:META.runs,best:META.best,
    tutSeen:META.tutSeen,newsSeen:META.newsSeen};
}
function metaMerge(r){
  if(!r||typeof r!=="object")return;
  META.codex=metaMergeCount(META.codex,r.codex);
  META.rooms=metaMergeCount(META.rooms,r.rooms);
  META.elem =metaMergeElem (META.elem ,r.elem);
  META.mats =metaMergeFlag (META.mats ,r.mats);
  META.seen =metaMergeFlag (META.seen ,r.seen);
  META.areas=metaMergeFlag (META.areas,r.areas);
  META.ended=metaMergeFlag (META.ended,r.ended);
  endedTrim();
  META.hall =metaMergeHall (META.hall ,r.hall);
  META.runs =metaMax(META.runs,r.runs);
  META.best =metaMax(META.best,r.best);
  META.tutSeen =META.tutSeen||!!r.tutSeen;
  META.newsSeen=metaNewerNews(META.newsSeen,r.newsSeen);
  metaWrite();
  /* 開いている画面は描き直す。数字が黙って古いままなのがいちばん困る */
  try{
    if(!$("#home").classList.contains("hide"))drawHome();
    drawMail();
  }catch(e){}
}

/* ---------- クラウド保存（Firebase） ----------
   端末内(localStorage)を主、クラウドをその写しとして扱う。
   通信が死んでいても、Firebase を設定していなくても、
   ゲームは今までどおり動く ―― この一線は崩さない。

   ■ 鍵の話（大事）
     下の firebaseConfig は「公開してよい識別子」で、秘密ではない。
     誰が誰のものを読み書きできるかを決めているのは firestore.rules のほう。
     逆に serviceAccountKey.json（firebase-admin が使うやつ）は
     全データを無条件に読み書きできる鍵なので、ここには絶対に書かない。
     あれはサーバー（Cloud Functions など）専用で、
     ブラウザに置いた時点で誰でも全ユーザーのデータを消せるようになる。

   ■ ログイン
     起動したら黙って匿名でサインインする。押す操作は要らない。
     あとから「Google と連携」を押せば、同じ記録のまま別の端末で続けられる。

   ■ 置き場所
     Firestore の users/{uid} に META をまるごと1件。
     形は  { v:MVER, meta:{...}, at:サーバー時刻 }。

   設定のしかたは FIREBASE.md に書いてある。                           */
const FBVER="12.18.0";        /* 読み込む Firebase Web SDK の版。上げるならここだけ */
const FIREBASE_CONFIG={
  /* Firebase コンソール → プロジェクトの設定 → マイアプリ（ウェブ）の値。
     ここは公開してよい識別子で、秘密ではない（守りは firestore.rules）。
     空にすればクラウド保存は眠り、端末内だけに残る形へ戻る。 */
  apiKey:"AIzaSyCWT4QUR4_Vzln3lVuHtw8n4nJ7cT6NBu0",
  authDomain:"dicedungeon-a3d1e.firebaseapp.com",
  projectId:"dicedungeon-a3d1e",
  storageBucket:"dicedungeon-a3d1e.firebasestorage.app",
  messagingSenderId:"16242944558",
  appId:"1:16242944558:web:82fddd9cc8bdd94d5e4dbf",
  measurementId:"G-D9QRT88QWX",   /* Analytics 用。いまは読み込んでいない */
};
const CKEY="dd.cloud";        /* 覚えるのは「自分でサインアウトしたか」だけ */
/* 記録の置き場所。games/dicedungeon/players/{uid} という形にしてある。
   いきなり users/{uid} に置くと、同じ Firebase プロジェクトを別のゲームと
   相乗りさせたときに真正面からぶつかる。一段名前を挟んでおけば、
   プロジェクトを分けても共有しても、どちらでも困らない。 */
const CPATH=["games","dicedungeon","players"];
const PUSHWAIT=8000;          /* 書き込みをまとめる間（ミリ秒） */

const Cloud=(()=>{
  let F=null;                 /* 読み込んだ Firebase の入れ物 */
  let auth=null, db=null, user=null;
  let state="off";            /* off / loading / anon / user / out / error */
  let err="", syncedAt=0;
  let pushTimer=null, pushing=false, dirty=false, started=false;
  const watchers=[];

  const fire=()=>watchers.forEach(f=>{try{f();}catch(e){}});
  const set=(s,e)=>{state=s;err=e||"";fire();};
  const configured=()=>!!(FIREBASE_CONFIG.apiKey&&FIREBASE_CONFIG.projectId);
  const offPref=()=>{try{return localStorage.getItem(CKEY)==="off";}catch(e){return false;}};
  const setOff=v=>{try{v?localStorage.setItem(CKEY,"off"):localStorage.removeItem(CKEY);}catch(e){}};

  /* Firebase の言い分を、そのまま出しても分からないので言い換える */
  function msgOf(e){
    const c=(e&&e.code)||"";
    if(c==="sdk/load-failed")return e.message;
    if(/popup-blocked/.test(c))return "ログインの窓が塞がれた。ブラウザで許可する";
    if(/popup-closed|cancelled-popup/.test(c))return "ログインの窓が閉じられた";
    if(/unauthorized-domain/.test(c))
      return "この場所からのログインが許されていない。Firebase の Authentication → 設定 → 承認済みドメイン に足す";
    if(/operation-not-allowed|admin-restricted/.test(c))
      return "その入り方が有効になっていない。Firebase の Authentication → Sign-in method で入れる";
    if(/permission-denied/.test(c))return "書き込みを断られた。firestore.rules を確かめる";
    if(/unavailable|network-request-failed|deadline/.test(c))return "つながらなかった。あとでまた試す";
    if(/failed-precondition/.test(c))return "Firestore がまだ作られていないかもしれない";
    return (e&&(e.message||String(e)))||"わけの分からない不具合";
  }

  /* SDK は使うときになって初めて取りに行く。読めなくてもゲームは止めない */
  async function load(){
    if(F)return F;
    if(location.protocol==="file:"){
      const er=new Error("file:// で開いているとクラウド保存は使えない。http(s) で配ること");
      er.code="sdk/load-failed";throw er;
    }
    const base=`https://www.gstatic.com/firebasejs/${FBVER}/`;
    try{
      const [a,b,c]=await Promise.all([
        import(base+"firebase-app.js"),
        import(base+"firebase-auth.js"),
        import(base+"firebase-firestore.js"),
      ]);
      F={app:a,auth:b,fs:c};        /* 名前がぶつからないように分けて持つ */
    }catch(e){
      const er=new Error(`Firebase SDK を読み込めなかった（版 ${FBVER}）。つながりと版を確かめる`);
      er.code="sdk/load-failed";throw er;
    }
    return F;
  }

  async function start(){
    if(!configured()){set("off");return;}
    if(offPref()){set("out");return;}
    if(state==="loading")return;
    set("loading");
    try{
      const f=await load();
      if(!auth){
        const app=f.app.initializeApp(FIREBASE_CONFIG);
        auth=f.auth.getAuth(app);
        /* undefined が混じると setDoc がまるごと落ちる。記録の一部が
           欠けていても保存は通したいので、黙って捨てさせる。 */
        db=f.fs.initializeFirestore(app,{ignoreUndefinedProperties:true});
        f.auth.onAuthStateChanged(auth,u=>{
          user=u||null;
          if(!user){ set(offPref()?"out":"loading"); return; }
          set(user.isAnonymous?"anon":"user");
          sync();                   /* 入れ替わるたびに突き合わせる */
        });
        started=true;
      }
      if(!auth.currentUser)await f.auth.signInAnonymously(auth);
      else{ user=auth.currentUser; set(user.isAnonymous?"anon":"user"); }
    }catch(e){ set("error",msgOf(e)); }
  }

  async function sync(){
    if(!user||!db)return;
    try{
      const ref=F.fs.doc(db,...CPATH,user.uid);
      const snap=await F.fs.getDoc(ref);
      const d=snap.exists()?(snap.data()||{}):null;
      if(d&&d.meta&&typeof d.meta==="object")metaMerge(d.meta);
      runMerge(d?d.run:null);       /* 途中の潜行も突き合わせる */
      await pushNow();
    }catch(e){ set("error",msgOf(e)); }
  }
  async function pushNow(){
    if(!user||!db||pushing)return;
    pushing=true;dirty=false;
    try{
      await F.fs.setDoc(F.fs.doc(db,...CPATH,user.uid),
        {v:MVER,meta:metaSnapshot(),run:runRaw(),at:F.fs.serverTimestamp()});
      syncedAt=Date.now();
      if(state==="error")set(user.isAnonymous?"anon":"user");
    }catch(e){ set("error",msgOf(e)); }
    pushing=false;fire();
    if(dirty)schedule();
  }
  function schedule(){
    if(!user||!db)return;
    dirty=true;
    if(pushTimer)return;
    pushTimer=setTimeout(()=>{pushTimer=null;pushNow();},PUSHWAIT);
  }
  function flush(){
    if(pushTimer){clearTimeout(pushTimer);pushTimer=null;}
    if(user&&db)pushNow();
  }

  async function linkGoogle(){
    if(!configured())return;
    try{
      setOff(false);
      const f=await load();
      if(!auth)await start();
      if(!auth)return;
      const prov=new f.auth.GoogleAuthProvider();
      if(auth.currentUser&&auth.currentUser.isAnonymous){
        try{
          await f.auth.linkWithPopup(auth.currentUser,prov);
        }catch(e){
          /* その Google はもう別の記録を持っている。
             そちらへ移り、この端末の記録を混ぜ込む（捨てない）。 */
          const known=e&&(e.code==="auth/credential-already-in-use"
                        ||e.code==="auth/email-already-in-use");
          const cred=known&&f.auth.GoogleAuthProvider.credentialFromError(e);
          if(!cred)throw e;
          await f.auth.signInWithCredential(auth,cred);
        }
      }else{
        await f.auth.signInWithPopup(auth,prov);
      }
      await sync();
    }catch(e){ set("error",msgOf(e)); }
  }
  async function signOut(){
    try{
      if(dirty)await pushNow();
      setOff(true);
      if(auth&&F)await F.auth.signOut(auth);
      user=null;set("out");
    }catch(e){ set("error",msgOf(e)); }
  }
  async function signIn(){ setOff(false); await start(); }

  /* 画面を閉じる直前に、溜めていたぶんを投げておく（届かないこともある） */
  document.addEventListener("visibilitychange",()=>{
    if(document.visibilityState==="hidden"&&dirty)pushNow();
  });
  window.addEventListener("pagehide",()=>{if(dirty)pushNow();});

  CloudHook.mark=schedule;
  CloudHook.flush=flush;

  return {
    start,signIn,signOut,linkGoogle,sync,flush,
    on:f=>watchers.push(f),
    info:()=>({state,err,syncedAt,configured:configured(),
      who:user?(user.isAnonymous?"":(user.email||user.displayName||user.uid.slice(0,6))):"",
      uid:user?user.uid:""}),
  };
})();
metaLoad();

     "gate" … 入口を選ぶとき。選べる区画を光らせて押せるようにする */
const LANDC={

/* 名前がわかっている区画。最後まで抜けた場所と、
   はじめから選べる入口（作成画面で名前を見ている）は知っている扱い */
function areaKnown(k){ return !!META.areas[k]||!!(AREAS[k]&&AREAS[k].start); }
function worldMap(mode,pick){
  const seen=(RUN&&RUN.seen)||[];
  const inRun=(mode==="run"||mode==="gate");
  const known=k=>areaKnown(k)||(inRun&&seen.includes(k))
    ||(pick||[]).some(w=>w.key===k);
  const here=(inRun&&RUN&&!RUN.over)?RUN.area:null;
  const canGo=k=>(pick||[]).some(w=>w.key===k);

  let h=`<svg viewBox="0 0 100 100" class="wmsvg">
    <defs><linearGradient id="wmg" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#3d4d31"/><stop offset=".40" stop-color="#33402c"/>
      <stop offset=".72" stop-color="#2a3328"/><stop offset="1" stop-color="#222a24"/>
    </linearGradient></defs>
    <rect x="0" y="0" width="100" height="100" fill="url(#wmg)"/>
    <path d="M46 100 Q 50 58 62 46 Q 82 40 100 46 L100 100 Z" fill="#20323c" opacity=".65"/>
    <path d="M56 100 Q 60 73 70 63 Q 87 57 100 61 L100 100 Z" fill="#1a2b35" opacity=".8"/>`;
  /* 道 */
  Object.keys(AREAS).forEach(k=>{
    const A=AREAS[k];
    (A.to||[]).forEach(t=>{
      const B=AREAS[t];if(!B)return;
      const lit=known(k)&&known(t);
      h+=`<line x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}"
        stroke="${lit?"#8a7f5a":"#3a3f34"}" stroke-width="${lit?1.1:.7}"
        stroke-dasharray="${lit?"":"2 2"}" opacity="${lit?.9:.5}"/>`;
    });
  });
  /* 区画 */
  Object.keys(AREAS).forEach(k=>{
    const A=AREAS[k], c=LANDC[A.land]||LANDC.grass;
    const kn=known(k)||A.wip, go=canGo(k), cu=(k===here);
    const r=cu?5.4:(go?5:4.2);
    h+=`<g class="wmn ${go?"go":""}" ${go?`data-w="${k}"`:""}>`;
    if(go)h+=`<circle cx="${A.x}" cy="${A.y}" r="${r+3}" fill="none"
      stroke="#c9a227" stroke-width=".8"><animate attributeName="r"
      values="${r+2.4};${r+4.6};${r+2.4}" dur="2s" repeatCount="indefinite"/></circle>`;
    if(cu)h+=`<circle cx="${A.x}" cy="${A.y}" r="${r+2.6}" fill="none"
      stroke="#e9e4d4" stroke-width=".7"/>`;
    h+=`<circle cx="${A.x}" cy="${A.y}" r="${r}" fill="${A.wip?"#33362c":(kn?c.b:"#2b2f26")}"
        stroke="${cu?"#e9e4d4":(go?"#c9a227":(kn?c.a:"#3a3f34"))}"
        stroke-width="${(cu||go)?1.1:.7}"
        stroke-dasharray="${A.wip?"1.6 1.4":""}" opacity="${A.wip?.75:1}"/>`;
    h+=`<text x="${A.x}" y="${A.y+r+5}" class="wmt ${kn?"":"unk"}" text-anchor="middle">${
      kn?A.n.replace(/ /g,""):"？ ？ ？"}</text>`;
    if(kn)h+=`<text x="${A.x}" y="${A.y+r+9.2}" class="wmd ${A.wip?"wip":""}"
      text-anchor="middle">${A.wip?"開発中":`第${A.tier}階層`}</text>`;
    h+=`</g>`;
  });
  return h+`</svg>`;
}

/* ---------- 区画のめぐり方 ----------
   RUN.area … いまいる区画の鍵。敵・名前・BGM・難度はこれで決まる
   RUN.act  … 何区画目か。金貨と装備の等級だけがこれを見る
   RUN.seen … この周で通った区画。同じ所へは戻らない                */
function areaOf(){ return AREAS[RUN&&RUN.area]||{}; }
function areaTier(){ return areaOf().tier||1; }
/* 出発点にできる区画 */
function startAreas(){
  const o={};Object.keys(AREAS).forEach(k=>{if(AREAS[k].start)o[k]=AREAS[k];});
  return o;
}
/* その区画から辿れる道筋を一本ぶん並べる（作成画面の下書きに使う） */
function routeFrom(k,seen){
  seen=seen||[];
  if(!AREAS[k]||seen.includes(k))return [];
  seen.push(k);
  const out=[AREAS[k].n];
  const nx=(AREAS[k].to||[]).filter(x=>!seen.includes(x)&&!AREAS[x].wip);
  if(nx.length)out.push(...routeFrom(nx[0],seen));
  return out;
}
/* ボスを抜けたあと、次の入口が見つかるかどうか。
   つながっている先のうち、まだ通っていないものが候補。
   見つからなければそこが終点（踏破）。 */
function findEntrances(){
  const pool=(areaOf().to||[]).filter(k=>AREAS[k]&&!AREAS[k].wip&&!RUN.seen.includes(k));
  if(!pool.length)return [];
  if(pool.length===1)return [{key:pool[0],a:AREAS[pool[0]]}];
  /* 道が2本あるときは、両方見つかることもあれば片方だけのこともある */
  if(Math.random()<0.40)return pool.map(k=>({key:k,a:AREAS[k]}));
  const one=pool[Math.floor(Math.random()*pool.length)];
  return [{key:one,a:AREAS[one]}];
}

const RICON={battle:"⚔",elite:"☠",treasure:"▣",rest:"火",event:"？",shop:"◈",boss:"★"};
const RNAME={battle:"戦闘",elite:"精鋭",treasure:"宝物",rest:"休息",event:"事象",shop:"行商",boss:"ボス"};
const NCOL={battle:"#b1544a",elite:"#8f3a32",treasure:"#c9a227",
            rest:"#8fa261",event:"#6f92ab",shop:"#a68bbf",boss:"#e05a4a"};

/* ROWS は 0段目からボスの手前までの段数。ボスはそのうしろに1つ置くので、
   1階層で通る部屋は ROWS+1 室になる。いまは 19+1 で 20室目がボス。 */
/* COLS は道の幅。3 だと、線を交差させないかぎり
   1段で引ける道は「上の節の数＋下の節の数−1」本までで、
   3対3なら5本＝2つ以上に分かれる節は3つ中2つ（67%）が上限だった。
   4 に広げて 7割に届くようにしてある。 */
const ROWS=19, COLS=4, PATHS=4;
/* 宝物の部屋を置く段。通る道は1本なので、置いた段の数だけ開けられる。
   1段だけだと1階層に1回しか宝箱が出ず、演出を見る機会が少なすぎた。 */
const TREASUREROWS=[4,11];
const WEIGHT=[["battle",45],["event",22],["elite",16],["rest",12],["shop",5]];
/* 事象の中身の重み。親と同じものは半分になる（genAct 参照） */
const EVWEIGHT={ambush:30,chest:25,spring:25,shop:20};
/* 子が1つしかない節に、2本目を引きにいく見込み。
   1.00（必ず試す）でも、線を交差させない決まりに阻まれて全部は引けず、
   歩く道の上で 2つ以上から選べる節は **およそ 7割** に落ち着く。
   減らしたいときだけ下げる。 */
const BRANCHTRY=1.00;

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
/* いまの場面に流す曲。BGM に無いものは無音になる */
function bgmKey(id){
  if(id==="fight")return RUN&&RUN.boss?"boss":(RUN?RUN.area:"home");
  if(id==="floor")return RUN&&RUN.over?"result":(RUN?RUN.area:"home");
  if(id==="hall")return "hall";
  if(id==="codex")return "codex";
  return "home";                        /* home・make・tut・quiz */
}
function showScreen(id){
  ["tut","quiz","home","hall","codex","make","floor","fight"].forEach(k=>{
    const el=$("#"+k);if(el)el.classList.toggle("hide",k!==id);});
  curScreen=id;
  /* 表題を出すのはホームと遊び方だけ。遊んでいる間は盤面に縦を回す */
  document.body.classList.toggle("play",id!=="home"&&id!=="tut");
  Music.play(bgmKey(id));
}
const K=(r,c)=>r+","+c;

/* ---- 経路の生成（6本の道を上へ引く） ---- */
function genAct(ai){
  const node={}, kids={}, par={};
  const addNode=(r,c)=>{const k=K(r,c);if(!node[k])node[k]={r,c,t:null,done:false};return k;};
  const link=(a,b)=>{(kids[a]=kids[a]||[]);(par[b]=par[b]||[]);
    if(!kids[a].includes(b))kids[a].push(b);
    if(!par[b].includes(a))par[b].push(a);};
  const edge=new Set();
  const starts=[];
  for(let p=0;p<PATHS;p++){
    let c=Math.floor(Math.random()*COLS);
    if(p===1)while(c===starts[0])c=Math.floor(Math.random()*COLS);
    starts.push(c);
    addNode(0,c);
    for(let r=0;r<ROWS-1;r++){
      let opt=[-1,0,1].map(d=>c+d).filter(x=>x>=0&&x<COLS);
      // 道が交差しないように
      opt=opt.filter(nc=>!edge.has(`${r},${nc}>${r+1},${c}`));
      if(!opt.length)opt=[c];                      // 行き先が塞がったら真上へ
      const nc=opt[Math.floor(Math.random()*opt.length)];
      addNode(r+1,nc);
      edge.add(`${r},${c}>${r+1},${nc}`);
      link(K(r,c),K(r+1,nc));
      c=nc;
    }
  }
  /* ---- 分 岐 を 増 や す ----
     道を PATHS 本引くだけだと、たまたま重なった所しか分かれ道にならない。
     実測で分岐のある節は 37%（歩く道の上でも 48%）しかなく、
     一本道が延々と続いて「選ぶ」場面が薄かった。
     ここで隣の列への道を足し、7割の節が2つ以上に分かれるようにする。 */
  const rowKeys=r=>Object.keys(node).filter(k=>node[k].r===r);
  /* 交差の禁じ手は道を引くときと同じ。(r,nc)→(r+1,c) があるなら
     (r,c)→(r+1,nc) は引けない */
  function addEdge(k,r){
    const c=node[k].c;
    const free=nc=>nc>=0&&nc<COLS&&!edge.has(`${r},${nc}>${r+1},${c}`);
    const draw=nc=>{edge.add(`${r},${c}>${r+1},${nc}`);link(k,addNode(r+1,nc));return true;};
    /* まず すでにある節へ */
    let cand=[-1,0,1].map(d=>c+d).filter(free)
      .filter(nc=>node[K(r+1,nc)]&&!(kids[k]||[]).includes(K(r+1,nc)));
    if(cand.length)return draw(cand[Math.floor(Math.random()*cand.length)]);
    /* 無ければ 隣の列に新しく作る */
    cand=[-1,1].map(d=>c+d).filter(free).filter(nc=>!node[K(r+1,nc)]);
    if(cand.length)return draw(cand[Math.floor(Math.random()*cand.length)]);
    return false;
  }
  for(let r=0;r<ROWS-1;r++){
    /* ① 子のいない節（さっき作ったもの）には必ず1本引く。行き止まりを作らない */
    rowKeys(r).forEach(k=>{ if(!(kids[k]||[]).length)addEdge(k,r); });
    /* ② 7割になるまで、2本目を足す */
    rowKeys(r).forEach(k=>{
      if((kids[k]||[]).length>=2)return;
      if(Math.random()>=BRANCHTRY)return;
      addEdge(k,r);
    });
  }
  // 種類を決める
  const rows=[];for(let r=0;r<ROWS;r++)rows.push(Object.keys(node).filter(k=>node[k].r===r));
  const pickW=()=>{const t=WEIGHT.reduce((s,w)=>s+w[1],0);let x=Math.random()*t;
    for(const [n,w] of WEIGHT){x-=w;if(x<=0)return n;}return "battle";};
  const NOADJ=["elite","shop","rest"];
  rows.forEach((ks,r)=>{
    ks.forEach(k=>{
      if(r===0){node[k].t="battle";return;}
      if(TREASUREROWS.includes(r)){node[k].t="treasure";return;}
      if(r===ROWS-1){node[k].t="rest";return;}
      let t=null;
      for(let tries=0;tries<50;tries++){
        const c=pickW();
        if(r<5&&(c==="elite"||c==="rest"))continue;          // 序盤に精鋭・休息は出ない
        if(r===ROWS-2&&c==="rest")continue;                   // 最終段の直前に休息は置かない
        if(NOADJ.includes(c)&&(par[k]||[]).some(pk=>node[pk].t===c))continue;  // 同種を連続させない
        // 同じ親から出る道の行き先は種類を分ける
        const clash=(par[k]||[]).some(pk=>(kids[pk]||[]).some(sib=>
          sib!==k&&node[sib].t===c));
        if(clash)continue;
        t=c;break;
      }
      node[k].t=t||"battle";
    });
    // 同じ親から出る道の行き先が重なっていたら差し替える
    ks.forEach(k=>{
      if(r===0||TREASUREROWS.includes(r)||r===ROWS-1)return;
      const clash=()=>(par[k]||[]).some(pk=>(kids[pk]||[]).some(sib=>
        sib!==k&&node[sib].t===node[k].t));
      for(let tries=0;tries<40&&clash();tries++){
        const c=pickW();
        if(r<5&&(c==="elite"||c==="rest"))continue;
        if(r===ROWS-2&&c==="rest")continue;
        if(NOADJ.includes(c)&&(par[k]||[]).some(pk=>node[pk].t===c))continue;
        node[k].t=c;
      }
      if(clash())node[k].t="battle";
      if(clash())node[k].t="event";
    });
  });
  // 中身を割り当て
  const A=ai;   /* 区画そのものを受け取る */
  Object.keys(node).forEach(k=>{
    const nd=node[k];
    nd.name=RNAME[nd.t];
    if(nd.t==="battle"){
      let pool;
      if(nd.r<=1)pool=A.solo;                       /* 1〜2段目は単体 */
      else if(nd.r<=3)pool=A.solo.concat(A.easy);   /* 3〜4段目で複数が混ざる */
      else if(nd.r<7)pool=A.easy.concat(A.norm);
      else if(nd.r<11)pool=A.norm;
      else pool=A.norm.concat(A.hard,A.hard);       /* 後半は難が濃くなる */
      nd.e=pool[Math.floor(Math.random()*pool.length)];
    }
    if(nd.t==="elite")nd.e=A.elite[Math.floor(Math.random()*A.elite.length)];
  });
  /* 事象の中身は **段の順に** 決める。
     手前と同じものが続くと飽きるので、親と同じ中身は重みを半分にする。
     宝物の部屋（treasure）のあとも、事象の宝箱は半分になる。
     前は節の鍵の順に決めていたので、親の中身が決まっていないことがあり
     続き具合を見ようがなかった。 */
  rows.forEach(ks=>{
    ks.forEach(k=>{
      const nd=node[k];
      if(nd.t!=="event")return;
      const w={...EVWEIGHT};
      /* 親が2つとも同じでも 半分は1回だけ。
         forEach で毎回割ると 1/4 まで落ちてしまう */
      new Set((par[k]||[]).map(pk=>{
        const pv=node[pk];
        return pv.t==="treasure"?"chest":(pv.t==="event"?pv.ev:null);
      }).filter(Boolean)).forEach(prev=>{ if(w[prev])w[prev]=w[prev]/2; });
      let tot=0;for(const q in w)tot+=w[q];
      let x=Math.random()*tot, pick="chest";
      for(const q in w){x-=w[q];if(x<=0){pick=q;break;}}
      nd.ev=pick;
      if(pick==="ambush"){
        const pool=(nd.r<7)?A.easy:A.norm;
        nd.e=pool[Math.floor(Math.random()*pool.length)];
      }
    });
  });
  // ボス
  const bk="boss";
  node[bk]={r:ROWS,c:(COLS-1)/2,t:"boss",name:ENCS[A.boss].n,e:A.boss,done:false};
  rows[ROWS-1].forEach(k=>link(k,bk));
  return {node,kids,par,rows,bossKey:bk};
}

function matValue(){

function rollDrop(){
  const rate=RUN.boss?1:(RUN.elite?0.55:0.3);
  if(Math.random()>=rate)return null;
  const keys=Object.keys(ITEMS).filter(k=>(ITEMS[k].tier||1)<=RUN.act+1);
  const w=keys.map(k=>({k,w:(ITEMS[k].tier||1)===1?4:((ITEMS[k].tier||1)===2?2:1)}));

    me.bag[o.k]=(me.bag[o.k]||0)+1;return {key:o.k};

function startPick(left){

  let h=`<div class="mtitle">入 口 を 選 ぶ</div>

  if(nd.t==="battle"||nd.t==="elite"||nd.t==="boss"){

  if(nd.t==="treasure")return t+`開ける前に幸運で 1d100 を振る。段階しだいで装備の等級と並ぶ数、金貨が増える。`;

/* ---------- ノ ー ド 地 図 の 地 ----------
   区画ごとの情景を SVG で敷く。節と道はこの上に描かれる。
   drawMap は選ぶたびに呼ばれるので、形は番号から決まる決まった値で置く。
   乱数を使うと押すたびに草木が動いてしまうため。
   地図は 320 幅・下が1段目・上が最奥。奥ほど暗く沈むように描く。 */
function bgR(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);}
function mapBg(H){
  const key=(RUN&&RUN.area)||"plain";
  const A=AREAS[key]||{};
  const f=MAPBG[key]||MAPBG[A.land]||MAPBG.plain;
  /* 情景がにぎやかだと節と道が読めなくなる。上から薄い暗幕をかける */
  return f(H)+`<rect x="0" y="0" width="320" height="${H}" fill="#11140e" opacity=".34"/>`;
}
const MAPBG={
  /* 原始の草原 — 腰まで伸びた草。奥ほど霞んで暗い */
  plain:H=>{
    let g=`<defs><linearGradient id="bgA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d251a"/><stop offset=".45" stop-color="#28331f"/>
      <stop offset="1" stop-color="#334026"/></linearGradient></defs>
      <rect x="0" y="0" width="320" height="${H}" fill="url(#bgA)"/>`;
    /* 遠くの丘 */
    for(let i=0;i<5;i++){
      const y=H*(0.12+i*0.19);
      g+=`<path d="M0 ${y} q 80 ${-26-i*4} 160 ${-4} t 160 ${-14} L320 ${y+70} L0 ${y+70} Z"
        fill="#2c3823" opacity=".45"/>`;
    }
    /* 草の株。3本ずつ生やす */
    for(let i=0;i<190;i++){
      const x=bgR(i)*324-2, y=bgR(i+61)*H, sc=5+bgR(i+143)*11;
      const o=(.12+bgR(i+7)*.26).toFixed(2);
      g+=`<path d="M${x} ${y} q ${-sc*0.34} ${-sc*0.8} ${-sc*0.16} ${-sc*1.5}
        M${x} ${y} q ${sc*0.10} ${-sc*0.95} ${sc*0.46} ${-sc*1.4}
        M${x} ${y} q ${sc*0.5} ${-sc*0.68} ${sc*1.02} ${-sc*1.08}"
        stroke="#617943" stroke-width="1.1" fill="none" opacity="${o}"/>`;
    }
    /* ときどき穂が立つ */
    for(let i=0;i<26;i++){
      const x=bgR(i*5+3)*320, y=bgR(i*5+29)*H, h=16+bgR(i*5+41)*14;
      g+=`<g opacity="${(.16+bgR(i+3)*.2).toFixed(2)}">
        <path d="M${x} ${y} q ${-2} ${-h*0.6} ${1} ${-h}" stroke="#7c8f56" stroke-width="1" fill="none"/>
        <ellipse cx="${x+1}" cy="${y-h-2}" rx="1.8" ry="4" fill="#95a066"/></g>`;
    }
    return g;
  },
  /* 木漏れ日の森 — 濃いめの木々。幹の影が重なり、梢が空を塞ぐ */
  seed:H=>{
    let g=`<defs><linearGradient id="bgB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1810"/><stop offset=".5" stop-color="#1a2a19"/>
      <stop offset="1" stop-color="#2a3d24"/></linearGradient></defs>
      <rect x="0" y="0" width="320" height="${H}" fill="url(#bgB)"/>`;
    /* 下草。足元だけ明るい */
    for(let i=0;i<70;i++){
      const x=bgR(i*3+1)*324-2, y=bgR(i*3+17)*H, sc=4+bgR(i*3+29)*7;
      g+=`<path d="M${x} ${y} q ${-sc*0.3} ${-sc*0.9} ${-sc*0.1} ${-sc*1.4}
        M${x} ${y} q ${sc*0.4} ${-sc*0.8} ${sc*0.9} ${-sc*1.1}"
        stroke="#4a6336" stroke-width="1" fill="none"
        opacity="${(.14+bgR(i+3)*.2).toFixed(2)}"/>`;
    }
    /* 木を1本ずつ。幹＋枝＋こんもりした梢 */
    const tree=(x,y,h,w,dark)=>{
      const trunk=dark?"#0d150c":"#14200f";
      const leafA=dark?"#16260f":"#22381a";
      const leafB=dark?"#1b2d12":"#2b451f";
      let t=`<path d="M${x-w/2} ${y} q ${w*0.2} ${-h*0.55} ${w*0.08} ${-h}
        l ${w*0.84} 0 q ${w*0.14} ${h*0.55} ${w*0.34} ${h} Z" fill="${trunk}"/>`;
      /* 枝 */
      t+=`<path d="M${x} ${y-h*0.62} l ${-w*1.5} ${-h*0.1} M${x} ${y-h*0.48} l ${w*1.4} ${-h*0.12}"
        stroke="${trunk}" stroke-width="${Math.max(1,w*0.16).toFixed(1)}" fill="none"/>`;

/* ---- 地図の描画 ---- */
let mapScrollLock=false;
function drawMap(keepScroll){
  const M=RUN.M, rowH=50, top=30, H=top*2+ROWS*rowH;
  const x=c=>COLS>1?(60+c*(200/(COLS-1))):160;
  const y=r=>H-top-r*rowH;
  const reach=reachable();
  const canGo=k=>reach.includes(k);
  const box=$("#mapbox");
  const keep=keepScroll?box.scrollTop:null;
  let sv=`<svg viewBox="0 0 320 ${H}" class="mapsvg" xmlns="http://www.w3.org/2000/svg">`;
  sv+=mapBg(H);                       /* 区画ごとの情景。節と道はこの上に描かれる */
  Object.keys(M.kids).forEach(a=>{
    const na=M.node[a];
    M.kids[a].forEach(b=>{
      const nb=M.node[b];
      if(!nb||!isFinite(x(na.c))||!isFinite(x(nb.c)))return;
      const live=(RUN.curKey===a);
      sv+=`<line x1="${x(na.c)}" y1="${y(na.r)-15}" x2="${x(nb.c)}" y2="${y(nb.r)+15}"
        stroke="${live?"#c9a227":"#343a2c"}" stroke-width="${live?2.2:1.2}"
        ${live?"":'stroke-dasharray="4 4"'}/>`;
    });
  });
  Object.keys(M.node).forEach(k=>{
    const nd=M.node[k];
    if(!isFinite(x(nd.c))||!isFinite(y(nd.r)))return;
    const here=(RUN.curKey===k), go=canGo(k), pv=(RUN.preview===k), c=NCOL[nd.t];
    const op=nd.done?0.25:(go||here?1:0.36);
    const rr=nd.t==="boss"?17:14;
    sv+=`<g class="mnode ${go?"go":""}" data-k="${k}" opacity="${op}">
      ${pv?`<circle cx="${x(nd.c)}" cy="${y(nd.r)}" r="${rr+5}" fill="none"
        stroke="#c9a227" stroke-width="1.2" opacity=".65"/>`:""}
      <circle cx="${x(nd.c)}" cy="${y(nd.r)}" r="${rr}"
        fill="${here||pv?"#2f3427":"#1d2019"}" stroke="${go?"#c9a227":c}"
        stroke-width="${go?2:1}"/>
      <g transform="translate(${x(nd.c)-(nd.t==="boss"?12:10)} ${y(nd.r)-(nd.t==="boss"?12:10)})
        ">${nodeFig(nd.t,nd.t==="boss"?24:20)}</g>
    </g>`;
  });
  sv+=`</svg>`;
  box.innerHTML=sv;
  box.querySelectorAll(".mnode.go").forEach(g=>{
    g.onclick=()=>{RUN.preview=g.dataset.k;drawMap(true);};
  });
  if(keep!==null)box.scrollTop=keep;
  else if(!mapScrollLock)setFocus(box);
  drawNodeInfo();
}
/* 地図の見せる位置を決める。
   drawFloor() はどの呼び出し元でも showScreen("floor") より先に走るので、
   このとき #floor はまだ hide のまま。clientWidth も clientHeight も 0 になり、
   focusY() が最下部を返して「いつも入口が映っている」状態になっていた。
   寸法が取れないうちは次の描画まで待ってから決め直す。 */
function setFocus(box){
  box=box||$("#mapbox");
  if(!box)return;
  if(!box.clientHeight||!box.clientWidth){
    requestAnimationFrame(()=>{ if(!mapScrollLock)setFocus(box); });
    return;
  }
  box.scrollTop=focusY();
}
function focusY(){
  const box=$("#mapbox"),rowH=50,top=30,H=top*2+ROWS*rowH;
  const cur=RUN.curKey?RUN.M.node[RUN.curKey]:null;
  const r=cur?cur.r:0;
  const sc=mapScale();
  const full=H*sc;
  return Math.max(0,Math.min(full-box.clientHeight,
    (H-top-r*rowH)*sc-box.clientHeight*0.62));
}
function mapScale(){
  const box=$("#mapbox");
  if(!box||!box.clientWidth)return 1;
  return (box.clientWidth||320)/320;
}
/* 階層の始めに、上（ボス）から下（入口）へ流して全体を見せる */
function introScroll(){
  const box=$("#mapbox");
  if(!box)return;
  if(!box.clientHeight||!box.clientWidth){    /* まだ寸法が出ていない */
    requestAnimationFrame(introScroll);return;
  }
  mapScrollLock=true;
  box.scrollTop=0;
  const to=focusY(), t0=performance.now(), dur=1500;
  const step=now=>{
    const p=Math.min(1,(now-t0)/dur);
    const e=p<0.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
    box.scrollTop=to*e;
    if(p<1)requestAnimationFrame(step);
    else mapScrollLock=false;
  };
  requestAnimationFrame(step);
}
function drawNodeInfo(){
  const host=$("#mapinfo");

    <div class="ndbtn">

function stepTo(k){
  runSave();                         /* 踏み込む前を控える。中で落ちてもここへ戻る */
  RUN.preview=null;RUN.curKey=k;RUN.cur=RUN.M.node[k];
  (RUN.path=RUN.path||[]).push(k);   /* 逃げたときに ひとつ戻るために覚えておく */
  enterNode(RUN.cur);
}

/* ---- 行商の店 ---- */
function makeStock(){
  const st=[];
  const gp=catPool("gear");
  for(let i=0;i<3&&gp.length;i++){
    const r=gp.splice(Math.floor(Math.random()*gp.length),1)[0];
    st.push({cat:"gear",r,cost:price(44+(r.tier||1)*8),sold:false});
  }
  const keys=Object.keys(ITEMS).filter(k=>(ITEMS[k].tier||1)<=RUN.act+1);
  const pool=keys.slice();
  for(let i=0;i<3&&pool.length;i++){
    const k=pool.splice(Math.floor(Math.random()*pool.length),1)[0];
    st.push({cat:"item",key:k,r:{...ITEMS[k],id:"i_"+k},cost:price(ITEMS[k].cost),sold:false});
  }
  if(!st.some(x=>x.key==="potion"))
    st.push({cat:"item",key:"potion",r:{...ITEMS.potion,id:"i_potion"},
      cost:price(ITEMS.potion.cost),sold:false});
  return st;
}

    ${extra}
    <div class="msub">金貨 ${me.gold} → <b style="color:#c9a227">${me.gold-it.cost}</b></div>
    <div class="ndbtn">
      <button class="go2" id="cbYes">買う（${it.cost}）</button>
      <button class="no2" id="cbNo">やめる</button></div>`;
  openModal(h);
  $("#cbYes").onclick=()=>{
    me.gold-=it.cost;
    if(it.cat==="item"){me.bag[it.key]=(me.bag[it.key]||0)+1;SFX.found();return shopModal(nd);}
    const res=applyReward(it.cat,it.r);it.sold=true;SFX.found();
    if(res&&res.full)return swapModal(res.kind||"acc",res.full,()=>shopModal(nd));
    shopModal(nd);
  };
  $("#cbNo").onclick=()=>shopModal(nd);
}
/* レシピから作る */
/* 職人気質は 鍛冶にだけ効く。料理には効かない */
function isCrafter(id){
  return RECIPES[id].kind==="forge"
    &&(me.pass||[]).some(p=>p.ef&&p.ef.k==="craft");
}
function craftCost(id){
  return Math.round(RECIPES[id].cost*(isCrafter(id)?0.5:1));
}
function craftNeed(id){
  const R=RECIPES[id],out={};
  Object.keys(R.need).forEach(k=>{
    out[k]=isCrafter(id)?Math.max(1,R.need[k]-1):R.need[k];
  });
  return out;
}
function canMake(id){
  const R=RECIPES[id];
  if(me.gold<craftCost(id))return false;
  const need=craftNeed(id);
  return Object.keys(need).every(k=>(me.mats[k]||0)>=need[k]);
}
/* こしらえる。技能を振り、段階で品質が決まる */
async function doCraft(id,nd){
  const R=RECIPES[id];
  const sk=craftSkill(id);
  /* 加工賃は先に払う。素材は判定のあと（失敗なら手元に残る） */
  me.gold-=craftCost(id);
  closeModal();
  const pct=Math.max(5,Math.min(SKMAXV,skillOf(sk)));
  const r=await skillOv(R.kind==="forge"?"鍛 冶":"料 理",
    `${SK[sk].n}　${R.n}`,pct,CRAFTQ);
  const q=craftQuality(r);
  const out=[];
  if(q.mul<=0){
    /* 失敗。ファンブルのときだけ素材まで持っていかれる */
    if(q.fumble){
      const need=craftNeed(id);
      Object.keys(need).forEach(k=>{me.mats[k]-=need[k];if(!me.mats[k])delete me.mats[k];});
      out.push(`<span class="loss">手元が狂った</span>`);
      out.push(`　素材も 加工賃 ${craftCost(id)} も 失った`);
    }else{
      out.push(`<span class="loss">うまくいかなかった</span>`);
      out.push(`　加工賃 ${craftCost(id)} を失った　<span class="s">素材は手元に残っている</span>`);
    }
    chestClose();
    return backToFloorOrModal(nd,out);
  }
  /* 成功。ここで素材を引く */
  const need=craftNeed(id);
  Object.keys(need).forEach(k=>{me.mats[k]-=need[k];if(!me.mats[k])delete me.mats[k];});

  if(R.kind==="cook"){
    /* 道具は一つずつに品質を持てないので、品質は「取れた数」で表す */
    let got=0;
    for(let i=0;i<q.num;i++){
      if(bagCount()>=bagMax())break;
      me.bag[R.make]=(me.bag[R.make]||0)+1;got++;
    }
    markSeen("i_"+R.make);
    out.push(`<span style="color:${q.c}">${q.n}</span>　`+
      `<span class="gain">${ITEMS[R.make].n}</span> ×${got}`);
    out.push(`　<span class="s">${ITEMS[R.make].d}</span>`);
    if(got<q.num)out.push(`　<span class="loss">道具袋がいっぱいで ${q.num-got} つ置いてきた</span>`);
    chestClose();
    return backToFloorOrModal(nd,out);
  }
  /* 装備は実体を持つので、品質を数値そのものに乗せる */
  const base=[].concat(GEAR.armor.map(x=>({...x,slot:"armor"})),
                       GEAR.acc.map(x=>({...x,slot:"acc"}))).find(x=>x.id===R.make);
  const g=gearWithQuality(base,q);
  out.push(`<span style="color:${q.c}">${q.n}</span>　<span class="gain">${g.n}</span>`);
  out.push(`　<span class="s">${g.d}</span>`);
  const res=applyReward("gear",g);
  SFX.found();
  chestClose();
  if(res&&res.full)return swapModal(res.kind||"acc",res.full,()=>craftModal(nd));
  return backToFloorOrModal(nd,out);
}
/* 焚き火から来たか行商から来たかで、戻り先が違う */
function backToFloorOrModal(nd,out){
  resultModal(nd?"こしらえる — 行商の前で":"こしらえる — 焚き火のそばで",out,
    [{n:"もう一度 こしらえる",cb:()=>craftModal(nd)},{n:"やめる",cb:()=>{ if(nd)shopModal(nd); }}]);
}
function needText(id){
  const need=craftNeed(id);
  return Object.keys(need).map(k=>{
    const have=me.mats[k]||0, want=need[k];
    const ok=have>=want;
    return `<span style="color:${ok?"#8fa261":"#b1544a"}">${MATS[k].n} ${have}/${want}</span>`;
  }).join("　");
}

/* ---- 部屋の解決 ---- */
function enterNode(nd){
  const mk=(nd.e||nd.t);META.rooms[mk]=(META.rooms[mk]||0)+1;touchMeta();
  if(nd.t==="battle"||nd.t==="elite"||nd.t==="boss"){
    sel.enc=nd.e;RUN.elite=(nd.t==="elite");RUN.boss=(nd.t==="boss");
    startBattle();return;
  }
  nd.done=true;
  const out=[];
  if(nd.t==="rest"){
    SFX.camp();
    const rh=(ORIG[sel.orig]&&ORIG[sel.orig].restHalf)?0.5:1;
    const h=Math.min(Math.round(me.maxHP*0.45*rh),me.maxHP-me.HP);
    const m=Math.min(Math.round(me.maxMP*0.6*rh),me.maxMP-me.MP);
    me.HP+=h;me.MP+=m;
    out.push(`火にあたって休んだ`);
    out.push(`HP <span class="gain">+${h}</span>　MP <span class="gain">+${m}</span>`);
    backToFloor(nd.name,out,[
      {n:"火を使って こしらえる",cb:()=>craftModal(null)},
      {n:"確 認"}]);
  }else if(nd.t==="treasure"){
    openChest(nd,false);          /* 中身も金貨も演出の中で決まる */
  }else if(nd.t==="shop"){
    SFX.shop();
    shopModal(nd);
    return;
  }else{
    resolveEvent(nd,out);
  }
}
/* 事象は 4 つのどれかが起きる */
function resolveEvent(nd,out){
  const ev=nd.ev||"chest";
  if(ev==="ambush"){
    sel.enc=nd.e;
    RUN.elite=false;RUN.boss=false;
    drawFloor();showScreen("floor");
    resultModal(nd.name,out.concat([
      `<span class="loss">待ち伏せだった</span>`,
      `　<span class="s">${ENCS[sel.enc].n}　${ENCS[sel.enc].list.length}体</span>`]),
      [{n:"迎え撃つ",cb:()=>startBattle()}]);
    return;
  }
  if(ev==="chest"){
    openChest(nd,true);           /* 打ち捨てられた箱。金貨は 0.8 倍 */
    return;
  }
  if(ev==="spring"){
    SFX.camp();
    const rh=(ORIG[sel.orig]&&ORIG[sel.orig].restHalf)?0.5:1;
    const h=Math.min(Math.round(me.maxHP*0.40*rh),me.maxHP-me.HP);
    const m=Math.min(Math.round(me.maxMP*0.5*rh),me.maxMP-me.MP);
    me.HP+=h;me.MP+=m;
    /* 状態異常の解除はここには書かない。状態異常は戦闘の中だけのもので、
       探索画面では必ず空になっている（§ 状態異常の決まり）。 */
    out.push(`<span class="gain">澄んだ泉が湧いていた</span>`);
    out.push(`　HP <b>+${h}</b>　MP <b>+${m}</b>`);
    backToFloor(nd.name,out,[
      {n:"火を使って こしらえる",cb:()=>craftModal(null)},
      {n:"確 認"}]);
    return;
  }
  out.push(`<span class="gain">行商人が休んでいた</span>`);
  out.push(`　<span class="s">こんな所にも店を開くらしい</span>`);
  SFX.shop();
  RUN.stock=null;RUN.shopRecipe=undefined;
  drawFloor();showScreen("floor");
  resultModal(nd.name,out,[{n:"店を覗く",cb:()=>shopModal(nd)}]);
}
/* 3つから1つ選ぶ画面（カテゴリを指定できる） */
/* ---------- 宝箱の演出 ----------
   ① 1d100 を振り、幸運の段階（はずれ／あたり／大あたり／超あたり）を出す
   ② 箱がガタガタ揺れて、中身が一つずつ飛び出す
   ③ 開いた箱の下に、取れたものを一覧で見せる
   ④ 「装備を選ぶ」で showChoice へ渡す（段階が等級と並ぶ数を決める）
   途中で「とばす」を押すと、待ち時間が全部 0 になって一覧まで飛ぶ。      */
let chestSkip=false;
async function cwait(ms){ if(chestSkip)return; await wait(ms); }
function chestClose(){ const O=$("#chestOv"); O.className="chestOv"; O.innerHTML=""; }

/* 技能判定の見せ方。1d100 を回して段階を出す。宝箱の器を使い回す。
   戻り値は roll100 の結果そのもの。 */
async function skillOv(title,label,pct,ranks){
  const O=$("#chestOv");
  O.className="chestOv on";
  O.innerHTML=`
    <div class="cTtl">${title}</div>
    <div class="cLbl">${label}　<b>1d100</b>　<b>${pct}</b> 以下</div>
    <div class="cCuts" id="skCuts"></div>
    <div id="skSlot" style="display:grid;place-items:center;gap:10px;min-height:150px"></div>`;
  const cut=lukCuts(pct);
  $("#skCuts").innerHTML=
    `<span style="color:${ranks[3].c}">上 ${cut.ext}</span>`+
    `<span style="color:${ranks[2].c}">中 ${cut.hard}</span>`+
    `<span style="color:${ranks[1].c}">並 ${cut.hit}</span>`;
  const slot=$("#skSlot");
  const d=document.createElement("div");
  d.className="d100 roll";d.textContent="00";
  slot.appendChild(d);
  SFX.shake();
  const spin=setInterval(()=>{d.textContent=String(r100()).padStart(2,"0");},60);
  await wait(900);
  clearInterval(spin);
  const r=roll100(pct);
  const q=r.crit?CRAFTCRIT:(r.fumble?{n:"フ ァ ン ブ ル",c:"#b1544a"}:ranks[r.k]);
  d.textContent=String(r.v).padStart(2,"0");
  d.className="d100 land";
  d.style.color=q.c;d.style.borderColor=q.c;
  if(r.k>=2||r.crit)SFX.crit();else SFX.tick();
  await wait(420);
  const rk=document.createElement("div");
  rk.className="cRank";rk.style.color=q.c;rk.textContent=q.n;
  slot.appendChild(rk);
  if(r.k>0)SFX.found();
  await wait(760);
  return r;
}
function chestNote(k){
  const G=CHESTGAIN[k];
  const a=[];
  if(G.grade)a.push(`等級の上限 +${G.grade}`);
  if(G.gear>1)a.push(`装備 ${G.gear}つ`);
  if(G.gold>1)a.push(`金貨 ${G.gold}倍`);
  return a.join("　")||"上乗せなし";
}

  const fg=gainFood(1+Math.floor(Math.random()*2));
  Object.keys(fg).forEach(k=>gains.push({ic:itemIcon(k,34),
    n:`${MATS[k].n} ×${fg[k]}`,d:`手持ち ${me.mats[k]}`,sm:itemIcon(k,20)}));
  if(Math.random()<(weak?0.3:0.35)){
    const rid=rollRecipe();
    if(rid){const R=RECIPES[rid];
      gains.push({ic:itemIcon("i_scroll",34),n:`${R.n} の覚え書き`,
        d:`${R.kind==="cook"?"料理":"鍛冶"}　加工賃 ${R.cost}`,sm:itemIcon("i_scroll",20)});}
  }
  /* 装備。選ばせずにここで決めて、箱から飛び出させる。
     幸運の段階が等級の上限（LUKGRADE）と数を決める。 */
  const swaps=[];
  LUKGRADE=CG.grade;
  const pool=catPool("gear");
  LUKGRADE=0;                       /* 戦利品やレベルアップに漏らさない */
  for(let i=0;i<CG.gear&&pool.length;i++){
    const g=pool.splice(Math.floor(Math.random()*pool.length),1)[0];
    const icon=g.slot==="wep"?wepIcon(g.key):(g.slot==="armor"?armorIcon(g):accIcon(g));
    const res=applyReward("gear",g);
    if(res&&res.full)swaps.push(res);
    gains.push({ic:itemIcon(icon,34),sm:itemIcon(icon,20),n:`${g.n}`,
      d:(res&&res.stashed?"予備へ　":res&&res.full?"置き場が満杯　":"")
        +`${TIERN[g.tier===undefined?1:g.tier]}　${gearDesc(g)}`.slice(0,52)});
  }

  /* ③ 揺らして、一つずつ飛び出させる */
  const box=$("#cBox"), stage=$("#cStage");
  for(const it of gains){
    box.classList.add("shake");SFX.shake();
    await cwait(400);
    box.classList.remove("shake");
    void box.offsetWidth;                 /* 次の揺れを効かせるために積み直す */
    box.classList.add("burstout");
    const fl=document.createElement("div");fl.className="cFlash";stage.appendChild(fl);
    const f=document.createElement("div");
    f.className="cFly";
    f.innerHTML=`<div>${it.ic}</div><div class="cfn">${it.n}</div>`;
    stage.appendChild(f);
    SFX.found();
    await cwait(700);
    box.classList.remove("burstout");
    fl.remove();f.remove();
  }
  box.innerHTML=chestFig("open",112);
  SFX.open();
  await cwait(300);

  /* ④ 取れたものの一覧 */
  $("#cEnd").innerHTML=`<div class="cGot">
    <div class="cgt">手 に 入 れ た も の</div>
    ${gains.map(it=>`<div class="cgi">${it.sm||it.ic}<span>${it.n}</span><em>${it.d||""}</em></div>`).join("")}
    <div class="cgi" style="border-top:1px solid #23261c;display:block;color:${lr.c}">
      幸運 ${lr.s}　<span style="color:var(--ink)">1d100 → ${lr.v}</span>
      <div style="font-size:11px;margin-top:3px;letter-spacing:.06em">${chestNote(lr.k)}</div></div>
    <button class="go2" id="cGo" style="width:100%;margin-top:11px">
      受 け 取 る</button></div>`;
  $("#cSkip").style.display="none";
  return new Promise(res=>{
    $("#cGo").onclick=()=>{
      SFX.pick();chestClose();
      /* 枠が満杯だった装備は、ここで入れ替えるか捨てるかを決めてもらう */
      const next=()=>{
        const sw=swaps.shift();
        if(sw)return swapModal(sw.kind||"acc",sw.full,next);
        backToFloor(title,[
          `<span class="gain">${gains.map(g=>g.n).join("　")}</span>`,
          lr.k?`　<span class="s">幸運 ${lr.s}　${chestNote(lr.k)}</span>`:"" ].filter(Boolean));
        res();
      };
      next();
    };
  });
}
function showChoice(title,cats,dummy,out,chest){
  out=(out||[]).slice();
  /* chest は宝箱の演出が返した lukRoll の結果。無いときはふつうの3択 */
  const CG=chest?CHESTGAIN[chest.k]:CHESTGAIN[0];

function endRun(cleared){
  RUN.over=true;RUN.cleared=cleared;      /* 曲は結果のものに変わる（showScreen） */
  const depth=RUN.act+1;
  if(depth>META.best)META.best=depth;
  META.hall.push({
    t:Date.now(),               /* 統合のときの目印。同じ一件を二重に持たないため */
    no:META.runs, cleared, depth,
    dun:areaOf().n||"", acts:(RUN.seen||[]).length,
    route:(RUN.seen||[]).map(k=>AREAS[k]?AREAS[k].n:"").filter(Boolean),
    job:sel.job, race:sel.race, orig:sel.orig,
    lv:me.lv, hp:Math.max(0,me.HP), maxHP:me.maxHP,
    wep:me.wep.n, armor:me.eq.armor?me.eq.armor.n:null,
    acc:(me.eq.acc||[]).map(g=>g.n),
    sk:me.sk.map(x=>x.n), pass:me.pass.map(x=>x.n),
    gold:me.gold, kills:Object.values(META.codex).reduce((a,b)=>a+b,0),
  });
  if(META.hall.length>HALLMAX)META.hall=META.hall.slice(-HALLMAX);
  /* 終わった潜行に印を残す。もう1台に古い控えが残っていても、
     この印が届けば「つづきから」に出さない。 */
  if(RUN.id){META.ended[RUN.id]=true;endedTrim();}
  runClear();                      /* 終わった潜行の続きは無い */
  metaTimer&&clearTimeout(metaTimer);metaTimer=null;metaWrite();
  CloudHook.flush();               /* 1周の終わりは端末にもクラウドにも確実に残す */
  drawEnd();showScreen("floor");window.scrollTo(0,0);
}
