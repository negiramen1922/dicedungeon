<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ダイスダンジョン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"DotFont";src:local("DotGothic16");font-display:swap}
:root{
  --bg:#1b1d18; --panel:#232720; --panel2:#2b3028; --line:#3a3f34;
  --bone:#e9e4d4; --dim:#8b9080; --brass:#c9a227; --moss:#8fa261;
  --blood:#b1544a; --ink:#6f7a63; --blue:#6f92ab;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--bone);
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  font-size:15px;line-height:1.7;padding:14px 12px 40px;max-width:720px;margin:0 auto}
h1{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:22px;
  font-weight:600;letter-spacing:.14em;margin:0 0 2px}
.sub{color:var(--dim);font-size:11px;letter-spacing:.2em;margin-bottom:18px}
h2{font-size:11px;letter-spacing:.24em;color:var(--brass);font-weight:600;
  margin:20px 0 8px;border-bottom:1px solid var(--line);padding-bottom:5px}
.opts{display:flex;flex-wrap:wrap;gap:7px}
button.opt{background:var(--panel);border:1px solid var(--line);color:var(--dim);
  padding:8px 13px;cursor:pointer;font-family:inherit;font-size:14px}
button.opt:hover{border-color:var(--ink);color:var(--bone)}
button.opt.on{background:var(--panel2);border-color:var(--brass);color:var(--brass)}
button:focus-visible{outline:2px solid var(--moss);outline-offset:2px}
.note{font-size:12px;color:var(--dim);margin-top:6px;min-height:1.7em}
.go{display:block;width:100%;margin-top:18px;padding:13px;background:var(--brass);
  color:#1b1d18;border:0;font-family:inherit;font-size:15px;font-weight:700;
  letter-spacing:.1em;cursor:pointer}
.go:disabled{background:var(--line);color:var(--dim);cursor:not-allowed}


/* ===== 行動順 ===== */
.stagebar{font-size:10px;letter-spacing:.2em;color:var(--brass);margin-bottom:6px;text-align:center}
.orderwrap{background:var(--panel);border:1px solid var(--line);margin-bottom:8px}
.orderbar{display:flex;align-items:stretch;gap:6px;padding:6px 7px}
.ordList{display:flex;gap:5px;overflow-x:auto;flex:1;align-items:stretch;padding-bottom:2px}
/* 顔だけの小さなふだ。行動は顔の右上に重ねる。名前は title と盤面で分かる */
.ord{cursor:pointer;flex:0 0 auto;border:1px solid var(--line);background:#1d2019;
  border-top-width:3px;padding:7px 7px 6px;opacity:.5;transition:.15s}
.ord.mine{border-top-color:var(--moss)} .ord.foe{border-top-color:var(--blood)}
.ord.now{opacity:1;border-color:var(--brass);background:#2c3024}
.ord.done{opacity:.2}
.ord svg{display:block}
.oface{position:relative;line-height:0}
.oi{position:absolute;left:-5px;bottom:-4px;font-size:8px;color:var(--dim);
  font-family:ui-monospace,monospace;line-height:1;
  background:var(--panel);border:1px solid var(--line);padding:0 2px}
.oact{position:absolute;top:-5px;right:-5px;font-size:11px;line-height:1;
  width:16px;height:16px;display:grid;place-items:center;
  background:var(--panel);border:1px solid var(--line)}
.oact.atk{color:var(--blood);border-color:#5e2f2a}
.oact.def{color:var(--blue);border-color:#33454f}
.oact.hex{color:#a68bbf;border-color:#4a3c58}
.oact.buf{color:var(--brass);border-color:#5c4a1a}
.oact.me{color:var(--moss);border-color:#4a5730}
/* 次のラウンドの区切り */
.orddiv{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:1px;padding:0 6px;border-left:1px dashed var(--line);
  margin-left:3px}
.orddiv b{font-size:9px;color:var(--brass);font-weight:600;
  font-family:ui-monospace,monospace;letter-spacing:.04em}
.orddiv span{font-size:8px;color:var(--ink);letter-spacing:.1em}
.ord.later{opacity:.42;border-top-style:dashed}
.ord.later .oi{color:#4d5346}

.detbtn{flex:0 0 auto;background:var(--panel2);border:1px solid var(--line);
  color:var(--dim);font-family:inherit;font-size:10px;letter-spacing:.1em;
  padding:0 8px;cursor:pointer;white-space:nowrap}
.detbtn:hover,.detbtn.on{border-color:var(--brass);color:var(--brass)}
.detail{border-top:1px solid var(--line);padding:8px 9px}
.drow{display:flex;gap:8px;align-items:flex-start;padding:6px 0;
  border-bottom:1px dashed #2b3028}
.drow:last-child{border-bottom:0}
.drow svg{flex:0 0 auto;margin-top:2px}
.dnm{font-size:11.5px;color:var(--blood);letter-spacing:.03em}
.dline{font-size:10.5px;line-height:1.6;color:var(--dim);font-family:ui-monospace,monospace}
.dline .k{color:var(--ink);letter-spacing:.1em;margin-right:5px}
.dline b{color:var(--bone);font-weight:600}
.dline.now b{color:var(--blood)}
.dline.safe b{color:var(--moss)}

/* ===== 戦場 ===== */
.field{background:var(--panel);border:1px solid var(--line);padding:9px 6px 8px;position:relative}
.hdr5,.board{display:grid;grid-template-columns:1fr 1fr 20px 1fr 1fr;gap:3px}
.hdr5{margin-bottom:4px}
.hdr5 div{font-size:9px;letter-spacing:.16em;color:var(--ink);text-align:center}
.hdr5 .mine{color:var(--moss)} .hdr5 .theirs{color:var(--blood)}
.gap{position:relative}
.gap::before{content:"";position:absolute;left:50%;top:2px;bottom:2px;width:1px;
  background:#2f3429}
.cell{min-height:104px;padding:2px 1px;display:flex;flex-direction:column;
  align-items:center;justify-content:flex-start;position:relative}
.cell.dead{opacity:.24;filter:grayscale(1)}
.cell.sel{cursor:pointer}
.cell.look{cursor:pointer}
.cell.look:hover .por{background:#262b1e}
.cell.sel .por{outline:2px solid var(--brass);outline-offset:3px;background:#2a2e22}
.cell.sel:hover .por{background:#343a28}
.por{padding:2px 4px;border-radius:2px;transition:.12s}
.por svg{display:block}
.cn{font-size:9.5px;line-height:1.25;text-align:center;margin-top:2px;letter-spacing:.02em}
.cn.mine{color:var(--moss)} .cn.foe{color:var(--blood)}
.chp{font-family:"DotGothic16",ui-monospace,monospace;font-size:8.5px;color:var(--dim)}
.bar{height:3px;background:#14160f;width:80%;margin-top:2px}
.bar i{display:block;height:100%;background:var(--blood);transition:width .18s ease-out}
.bar.me i{background:var(--moss)}
.bar.mpb i{background:var(--blue)}
.cmp{font-family:"DotGothic16",ui-monospace,monospace;font-size:8px;color:var(--blue);margin-top:2px}
.cact{font-size:22px;line-height:1;margin-top:5px;
  width:32px;height:32px;display:flex;align-items:center;justify-content:center;
  margin-left:auto;margin-right:auto;border:1px solid;border-radius:3px}
.cact.bad{color:#e0705a;border-color:#7a3a30;background:#2a1c18}
.cact.ok{color:#8fa9bf;border-color:#3a4a56;background:#181f24}
.ct{font-size:8.5px;line-height:1.35;text-align:center;margin-top:3px;color:var(--dim);width:100%}
.ctlbl{display:block;font-size:7.5px;letter-spacing:.16em;color:var(--ink);margin-bottom:1px}
.ct b{color:var(--blood);font-weight:600;font-size:9.5px}
.ct.safe b{color:var(--moss)}
.cst{font-size:8px;color:var(--blue);font-family:ui-monospace,monospace}
.ctn{font-size:8px;line-height:1.3;text-align:center;margin-top:2px;color:#6f7a63;
  border-top:1px dashed #2b3028;padding-top:2px;width:100%}
.ctn.safe{color:#5f6e51}
.pop{position:absolute;top:-30px;left:50%;transform:translateX(-50%);
  font-family:"DotFont",ui-monospace,monospace;font-weight:700;
  font-size:24px;letter-spacing:.04em;color:#ff6a5a;z-index:12;white-space:nowrap;
  text-shadow:2px 0 0 #14160f,-2px 0 0 #14160f,0 2px 0 #14160f,0 -2px 0 #14160f,
    2px 2px 0 #14160f,-2px 2px 0 #14160f,2px -2px 0 #14160f,-2px -2px 0 #14160f,
    0 4px 0 rgba(0,0,0,.45);
  animation:pop .55s cubic-bezier(.2,1.3,.4,1)}
.pop.each{font-size:19px;color:#ff8b7a;top:-22px}
.pop.blk{color:#8fd0ff}
.pop.heal{color:#7fe08a}
.pop.weakhit{color:#ffd23f}
.pop.resisthit{color:#8fd8ff}
@keyframes pop{
  0%{transform:translate(-50%,14px) scale(.6);opacity:0}
  45%{transform:translate(-50%,-6px) scale(1.15);opacity:1}
  100%{transform:translate(-50%,0) scale(1);opacity:1}}
/* ===== ダイス演出（盤面の上に大きく） ===== */
/* 盤面より中身が高くなることがある（索敵は 2段ぶんの d100 と結果で 275px ほど）。
   inset:0 で盤面にぴったり合わせていたので、はみ出したぶんは
   暗幕の外に出て、上は並び順の帯・下はコマンドの列に重なっていた。
   高さを中身なりに伸ばし、上下の中心で釣り合わせて、暗幕ごと覆う。 */
.diceOv{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
  min-height:100%;padding:10px 0;box-sizing:border-box;
  z-index:20;display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:9px;
  background:rgba(20,22,15,.97);animation:fadein .12s ease-out}
.diceOv.on{display:flex}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.ovTop{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:17px;
  letter-spacing:.32em;color:var(--brass);text-align:center;padding:0 10px;
  animation:cutin .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes cutin{0%{transform:scale(.75);opacity:0;letter-spacing:.85em}
  100%{transform:scale(1);opacity:1;letter-spacing:.32em}}
.ovNote{font-size:12px;line-height:1.7;color:var(--bone);text-align:center;
  padding:0 12px;max-width:96%;animation:pop2 .3s ease-out}
.ovNote .win{color:var(--moss)} .ovNote .lose{color:var(--blood)}
.ovNote .k{color:var(--brass);letter-spacing:.1em}
.dvLbl{font-size:11px;letter-spacing:.18em;color:var(--brass);text-align:center;padding:0 8px}
.dvLbl em{font-style:normal;color:var(--bone)}
.dvRow{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;max-width:94%}
.dv{width:34px;height:34px;border:1px solid var(--line);background:#14160f;display:grid;
  place-items:center;font-family:"DotGothic16",ui-monospace,monospace;font-weight:700;font-size:18px;color:#585e50;
  border-radius:5px;will-change:transform}
.dv.roll{animation:tumble .44s infinite cubic-bezier(.45,.05,.55,.95)}
@keyframes tumble{
  0%{transform:translateY(0) rotate(0deg) scale(1)}
  12%{transform:translateY(-13px) rotate(64deg) scale(1.06)}
  25%{transform:translateY(-17px) rotate(128deg) scale(.95)}
  38%{transform:translateY(-9px) rotate(196deg) scale(1.04)}
  50%{transform:translateY(2px) rotate(258deg) scale(.92)}
  58%{transform:translateY(-3px) rotate(292deg) scale(1.02)}
  72%{transform:translateY(-14px) rotate(352deg) scale(1.05)}
  86%{transform:translateY(-6px) rotate(414deg) scale(.97)}
  100%{transform:translateY(0) rotate(480deg) scale(1)}}
.dv.enter{animation:tossin .34s cubic-bezier(.2,.9,.3,1.1) backwards}
@keyframes tossin{
  0%{transform:translate(-46px,-26px) rotate(-260deg) scale(.5);opacity:0}
  60%{opacity:1}
  100%{transform:translate(0,0) rotate(0deg) scale(1);opacity:1}}
.dv{position:relative}
.dvup{position:absolute;top:-13px;left:50%;transform:translateX(-50%);
  font-style:normal;font-family:"DotGothic16",ui-monospace,monospace;font-size:9px;
  letter-spacing:0;color:#5a6150;animation:pop2 .2s ease-out}
.dvup.on{color:#c9a227}
.dvnote{display:block;font-size:10px;letter-spacing:.1em;color:var(--ink);margin-top:3px}
.dv.land{animation:land .3s cubic-bezier(.3,1.5,.5,1)}
@keyframes land{
  0%{transform:translateY(-9px) rotate(22deg) scale(1.16)}
  55%{transform:translateY(2px) rotate(-4deg) scale(.93)}
  100%{transform:translateY(0) rotate(0deg) scale(1)}}
.dv.hit{border-color:var(--moss);color:var(--bone);background:#252d1c}
.dv.weak{border-color:#4a3a38;color:#7d6b68}
.dv.six{border-color:var(--brass);color:var(--brass);background:#332b12;font-weight:700;
  box-shadow:0 0 10px rgba(201,162,39,.45)}
.ad b.thr{color:var(--brass);font-weight:600}
.ctarget{position:absolute;top:2px;right:2px;font-size:10px;letter-spacing:0;
  font-family:"DotGothic16",ui-monospace,monospace;color:#1b1d18;background:var(--brass);
  padding:0 4px;border-radius:2px;pointer-events:none}
.cell{position:relative}
.scRow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(52px,auto);
  align-items:center;gap:8px;
  width:100%;max-width:340px;padding:6px 10px;border:1px solid var(--line);background:#14160f}
.scName{font-size:12px;letter-spacing:.02em;text-align:left;line-height:1.3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scName.mine{color:var(--moss)} .scName.foe{color:var(--blood)}
.scPct{font-size:10px;color:var(--ink);letter-spacing:0;grid-column:1;grid-row:2}
.scRow .d100{grid-column:2;grid-row:1/3;width:56px;height:56px;font-size:24px}
.scRes{grid-column:3;grid-row:1/3;font-size:12px;letter-spacing:.08em;text-align:right}
.scEnd{text-align:center;animation:pop2 .25s ease-out}
.scDiff{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:15px;letter-spacing:.2em}
.scGain{font-size:12px;color:var(--moss);letter-spacing:.08em;margin-top:3px}
.scGain.lose{color:#7d6b68}
.scGain b{color:var(--brass);font-size:14px}
.dvRes{font-size:15px;letter-spacing:.1em;color:var(--bone);
  border:1px solid var(--brass);padding:3px 14px;animation:pop2 .25s ease-out}
@keyframes pop2{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
/* 攻撃・被弾・溜めの演出 */
.fx{position:absolute;inset:0;pointer-events:none;z-index:9;overflow:visible}
.fx::before{content:"";position:absolute;left:50%;top:42%}
.fx.slash::before{width:64px;height:3px;
  background:linear-gradient(90deg,transparent,#ffe9a8 40%,#fff 50%,#ffe9a8 60%,transparent);
  transform:translate(-50%,-50%) rotate(-38deg) scaleX(0);
  animation:slashIn .32s ease-out forwards;filter:drop-shadow(0 0 4px rgba(255,220,140,.8))}
@keyframes slashIn{0%{transform:translate(-50%,-50%) rotate(-38deg) scaleX(0);opacity:0}
  35%{opacity:1}100%{transform:translate(-50%,-50%) rotate(-38deg) scaleX(1.15);opacity:0}}
.fx.slash::after{content:"";position:absolute;left:50%;top:42%;width:64px;height:2px;
  background:linear-gradient(90deg,transparent,#ffd58a,transparent);
  transform:translate(-50%,-50%) rotate(28deg) scaleX(0);
  animation:slashIn .32s .09s ease-out forwards}
.fx.blunt::before{width:14px;height:14px;border:3px solid #ffd0a0;border-radius:50%;
  transform:translate(-50%,-50%) scale(.3);opacity:0;
  animation:burst .34s ease-out forwards;filter:drop-shadow(0 0 5px rgba(255,180,120,.7))}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}
  100%{transform:translate(-50%,-50%) scale(2.6);opacity:0}}
.fx.bow::before{width:56px;height:2px;background:linear-gradient(90deg,transparent,#cfe6ff,#fff);
  transform:translate(-50%,-50%) scaleX(0);transform-origin:left center;
  animation:streak .26s ease-out forwards}
@keyframes streak{0%{transform:translate(-110%,-50%) scaleX(.2);opacity:0}
  40%{opacity:1}100%{transform:translate(-50%,-50%) scaleX(1);opacity:0}}
.fx.magic::before{width:16px;height:16px;border:2px solid #9fd0ff;border-radius:50%;
  transform:translate(-50%,-50%) scale(.4);
  animation:ring .42s ease-out forwards;filter:drop-shadow(0 0 6px rgba(140,200,255,.8))}
@keyframes ring{0%{transform:translate(-50%,-50%) scale(.4);opacity:1}
  100%{transform:translate(-50%,-50%) scale(3);opacity:0}}
.fx.charge::before{content:"▲";width:auto;height:auto;font-size:16px;color:var(--brass);
  transform:translate(-50%,10px);opacity:0;
  animation:rise .7s ease-out forwards;filter:drop-shadow(0 0 5px rgba(201,162,39,.8))}
@keyframes rise{0%{transform:translate(-50%,14px);opacity:0}
  30%{opacity:1}100%{transform:translate(-50%,-22px);opacity:0}}
.fx.charge::after{content:"";position:absolute;left:50%;top:50%;width:34px;height:34px;
  border:1px solid var(--brass);border-radius:50%;
  transform:translate(-50%,-50%) scale(.5);opacity:.9;
  animation:ring2 .7s ease-out forwards}
@keyframes ring2{0%{transform:translate(-50%,-50%) scale(.5);opacity:.9}
  100%{transform:translate(-50%,-50%) scale(1.6);opacity:0}}
.fx.guard::before{content:"◈";width:auto;height:auto;font-size:20px;color:var(--blue);
  transform:translate(-50%,-50%) scale(.4);opacity:0;
  animation:shield .55s ease-out forwards;filter:drop-shadow(0 0 6px rgba(111,146,171,.9))}
@keyframes shield{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}
  35%{transform:translate(-50%,-50%) scale(1.15);opacity:1}
  100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
.por{transition:transform .13s ease-out}
.hitfx{animation:hitshake .26s}
@keyframes hitshake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}
  55%{transform:translateX(5px)}80%{transform:translateX(-2px)}}
/* 自分 */
.self{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--moss);
  padding:10px 12px;margin-top:8px;position:relative}
.sh{display:flex;gap:10px;align-items:center}
.sn{font-size:14px;letter-spacing:.05em}
.stance{font-size:10px;letter-spacing:.2em;border:1px solid var(--moss);color:var(--moss);
  padding:1px 8px;margin-left:6px}
.stance.back{border-color:var(--blue);color:var(--blue)}
.snum{margin-left:auto;font-family:ui-monospace,monospace;font-size:11px;color:var(--dim);text-align:right}
.sbar{height:5px;background:#14160f;margin-top:5px}
.sbar i{display:block;height:100%;background:var(--moss);transition:width .18s ease-out}
.sbar.mp{height:3px;margin-top:2px} .sbar.mp i{background:var(--blue)}
.dzs{display:flex;gap:3px;justify-content:center;min-height:26px;margin-top:7px;flex-wrap:wrap}
.d{width:22px;height:22px;border:1px solid var(--line);background:#14160f;display:grid;
  place-items:center;font-family:ui-monospace,monospace;font-size:12px;color:#585e50}
.d.roll{animation:shake .12s infinite alternate}
@keyframes shake{from{transform:translateY(-2px) rotate(-6deg)}to{transform:translateY(2px) rotate(6deg)}}
.d.hit{border-color:var(--moss);color:var(--bone);background:#252d1c}
.d.six{border-color:var(--brass);color:var(--brass);background:#332b12;font-weight:700}
.d.sm{width:15px;height:15px;font-size:9px}
.tag{display:inline-block;background:var(--panel2);border:1px solid var(--brass);
  color:var(--brass);font-size:11px;padding:1px 8px}

/* 行動 */
.cmdwrap{position:sticky;bottom:0;background:var(--bg);
  padding:6px 0 4px;margin-top:8px;z-index:15;
  box-shadow:0 -10px 14px -8px var(--bg)}
.prompt{font-size:12px;color:var(--brass);letter-spacing:.1em;margin:0 0 5px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.act{background:var(--panel);border:1px solid var(--line);padding:7px 9px;cursor:pointer;
  text-align:left;font-family:inherit;color:var(--bone);
  display:flex;flex-direction:column;gap:2px;min-height:52px;justify-content:center}
.act:hover:not(:disabled){border-color:var(--brass);background:var(--panel2)}
.act:disabled{opacity:.34;cursor:not-allowed}
.act .an{font-size:13.5px;letter-spacing:.04em;line-height:1.25;
  white-space:normal;word-break:normal;overflow-wrap:anywhere}
.act .ad{font-size:10px;color:var(--dim);line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.act.wide{grid-column:1 / -1;min-height:0;flex-direction:row;align-items:center;gap:8px}
.act.atk{border-left:3px solid var(--blood)}
.act.def{border-left:3px solid var(--blue)}
.act.mv{border-left:3px solid var(--ink)}
.act.sk{border-left:3px solid var(--brass)}
.act.cancel{border-left:3px solid var(--dim)}
/* 報酬カード：種類ごとに色を分ける */
.act.rew{grid-column:1 / -1;min-height:0;padding:9px 11px;gap:4px;position:relative;
  display:flex;flex-direction:column;align-items:stretch}

.sheet{background:var(--panel);border:1px solid var(--line);padding:12px;margin-top:14px}
/* 経路図 */
.mapwrap{position:relative;background:var(--panel);border:1px solid var(--line);padding:6px;
  margin:0 auto 8px;max-width:560px}
/* 階層に入ったとき、名前が ぼわぁと浮かんで消える。
   地図が上から下へ流れるあいだに重ねる。押す邪魔はしない。 */
/* ===== 世界地図 ===== */
.wmsvg{display:block;width:100%;height:auto;background:#171d18;
  border:1px solid var(--line)}
.wmt{font-size:3.4px;fill:var(--bone);letter-spacing:.02em}
.wmt.unk{fill:#4d5346}
.wmd{font-size:2.6px;fill:var(--ink);letter-spacing:.04em}
.wmd.wip{fill:#8a7f5a;letter-spacing:.12em}
.wmn.go{cursor:pointer}
.wmn.go:hover circle{stroke:#e9c46a}
.wmwrap{margin:0 auto;max-width:560px}
.wmwrap.mkmap{max-width:420px;margin:8px auto 0}
.contnote{font-size:11px;color:var(--dim);line-height:1.7;text-align:center;
  margin:-4px 0 4px;padding:0 6px}
.contnote b{color:var(--bone)}
/* 控えがあるときは「つづきから」を主にして、新しく作るほうを控えめにする */
#hGo.sub{background:transparent;color:var(--bone);border:1px solid var(--line);
  font-weight:400}
.wmnote{font-size:11px;color:var(--dim);text-align:center;margin-top:6px;line-height:1.7}
.actTtl{position:absolute;inset:0;display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:8px;pointer-events:none;z-index:5;
  text-align:center;padding:0 16px}
.actTtl.on{display:flex}
.actTtl .atDun{font-size:11px;letter-spacing:.42em;color:var(--brass);
  animation:atFade 3400ms ease-out forwards}
.actTtl .atName{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
  font-size:30px;letter-spacing:.30em;color:var(--bone);
  text-shadow:0 0 22px rgba(16,18,13,.95),0 0 44px rgba(16,18,13,.9);
  animation:atName 3400ms cubic-bezier(.16,.7,.3,1) forwards}
.actTtl .atSub{font-size:11.5px;line-height:1.8;color:var(--dim);max-width:300px;
  text-shadow:0 0 16px rgba(16,18,13,.95);
  animation:atFade 3400ms ease-out 260ms forwards}
/* 途中のキーフレームでも filter を書いておくこと。
   書かないと 22% から 100% へ向けて blur がじわじわ戻る補間になり、
   いちばん見せたい真ん中がぼやけたままになる。 */
@keyframes atName{
  0%  {opacity:0;transform:scale(1.16);filter:blur(16px);letter-spacing:.62em}
  26% {opacity:1;transform:scale(1.02);filter:blur(0);letter-spacing:.30em}
  72% {opacity:1;transform:scale(1);   filter:blur(0);letter-spacing:.30em}
  100%{opacity:0;transform:scale(1);   filter:blur(6px);letter-spacing:.34em}}
@keyframes atFade{
  0%  {opacity:0;filter:blur(9px)}
  30% {opacity:1;filter:blur(0)}
  74% {opacity:1;filter:blur(0)}
  100%{opacity:0;filter:blur(4px)}}
#mapbox{max-height:68vh;min-height:340px;overflow-y:auto;overflow-x:hidden}
.mapsvg{display:block;width:100%;height:auto}

/* 部屋を選んだときの窓は地図の下にあり、地図が 68vh あるぶん画面からはみ出して

.d100{width:78px;height:78px;border:2px solid var(--line);background:#14160f;

/* --- 箱そのもの --- */
.cStage{position:relative;width:100%;max-width:300px;height:172px;
  display:flex;align-items:flex-end;justify-content:center}
.cBox{will-change:transform}
.cBox.shake{animation:cshake .40s ease-in-out}
@keyframes cshake{
  0%,100%{transform:translate(0,0) rotate(0deg)}
  12%{transform:translate(-4px,0) rotate(-4deg)}
  27%{transform:translate(4px,-3px) rotate(4deg)}
  42%{transform:translate(-4px,1px) rotate(-3deg)}
  58%{transform:translate(4px,-2px) rotate(3deg)}
  74%{transform:translate(-3px,0) rotate(-2deg)}
  88%{transform:translate(2px,0) rotate(1deg)}}
.cBox.burstout{animation:cjump .32s cubic-bezier(.2,1.5,.4,1)}
@keyframes cjump{0%{transform:translateY(0) scale(1)}
  40%{transform:translateY(-9px) scale(1.1,.9)}
  100%{transform:translateY(0) scale(1)}}
.cFly{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;
  filter:drop-shadow(0 0 8px rgba(201,162,39,.55));
  animation:cfly .92s cubic-bezier(.18,1,.3,1) forwards}
.cFly .cfn{font-size:12px;letter-spacing:.1em;color:#e9c46a;white-space:nowrap;
  background:#14160f;padding:2px 8px;border:1px solid var(--brass)}
@keyframes cfly{
  0%  {transform:translate(-50%,16px) scale(.25);opacity:0}
  16% {opacity:1}
  44% {transform:translate(-50%,-68px) scale(1.65);opacity:1}
  62% {transform:translate(-50%,-52px) scale(1.15);opacity:1}
  88% {transform:translate(-50%,-52px) scale(1.15);opacity:1}
  100%{transform:translate(-50%,-60px) scale(1.05);opacity:0}}
/* 飛び出す瞬間、箱の口が光る */
.cFlash{position:absolute;left:50%;bottom:56px;width:74px;height:16px;
  transform:translateX(-50%);background:#fff3c4;border-radius:50%;pointer-events:none;
  animation:cflash .34s ease-out forwards}
@keyframes cflash{0%{opacity:0;transform:translateX(-50%) scaleX(.3) scaleY(.4)}
  30%{opacity:.85;transform:translateX(-50%) scaleX(1) scaleY(1)}
  100%{opacity:0;transform:translateX(-50%) scaleX(1.3) scaleY(.6)}}

/* 戻るボタンと見出しを1行に。負のマージンで重ねる作りだと、
   見出しが長いとき（「キ ャ ラ を 作 る」）ボタンや歯車にぶつかる */
.secbar{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.secbar .backbtn{margin-bottom:0;flex:none}
.secbar .secttl{margin:0;flex:1;min-width:0;

@media(max-width:430px){

  .fh1 span{font-size:14.5px;letter-spacing:.06em;line-height:1.35}

}
/* ===== 殿堂 ===== */
.hallcard{display:flex;gap:11px;background:var(--panel);border:1px solid var(--line);

.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:11px}

body.play #brand{display:none}

body.play .stagerow{padding-right:78px}

.topicon{position:fixed;top:10px;z-index:70;

.mail .dot{position:absolute;top:-4px;right:-4px;min-width:15px;height:15px;

.newsbox{max-width:460px;max-height:82vh;overflow-y:auto}
.nwitem{border:1px solid var(--line);background:var(--panel);padding:11px 13px;

.nwtag{font-size:9px;letter-spacing:.16em;border:1px solid;padding:1px 5px;line-height:1.5}
.nwv{font-size:10px;color:var(--dim);font-family:ui-monospace,monospace;letter-spacing:.04em}
.nwd{font-size:10px;color:var(--ink);margin-left:auto}
.nwnew{font-size:9px;color:var(--blood);letter-spacing:.1em}
.nwt{font-size:13.5px;color:var(--bone);letter-spacing:.04em;margin-bottom:5px}
.nwb{font-size:11.5px;color:var(--dim);line-height:1.75;padding-left:11px;
  position:relative}
.nwb::before{content:"・";position:absolute;left:0;color:var(--ink)}
.nwb b{color:var(--bone);font-weight:600}
.nwnone{font-size:12px;color:var(--ink);text-align:center;padding:20px 0}
.setwrap{position:fixed;inset:0;z-index:80;background:rgba(16,18,13,.86);
  display:flex;align-items:center;justify-content:center;padding:16px}
.setbox{width:100%;max-width:360px;background:var(--bg);border:1px solid var(--brass);
  padding:18px 18px 14px}
.setttl{font-size:12px;letter-spacing:.24em;color:var(--brass);
  border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:15px}
.setrow{margin-bottom:15px}
.setlbl{display:flex;justify-content:space-between;align-items:baseline;
  font-size:12px;color:var(--dim);margin-bottom:5px;letter-spacing:.1em}
.setlbl b{color:var(--bone);font-weight:600;font-variant-numeric:tabular-nums;
  font-size:12.5px;letter-spacing:0}
.setrow input[type=range]{width:100%;accent-color:var(--brass);cursor:pointer;margin:0}
.setrow.off{opacity:.35}
.setnow{font-size:11.5px;color:var(--dim);line-height:1.6;
  border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
.setnow b{color:var(--moss);font-weight:600}
.setrec{font-size:11.5px;color:var(--dim);line-height:1.6;
  border-top:1px solid var(--line);padding-top:9px;margin-top:10px}
.setrec b{color:var(--bone);font-weight:600}
.setrec .warn{color:var(--blood)}
.setrec button{margin-top:7px;background:none;border:1px solid var(--line);
  color:var(--ink);font-family:inherit;font-size:11px;letter-spacing:.08em;
  padding:5px 10px;cursor:pointer}
.setrec button:hover{border-color:var(--blood);color:var(--blood)}
/* 赤くするのは「記録を消す」だけ。同期のボタンは壊す操作ではない */
/* 装備・状態の札まわり */
.mstat.chhead{border:1px solid var(--line);background:#14160f;padding:7px 9px;
  margin-bottom:9px;gap:0 16px}
.tabs.chtabs{margin-bottom:9px}
.tabs.chtabs .tab{flex:1 1 22%;padding:6px 2px}
/* keep-all で漢字かなの途中では折らせず、<wbr> を入れた所だけで折る。
   これが無いと「スキルとパッシ／ブ」で切れる */
.tabs.chtabs .tabn{font-size:10px;letter-spacing:.02em;line-height:1.3;text-align:center;
  word-break:keep-all}
.tabs.chtabs .tabc{font-size:9px}
.mitem.eqrow{display:grid;grid-template-columns:76px minmax(0,1fr);gap:0 8px;
  align-items:start;border-bottom:1px solid #23261d;padding:6px 0}
.eqk{color:var(--brass);font-size:11px;letter-spacing:.06em;line-height:1.6;
  display:flex;align-items:center;gap:5px}
.eqv{min-width:0;line-height:1.7}
.stbtn{margin:5px 6px 0 0;background:none;border:1px solid var(--line);
  color:var(--brass);font-family:inherit;font-size:11px;letter-spacing:.1em;
  padding:4px 12px;cursor:pointer}
.stbtn:hover{border-color:var(--brass)}
.stbtn.drop{color:var(--ink)}
.stbtn.drop:hover{border-color:var(--blood);color:var(--blood)}
#setCloud button{margin-right:6px}
#setCloud button:hover{border-color:var(--brass);color:var(--brass)}
.setver{display:flex;justify-content:space-between;font-size:11px;color:var(--ink);
  letter-spacing:.08em;margin-top:9px}
.setver b{color:var(--dim);font-weight:600;letter-spacing:.04em}
.hide{display:none}
</style>
</head>

   "<b>敵の素の数値に逆転がありました。</b>苔むした洞窟の敵は原始の草原より弱く、水没都市アトランティスの敵は水没した回廊より HP も DEF も低いままでした",
   "16体を書き換えて、階層が上がるほど必ず強くなるようにしました。区画ごとの平均は <b>78/25/6 → 90/27/8 → 165/39/17 → 174/46/14</b>（HP／攻撃／DEF）です",
   "<b>ボスの HP は 260 / 380 / 510 / 820</b> になりました。ディープワンは 540 から 820 です",
   "スライムとゴブリンは原始の草原と苔むした洞窟の両方に出るので、そのままにしてあります",
 ]},
 {id:"v0021",tag:"up",v:"α0.0021",d:"2026-08-31",n:"装備・状態を4つの札に分けた",b:[
   "能力値も装備もスキルも道具も素材もレシピも、<b>ひと続きの長い窓に詰まっていました</b>。名前は「装備・状態」なのに、装備を見るまでに5つの節を通り抜ける必要がありました",
   "<b>ステータス／スキル・パッシブ／装備／持ち物</b>の4つに分けました。職業・種族・欲望と Lv・HP・MP・金貨は、どの札でも頭に出ます",
   "<b>装備の欄は「枠の名前｜中身」の2列</b>になりました。どの枠に何が入っているか、武器・防具・装飾1〜4 が縦に並びます",
   "武器の節と装備の節で同じ武器を二度書いていたのをやめました",
   "〔修正〕戦闘中に開いたとき、閉じるボタンが「もどる」と表示されていたのを直しました",
 ]},
 {id:"v0020",tag:"up",v:"α0.0020",d:"2026-08-31",n:"続きをクラウドでも持ち歩ける",b:[
   "<b>途中の潜行がクラウドにも残ります。</b>スマホで進めた続きを、そのまま PC で開けます",
   "同じ潜行なら<b>先へ進んでいるほうを黙って引き継ぎます</b>。窓は出ません",
   "つながっていない間に別々の潜行を始めてしまったときだけ、<b>どちらを残すか選ぶ窓</b>が出ます。区画・段・冒険者・HP・いつのものかを並べて見比べられます",
   "<b>潜っている最中は何もしません。</b>遊んでいる手元の続きが正しいものとして扱われます",
   "1台で潜行を終えたら、もう1台に残った古い続きは「つづきから」に出なくなります",
 ]},
 {id:"v0019",tag:"up",v:"α0.0019",d:"2026-08-31",n:"つづきから ができるようになった",b:[
   "<b>潜行の途中で閉じても、続きから再開できます。</b>家に「つ づ き か ら」が出て、区画・段・冒険者・HP を添えます",
   "控えるのは<b>部屋にひとつ踏み込む直前</b>と<b>部屋を抜けて地図に戻ったとき</b>。<b>戦闘中に閉じても、その戦闘の開始前から</b>続けられます",
   "装備・予備・技（再使用待ちの残りターンまで）・パッシブ・Lv・経験・HP・金貨・素材・道具・レシピ・通った道・行商の品揃え、まるごと戻ります",
   "<b>踏破でも戦死でも続きは消えます。</b>控えがあるのに新しく作ろうとすると、断りの窓が出ます",
 ]},
 {id:"v0018",tag:"up",v:"α0.0018",d:"2026-08-31",n:"地図に区画ごとの情景を敷いた",b:[
   "無地だった部屋の地図に、<b>区画ごとの背景</b>を描きました",
   "<b>原始の草原</b>は遠くの丘と草の株、<b>実生の森</b>は幹と梢が重なる木立、<b>苔むした洞窟</b>は割れた岩とうねる通り道と滴る水、<b>水没した回廊</b>は奥へすぼまる石畳と柱と倒れた柱、<b>水没都市アトランティス</b>は段になって折れたコンクリの廃ビルと抜けた窓です",
   "部屋を選ぶたびに草木が動かないよう、位置は乱数ではなく決まった値で置いてあります",
 ]},
 {id:"v0017",tag:"up",v:"α0.0017",d:"2026-08-31",n:"逃げられるようになった",b:[
   "<b>1戦闘に1回だけ、1ターンを使って逃走に挑戦できます。</b>こちらの素早さと、いちばん速い追っ手の素早さの 1d100 対抗です。索敵と同じ演出でどちらの目も見えます",
   "<b>倒した数だけ追っ手の値が 12 ずつ下がります。</b>減らしてから逃げるほど通ります",
   "成功すると<b>ひとつ前の部屋まで引き返し</b>、次を選び直せます。ボス戦から逃げれば手前の焚き火に戻ります。<b>休息の回復や宝はもう得られません</b>が、焚き火なら<b>ものづくりだけはできます</b>",
   "失敗するとそのターンを失い、その戦闘ではもう試せません",
   "キャラ作成の「潜る場所」でも<b>世界地図から入口を選べる</b>ようになりました",
   "〔修正〕索敵のダイスが盤面からはみ出して、上の並び順の帯と下のコマンド列に重なっていたのを直しました",
 ]},
 {id:"v0016",tag:"fix",v:"α0.0016",d:"2026-08-31",n:"持ち帰れるものの書き方を直した",b:[
   "遊び方に「倒した敵、拾った素材、覚えた技は図鑑に残ります」とあり、<b>素材そのものを持ち帰れるように読めていました</b>",
   "実際は<b>金貨も素材も道具も装備も経験も、その一周かぎり</b>です。次の冒険者はまた Lv1 の手ぶらから始まります。残るのは図鑑の知識だけです",
   "遊び方と結果画面に、何が消えるかを先に書くようにしました",
 ]},
 {id:"v0015",tag:"up",v:"α0.0015",d:"2026-08-31",n:"実生の森を挟み、森の道を伸ばした",b:[
   "これまでの森を <b>実生の森</b>（第2階層）に改め、<b>世界樹の森</b>を第3階層に下げました",
   "世界樹の森の先に <b>夜空の洞窟</b>、実生の森から派生して <b>魔法の森</b> を置きました。<b>この3つはまだ中身がありません。</b>地図には「開発中」と出ますが降りられません",
   "<b>区画の名前は、その区画を最後まで抜けたときに世界地図へ残ります。</b>入っただけ・途中で死んだ場合は伏せたままです。はじめから選べる入口（原始の草原・苔むした洞窟）は最初から分かっています",
 ]},
 {id:"v0014",tag:"up",v:"α0.0014",d:"2026-08-31",n:"世界地図を足した",b:[
   "「ダンジョンの中に階層が並ぶ」入れ子をやめて、<b>区画そのものが地続きに繋がる一枚の地図</b>にしました",
   "<b>深さの上限がありません。</b>繋がっている先を辿れる限り潜り続け、行き先が尽きたところが踏破です",
   "<b>世界地図</b>を土地として描きました。<b>ホーム・入口を選ぶとき・探索中いつでも</b>の3か所で開けます。左が森の道、右が水の道で、下ほど深く沈んでいます",
   "区画の名前を改めました。草原→<b>原始の草原</b>、アトランティス1→<b>苔むした洞窟</b>、アトランティス2→<b>水没した回廊</b>、アトランティス3→<b>水没都市アトランティス</b>",
   "敵の重さは<b>その区画の担当階層</b>で決まります。何番目に通ったかでは決まりません",
 ]},
 {id:"v0013",tag:"up",v:"α0.0013",d:"2026-08-31",n:"階層に入ると名前が浮かぶ",b:[
   "階層に入って地図が上から下へ流れるあいだ、<b>その階層の名前がぼわぁと浮かんで消える</b>ようにしました",
   "ダンジョン名と階層、階層の名前、情景の一文が出ます。1階層目は出立の支度が済んでから出ます",
 ]},
 {id:"v0012",tag:"up",v:"α0.0012",d:"2026-08-31",n:"装備に予備の枠を作った",b:[
   "<b>宝箱で武器や防具が出ると、いま使っているものが確認なしに置き換わっていました。</b>これを直しました",
   "<b>装備の予備を 2 つまで持てます。</b>枠が埋まっているときに拾ったものは、まず予備に入ります。いまの装備はそのままです",
   "<b>装備・状態の窓に「予備」の欄</b>ができました。「着ける」で入れ替え、外れたものは予備に戻ります",
   "<b>予備も満杯のときだけ、何を捨てるか訊く画面</b>が出ます。いま着けているものと予備が並ぶので、武器なら攻撃ダイスと威力を見比べて選べます。装飾も同じです",
 ]},
 {id:"v0011",tag:"up",v:"α0.0011",d:"2026-08-31",n:"索敵で先手が決まるようにした",b:[
   "索敵で<b>片方だけが成功したとき、1ラウンド目だけ DEX を飛び越えて 成功したほうが先に動きます</b>。気配に気づいたほうが先に身構える、という理屈です",
   "遅い相手でも索敵に勝てば先手を取れますし、速くても気づかれると後手に回ります",
   "<b>両方成功・両方失敗のときは これまでどおり素早さ順</b>です。2ラウンド目からも必ず素早さ順に戻ります",
 ]},
 {id:"v0010",tag:"up",v:"α0.0010",d:"2026-08-31",n:"宝箱を増やし、地図を長くした",b:[
   "<b>宝物の部屋が1階層に2つ</b>になりました。これまで宝物は1段にしか置かれておらず、通る道は1本なので<b>1階層に1回しか宝箱を開けられません</b>でした",
   "<b>宝箱は装備をそのままくれます。</b>3つから選ぶ画面をやめました。箱から飛び出したものが そのまま手に入ります。幸運が<b>大あたり以上なら装備が2つ</b>出ます",
   "<b>1階層で通る部屋が 15 から 20 に増えました。</b>20室目がボスです。宝物は 5室目と12室目。3階層通しで 45室 → 60室、宝箱は 3回 → 6回になります",
   "戦闘画面の下にあった <b>「もう一度」「選び直す」「♪音ON」</b> を外しました。音量は歯車から変えられます",
 ]},
 {id:"v0009",tag:"up",v:"α0.0009",d:"2026-08-31",n:"技能値を足した",b:[
   "能力値とは別に <b>技能値</b> を5つ足しました。<b>探索・射撃・格闘・鍛冶・料理</b>。判定は幸運と同じ <b>1d100</b> で、失敗／成功／ハード／エクストリーム、それに出目1のクリティカルと出目100のファンブルがあります",
   "技能値は<b>職業・種族・欲望だけ</b>で決まります。能力値からも装備からも来ません",
   "<b>DEX の役割を減らしました。</b>これまで DEX は 命中・回避・行動順・索敵 の4つを一人で抱えていました。命中は 射撃／格闘 へ、索敵は 探索 へ移り、DEX に残るのは <b>回避と行動順</b> だけになります",
   "<b>遠距離と近距離に腕前の差が生まれます。</b>これまで違いは「後列を狙えるか」だけでした。いまはナイトが弓を持つと当たらず、アーチャーが短剣を持っても当たりません",
   "<b>DEX に上限 100 を置きました。</b>回避と行動順に効くうえ装備で大きく伸びるので、放っておくと後半で敵が当てられなくなっていました。素の成長だけで Lv16 に 96 まで来ます",
   "上限を<b>越えられるのはスキルのバフだけ</b>です。成長・装備・パッシブはここで止まります",
   "<b>上限に達していると、どれだけ無駄になっているかを装備・状態の窓に出します。</b>「この装備の DEX の +10 は 上限 100 を超えていて無駄になっている」のように、装備1つずつに出ます",
   "<b>当たる目を画面に出すようにしました。</b>攻撃と技のボタンに「5〜6以上 で当たり」、相手を選ぶときは<b>マスの右上に敵ごとの数字</b>が出ます。押す前にどちらが当てやすいか分かります",
   "<b>速い敵ほど当てにくくなりました。</b>スライム(DEX 6)とオオコウモリ(DEX 42)では必要な目が2つ違います。あわせて <b>鈍足</b> が命中にも効くようになりました（これまでは行動順を遅らせるだけでした）",
   "<b>索敵を対抗判定にしました。</b>こちらの探索と相手の気配で <b>両者が 1d100 を振り</b>、成功の段階の差がそのまま先制ダイスになります。画面に<b>敵のダイスも並べて出す</b>ので、勝ったか負けたかがひと目で分かります。これまでは誰がやっても上限の +3 が出ていて、索敵の値が意味を持っていませんでした",
   "<b>こしらえるときに技能を振ります。</b>成功の段階で品質が上がります。料理は取れる数が増え（成功1／上物2／業物3／会心4）、鍛冶は装備の性能そのものが上がります（＋1.15倍／＋1.3倍／★1.5倍）",
   "失敗しても<b>素材は手元に残ります</b>（加工賃だけ失う）。素材まで持っていかれるのはファンブルのときだけです",
 ]},
 {id:"v0008f",tag:"fix",v:"α0.0009",d:"2026-08-31",n:"敵を盲目にしても効いていなかった",b:[
   "命中閾値の式が3箇所にコピーされていて、そのうち<b>敵が攻撃するときの1箇所が盲目を読んでいませんでした</b>。「甘い囁き」で敵を盲目にしても命中が下がっていませんでした。3箇所を1つにまとめて直しました",
 ]},
 {id:"v0008",tag:"bal",v:"α0.0008",d:"2026-08-31",n:"スカウトを引き上げ、硬さを削った",b:[
   "<b>スカウトが弱すぎました。</b>成長が DEX 中心なのに短剣系の威力は STR 依存で、レベルを上げても威力がほとんど伸びていませんでした。Lv10 での火力は平均の 57%、エルフでは 44% でした",
   "<b>スカウトの成長を STR 寄りにしました</b>（DEX5 STR2 VIT2 → STR4 DEX3 VIT2）。<b>元の STR も 26 → 30</b> に上げ、1レベル目から効くようにしました",
   "<b>短剣系7本の威力を 1.15 倍</b>にしました。1発の威力が小さい武器ほど敵の DEF に削られるためです（1ヒットの威力は 威力−DEF が下限 25% で頭打ち）。短剣・双短剣・狼牙・レイピア・スティング・シャドウ・暗殺刀",
   "<b>敵の攻撃が通らなさすぎました。</b>ナイトの DEF 10→8、ドワーフの DEF 5→3。1階層のスライムがドワーフのナイトに与える1発が <b>6 から 11</b> になります",
   "<b>ウィザードが全階層で最上位</b>だったので、成長の VIT を 3 → 2 に下げました",
   "16通りの強さの開きが、Lv10 で <b>5.5倍から1.9倍</b>、Lv16 で 4.6倍から1.6倍に縮まりました",
 ]},
 {id:"v0007c",tag:"up",v:"α0.0007",d:"2026-08-31",n:"記録をクラウドに置けるようにした",b:[
   "図鑑・殿堂・到達階層を <b>クラウドに保存</b> できるようにしました。<b>Google と連携すると、別の端末でも同じ記録の続き</b>が遊べます",
   "ログインの操作は要りません。開いた時点で名無しのまま保存が始まり、あとから歯車の中で連携できます",
   "<b>端末の中が主で、クラウドはその写し</b>です。通信が切れていても、設定していなくても、これまでどおり遊べます",
   "2台で別々に遊んでいても記録は消えません。数は大きいほう、見つけたものは付いているほう、殿堂は両方を混ぜて新しい50件を残します",
   "歯車の中で、いま同期しているかどうかと最後に同期した時刻が見られます",
 ]},
 {id:"v0007",tag:"up",v:"α0.0007",d:"2026-08-31",n:"幸運を足した",b:[
   "<b>幸運</b> を能力に加えました。0〜100 の百分率で、判定はいつも <b>1d100</b> です",
   "幸運は職業・種族・欲望のどれにも属しません。<b>キャラを作るときに 2d6×2（4〜24）を振って決まります</b>。レベルでは伸びず、<b>あとから動かせるのは装備だけ</b>です",
   "<b>成功にも段階があります。</b>出目が 幸運÷5 以下なら <b>超あたり</b>、幸運÷2 以下なら <b>大あたり</b>、幸運以下なら <b>あたり</b>。出目 1 は幸運がいくつでも必ず超あたり、出目 100 は必ずはずれです",
   "<b>攻撃が一つも当たらなかったとき</b>、段階のぶんだけダイスを振り直します（あたり1つ・大あたり2つ・超あたり3つ）",
   "<b>宝箱に演出を入れました。</b>開ける前に 1d100 を振り、箱がガタガタ揺れて中身が一つずつ飛び出し、最後に手に入れたものを一覧で見せます。急ぐときは「とばす」",
   "段階が上がるほど宝箱が実ります。<b>あたり</b>＝装備の等級の上限 +1／<b>大あたり</b>＝＋並ぶ数 4・金貨 1.5倍／<b>超あたり</b>＝等級の上限 +2・並ぶ数 5・金貨 2倍",
   "ヒュームの「人の業」は今までどおり必ず 1 つ振り直します。幸運はそれとは別に判定するので、重なれば最大 4 つ振れます",
   "幸運の上がる装飾を 5 つ足しました。<b>四つ葉の護符・兎の足・賭博師の骰子・女神の片眼・黄金の骰子</b>",
 ]},
 {id:"v0007f",tag:"fix",v:"α0.0007",d:"2026-08-31",n:"振り直しが働いていなかった",b:[
   "ヒュームの<b>「人の業」</b>（一つも当たらなかったとき もう1つ振り直す）が、<b>ふつうの攻撃では一度も働いていませんでした</b>。空振りしたところで処理が抜けてしまい、振り直しまで届いていませんでした",
   "空振りの直後に振り直すようにしました。今回入れた幸運の振り直しも同じところで働きます",
   "事象の<b>「打ち捨てられた箱」で、表示より多くの金貨が入っていました</b>。0.8倍にした数字を見せながら、財布には満額を足していました。見えている数字どおりになります",
 ]},
 {id:"v0006",tag:"bal",v:"α0.0006",d:"2026-08-30",n:"ナイトの伸びを下げた",b:[
   "<b>ナイトの VIT の伸びを 1 下げました。</b>耐久が突出していて、レベルが上がるほど差が開いていました。Lv10 の HP が 387 から 351 になります",
 ]},
 {id:"v0005",tag:"up",v:"α0.0005",d:"2026-08-30",n:"お知らせを置いた",b:[
   "右上に<b>封筒</b>を置きました。更新の内容をここに残していきます",
   "未読があると封筒に数が出ます。開けば消え、読んだところは端末に覚えます",
 ]},
 {id:"v0004",tag:"up",v:"α0.0004",d:"2026-08-30",n:"敵の弱体が効くようになった",b:[
   "敵の <b>呪縛・力を奪う・溶かす</b> といった技が、これまで見た目だけで数字を動かしていませんでした。DEF・威力・素早さ・攻撃ダイスが実際に下がります",
   "状態異常に <b>萎縮</b>（攻撃ダイスが減る）を追加",
   "<b>アンチポーション</b>が働くようになりました。毒・火傷・麻痺・盲目・混乱も含めて、かかっている状態異常をすべて解きます",

function newsUnread(){
  const i=NEWS.findIndex(x=>x.id===META.newsSeen);
  return i<0?NEWS.length:i;      /* 覚えが無ければ全部が未読 */
}

/* ===== BGM =====
   外部ファイルを読む。index.html と同じ場所に置いておく。
   場面ごとに曲を割り当て、切り替えは showScreen() が引き受ける（bgmKey 参照）。
   同じファイルなら鳴らし直さないので、殿堂→結果のように曲が共通の場面は繋がる。 */
const BGM={
  home  :"遥かなる伝説.mp3",              /* ホーム・キャラ作成・遊び方・見立て */
  hall  :"そろそろ帰ろっと！_M325.mp3",       /* 殿堂 */
  result:"そろそろ帰ろっと！_M325.mp3",       /* 潜行の結果 */
  codex :"オルゴールファンタジー.mp3",        /* 図鑑 */
  boss  :"深域で待つもの.mp3",              /* ボス戦 */
  plain :"PerituneMaterial_Wonder2_loop.mp3",   /* 原始の草原 */
  seed  :"樹木の息吹.mp3",                      /* 木漏れ日の森 */
  /* 苔むした洞窟・水没した回廊・水没都市アトランティスは まだ曲がない */
};
/* 設定画面に出す曲名。BGM に無い場面は無音 */
const BGMN={
  home:"遥かなる伝説", hall:"そろそろ帰ろっと！", result:"そろそろ帰ろっと！",
  codex:"オルゴールファンタジー", boss:"深域で待つもの",
  plain:"Wonder2", seed:"樹木の息吹",
};
const Music=(()=>{
  let el=null, now=null, want=null, on=true, vol=.5, tok=0;
  function ensure(){
    if(el)return el;
    el=document.createElement("audio");
    el.loop=true; el.volume=0; el.preload="none";
    document.body.appendChild(el);
    return el;
  }
  function fade(to,ms){
    const a=ensure(), from=a.volume, t0=Date.now(), my=++tok;
    const step=()=>{
      if(my!==tok)return;                 /* 新しいフェードや音量変更に追い越された */
      const k=Math.min(1,(Date.now()-t0)/ms);
      a.volume=Math.max(0,Math.min(1,from+(to-from)*k));
      if(k<1)requestAnimationFrame(step);
      else if(to===0){a.pause();}
    };
    step();
  }
  return {
    play(key){
      want=key;
      const file=BGM[key];
      if(!on||!file){this.stop();return;}
      if(now===file)return;               /* 同じ曲なら鳴らし直さない */
      now=file;
      const a=ensure();
      a.src=encodeURI(file); a.volume=0;  /* 日本語のファイル名をそのまま渡せるように */
      const pr=a.play();
      /* 自動再生を止められたら、次に何か押されたとき鳴らし直す */
      if(pr&&pr.catch)pr.catch(()=>{now=null;});
      fade(vol,900);
    },
    /* 自動再生が止められていた場合の鳴らし直し。最初のクリックから呼ぶ */
    resume(){ if(on&&!now&&want)this.play(want); },
    stop(){ if(!el||!now)return; now=null; fade(0,600); },
    toggle(){ on=!on; if(on)this.play(want); else this.stop(); return on; },
    setVol(v){ vol=Math.max(0,Math.min(1,v)); tok++; if(el&&now)el.volume=vol; },
    get on(){return on;},
    get track(){return now?(BGMN[want]||now):null;},
  };
})();

const SFX=(()=>{
  let ctx=null, on=true, nb=null, buf={}, asked=false, gm=null, vol=.8;
  /* 効果音はすべてこの1つのつまみを通す。音量の設定はここを動かす */
  function bus(){
    if(!gm){gm=ctx.createGain();gm.gain.value=vol;gm.connect(ctx.destination);}
    return gm;
  }
  function loadSamples(){
    if(asked||!ctx)return;asked=true;
    Object.keys(SND).forEach(k=>{
      try{
        const bin=atob(SND[k]);
        const arr=new Uint8Array(bin.length);
        for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
        ctx.decodeAudioData(arr.buffer,b=>{buf[k]=b;},()=>{});
      }catch(e){}
    });
  }
  function play(k,vol,rate,dur){
    if(!on||!init())return false;
    const b=buf[k];if(!b)return false;
    const src=ctx.createBufferSource();src.buffer=b;
    if(rate)src.playbackRate.value=rate;
    const g=ctx.createGain();
    const v=vol===undefined?.7:vol;
    const t=ctx.currentTime;
    g.gain.setValueAtTime(v,t);
    src.connect(g);g.connect(bus());
    if(dur){                       // 頭だけ使い、最後は短くフェード
      g.gain.setValueAtTime(v,t+Math.max(0,dur-0.12));
      g.gain.exponentialRampToValueAtTime(0.001,t+dur);
      src.start(0,0,dur+0.02);
    }else src.start();
    return true;
  }
  function init(){
    if(!ctx){try{ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}
    if(ctx.state==="suspended")ctx.resume();
    loadSamples();
    return ctx;
  }
  function noiseBuf(){
    if(nb)return nb;
    const n=ctx.sampleRate*0.5;
    nb=ctx.createBuffer(1,n,ctx.sampleRate);
    const d=nb.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
    return nb;
  }
  function tone(o){
    if(!on||!init())return;
    const t=ctx.currentTime+(o.at||0);
    const os=ctx.createOscillator(), g=ctx.createGain();
    os.type=o.type||"sine";
    os.frequency.setValueAtTime(o.f,t);
    if(o.f2)os.frequency.exponentialRampToValueAtTime(Math.max(20,o.f2),t+(o.d||.12));
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(o.v||.16,t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0008,t+(o.d||.12));
    os.connect(g);g.connect(bus());
    os.start(t);os.stop(t+(o.d||.12)+0.02);
  }
  function noise(o){
    o=o||{};
    if(!on||!init())return;
    const t=ctx.currentTime+(o.at||0);
    const src=ctx.createBufferSource();src.buffer=noiseBuf();
    const bp=ctx.createBiquadFilter();
    bp.type=o.type||"bandpass";
    bp.frequency.setValueAtTime(o.f||1400,t);
    if(o.f2)bp.frequency.exponentialRampToValueAtTime(o.f2,t+(o.d||.15));
    bp.Q.value=o.q||1.1;
    const g=ctx.createGain();
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(o.v||.12,t+0.006);
    g.gain.exponentialRampToValueAtTime(0.0006,t+(o.d||.15));
    src.connect(bp);bp.connect(g);g.connect(bus());
    src.start(t);src.stop(t+(o.d||.15)+0.03);
  }
  return {
    init,
    toggle(){on=!on;if(on)init();return on;},
    isOn(){return on;},
    setVol(v){vol=Math.max(0,Math.min(1,v));if(gm)gm.gain.value=vol;},
    click(){if(!play("click",.55))noise({f:2600,f2:1500,d:.045,v:.07,q:2});},
    open(){tone({f:420,f2:640,type:"triangle",d:.13,v:.1});},
    shake(){if(!play("dice",.8))noise({f:900,f2:2200,d:.26,v:.09,q:.8});},
    diceOne(){if(!play("dice",.45,1.35))noise({f:1100,f2:2400,d:.16,v:.07,q:.9});},
    tick(){noise({f:2000,f2:1100,d:.06,v:.055,q:2.4});},
    crit(){tone({f:900,f2:1500,type:"square",d:.11,v:.09});
           noise({f:2600,f2:1600,d:.09,v:.08,q:2});},
    hit(){noise({f:260,f2:120,d:.13,v:.2,q:.7,type:"lowpass"});
          tone({f:150,f2:70,type:"triangle",d:.1,v:.12});},
    bow(){ // 矢を放つ
      if(play("bow",.8))return;
      noise({f:3000,f2:700,d:.17,v:.13,q:.9});
      noise({f:5200,f2:2200,d:.07,v:.07,q:2.2});
      tone({f:900,f2:300,type:"sine",d:.09,v:.05});},
    camp(){ if(!play("camp",.55))this.found(); },
    chest(){ if(!play("chest",.75))this.found(); },
    buff(){ if(!play("buff",.7))this.open(); },
    lvup(){ if(!play("lvup",.8))this.found(); },
    pick(){ if(!play("pick",.7))this.open(); },
    shop(){ if(!play("shop",.7))this.open(); },
    magic(){ // 詠唱の弾ける音
      tone({f:520,f2:1300,type:"triangle",d:.16,v:.11});
      tone({f:780,f2:1950,type:"sine",d:.2,v:.07,at:.03});
      noise({f:3200,f2:900,d:.16,v:.07,q:1.4,at:.02});},
    atk(kind){
      if(kind==="bow")return this.bow();
      if(kind==="magic")return this.magic();
      if(kind==="slash"&&play("slash",.75))return;
      if(kind==="blunt"&&play("blunt",.75))return;
      this.hit();},
    miss(){noise({f:1500,f2:600,d:.14,v:.06,q:.8});},
    dmg(){tone({f:210,f2:90,type:"sawtooth",d:.2,v:.13});},
    move(){if(!play("step",.75,1,0.55))noise({f:600,f2:1800,d:.19,v:.07,q:.7});},
    found(){tone({f:660,type:"triangle",d:.1,v:.11});
            tone({f:990,type:"triangle",d:.16,v:.1,at:.1});},
    win(){[523,659,784,1047].forEach((f,i)=>
            tone({f,type:"triangle",d:.3,v:.12,at:i*.12}));},
    lose(){[392,330,262,196].forEach((f,i)=>
            tone({f,type:"sine",d:.42,v:.13,at:i*.16}));},
  };
})();


/* ===== 音量の設定 =====
   0〜100 で持ち、実際の音量は 全体 × それぞれ。
   localStorage に残す（読めない環境でも既定値で動く）。 */
const AUDIO={master:100,sfx:80,bgm:50};
const AUKEY="dd.audio";
function audioLoad(){
  try{
    const o=JSON.parse(localStorage.getItem(AUKEY)||"null");
    if(o&&typeof o==="object")["master","sfx","bgm"].forEach(k=>{
      if(typeof o[k]==="number"&&isFinite(o[k]))
        AUDIO[k]=Math.max(0,Math.min(100,Math.round(o[k])));});
  }catch(e){}
}
function audioSave(){try{localStorage.setItem(AUKEY,JSON.stringify(AUDIO));}catch(e){}}
function audioApply(){
  SFX.setVol(AUDIO.master/100*AUDIO.sfx/100);
  Music.setVol(AUDIO.master/100*AUDIO.bgm/100);
}

/* 立ち絵を描く。race を省くとヒューム扱い */
function pixFig(job,race,size,color){
  race=race||"hume";
  const px=(size||46)/16;
  const bodySet = race==="dwarf" ? PX.bodyStout : (race==="elf" ? PX.bodySlim : PX.body);
  const parts=(bodySet[job]||PX.body.knight)
    .concat((PX.head[race]&&PX.head[race][job])||PX.head.hume[job]||[])
    .concat((PX.extra[race]&&PX.extra[race][job])||[]);
  const r=parts.map(p=>
    `<rect x="${p[0]}" y="${p[1]}" width="${p[2]}" height="${p[3]}" fill="${p[4]}"/>`).join("");
  return `<svg viewBox="0 0 16 20" width="${(size||46)}" height="${Math.round((size||46)*20/16)}"
    shape-rendering="crispEdges" aria-hidden="true">${r}</svg>`;
}

function tagFig(k,size){
  const parts=PXTAG[k];
  if(!parts)return "";
  const r=parts.map(p=>
    `<rect x="${p[0]}" y="${p[1]}" width="${p[2]}" height="${p[3]}" fill="${p[4]}"/>`).join("");
  return `<svg viewBox="0 0 10 10" width="${size||16}" height="${size||16}"
    shape-rendering="crispEdges" style="vertical-align:-2px" aria-hidden="true">${r}</svg>`;
}
/* 報酬がどのプールから来たかを返す */
function poolOf(cat,id){
  const P=REW[cat];
  if(!P)return null;
  for(const grp of Object.keys(P))
    if(P[grp].some(r=>r.id===id))return grp;
  return null;
}
const POOLN={common:"共通",knight:"ナイト",archer:"アーチャー",scout:"スカウト",mage:"ウィザード",

  greed:"強欲",wrath:"憤怒",sloth:"怠惰",gluttony:"暴食",pride:"傲慢",envy:"嫉妬",lust:"色欲"};
function poolTag(cat,id){
  const g=poolOf(cat,id);
  if(!g)return "";
  if(g==="common")return `<span class="ptag2">共通</span>`;
  return `<span class="ptag2">${tagFig(g,13)} ${POOLN[g]}</span>`;
}

function ailAdd(u,k,v,t){
  if(u===me&&passOn("dull")>0)t=Math.max(0,(t||0)-passOn("dull"));
  if(u===me&&passOn("stout")>0&&(k==="slow"||k==="palsy")){
    log(`<span class="c">頑 迷</span> ${AIL[k].n} を受け付けない`);
    return;
  }
  u.ail=u.ail||[];
  const cur=u.ail.find(a=>a.k===k);
  if(cur){cur.v=Math.max(cur.v,v);cur.t=Math.max(cur.t,t);}
  else u.ail.push({k,v,t});
}
function ailSum(u,k){return (u.ail||[]).filter(a=>a.k===k).reduce((x,a)=>x+a.v,0);}
function ailHas(u,k){return (u.ail||[]).some(a=>a.k===k);}
function ailTick(u){
  if(!u.ail)return;
  u.ail.forEach(a=>a.t--);
  u.ail=u.ail.filter(a=>a.t>=0);
}
function badge(icon,label,color,num,turns){
  return `<span class="ailb" style="border-color:${color}" title="${label}">`+
    `${icon}${num!==undefined&&num!==null&&num!==""?`<b style="color:${color}">${num}</b>`:""}`+
    `${turns!==undefined?`<i>${turns}</i>`:""}</span>`;
}
function ailText(u){
  const out=[];
  (u.ail||[]).forEach(a=>{
    const A=AIL[a.k];
    out.push(badge(ailIcon(a.k),A.n,A.c,(a.k==="palsy"?"":a.v),a.t+1));
  });
  /* 有利な状態も同じ形で並べる */
  if(u===me){
    if(me.block)out.push(badge(ailIcon("up_def"),"防御","#8fd0ff",me.block));
    if(me.half)out.push(badge(ailIcon("up_half"),"半減","#9fd8ff",""));
    if(me.tmpPow)out.push(badge(ailIcon("up_pow"),"威力","#ff8b5a",me.tmpPow));
    if(me.tmpDef)out.push(badge(ailIcon("up_def"),"防御","#8fd0ff",me.tmpDef));
  }else{
    if(u.block)out.push(badge(ailIcon("up_def"),"防御","#8fd0ff",u.block));
    if(buffSum(u))out.push(badge(ailIcon("up_pow"),"威力","#ff8b5a",buffSum(u)));
  }
  return out.join("");
}
/* 手番のはじめに継続ダメージを与える。倒れたら true */
async function ailDot(u){
  let d=0;
  const cut=(u===me&&passOn("lung")>0)?0.5:1;
  const ps=ailSum(u,"poison");
  if(ps)d+=ps*cut;
  const bn=ailSum(u,"burn");
  if(bn)d+=Math.max(1,Math.round(u.HP*bn/100))*cut;
  d=Math.round(d);
  if(!d)return false;
  u.HP=Math.max(0,u.HP-d);
  fxOn(u,"magic");
  if(u===me)popSelf("−"+d,"each");else popOn(u,"−"+d,"each");
  log(`<span class="${u===me?"a":"b"}">${u.name}</span> は `+
    (ps&&bn?"毒と火傷":ps?"毒":"火傷")+` で <span class="m">${d}</span> 失った`);
  draw();await wait(420);
  return u.HP<=0;
}

   魔法 火→土→雷→水→火 の循環。光と闇は互いに強い。
   物理 斬・叩・貫。無属性は相性を持たない。          */
const ELEM={
 none:{n:"無",c:"#8b9080",k:"m"},
 fire:{n:"火",c:"#d1603a",k:"m"},
 earth:{n:"土",c:"#a08050",k:"m"},
 bolt:{n:"雷",c:"#d9c04a",k:"m"},
 water:{n:"水",c:"#4f8fbf",k:"m"},
 light:{n:"光",c:"#e6dfb8",k:"m"},
 dark:{n:"闇",c:"#7a5f9c",k:"m"},

};
/* 弱点 ×1.5 ／ 耐性 ×0.7 ／ 属性同士の相性 ×1.35 と ×0.75 */
const ELCYCLE={fire:"earth",earth:"bolt",bolt:"water",water:"fire"};
function elemMul(atk,f){
  if(!atk||atk==="none")return 1;
  let m=1;
  if(f.weak===atk)m*=1.5;
  if(f.resist===atk)m*=0.7;
  if(f.elem){
    if(ELCYCLE[atk]===f.elem)m*=1.35;                       /* 攻撃が有利 */
    if(ELCYCLE[f.elem]===atk)m*=0.75;                       /* 攻撃が不利 */
    if(atk==="light"&&f.elem==="dark")m*=1.35;
    if(atk==="dark"&&f.elem==="light")m*=1.35;
  }
  return Math.max(0.6,Math.min(1.7,m));      /* 重なりすぎないよう頭打ち */
}
function elemTag(k,size){
  const e=ELEM[k];if(!e)return "";
  return `<span class="eltag" style="color:${e.c};border-color:${e.c}${
    size?`;font-size:${size}px`:""}">${e.n}</span>`;
}
/* 図鑑に「弱点を突いた」「耐えられた」を記録する */
function elemKnown(key,kind){
  const r=META.elem[key];
  return !!(r&&r[kind]);
}
function learnElem(key,kind,el){
  META.elem[key]=META.elem[key]||{};
  META.elem[key][kind]=el;
  touchMeta();
}

/* ---------- 技 能 値 ----------
   能力値とは別の軸。判定は幸運と同じ 1d100（roll100）。

   ■ 何のためにあるか
     DEX が「命中・回避・行動順・索敵」の4つを一人で抱えていて、
     しかも成長するのはアーチャーとスカウトだけ、という偏りがあった。
     そのうち「命中」と「索敵」を技能へ移し、DEX には
     「回避」と「行動順」だけを残す。
     あわせて、遠隔と近接の違いが「後列を狙えるか」しか無かったところに、
     射撃と格闘という別々の腕前が入る。

   ■ 値のなりたち
     職業 + 種族 + 欲望　の合計。**能力値からは来ない。**
     装備でもレベルでも動かない、その人の心得。

   ■ 段階
     roll100 が返す k（0=失敗 1=成功 2=ハード 3=エクストリーム）と
     crit（出目1）/ fumble（出目100）をそのまま使う。            */
const SKMAXV=95;                  /* 技能の上限。確実にはしない */
const SK={
  search:{n:"探 索",d:"物音と痕跡に気づく。索敵の先制を決める"},
  shoot: {n:"射 撃",d:"遠くの的を射抜く。遠隔武器の命中"},
  fight: {n:"格 闘",d:"間合いを詰めて当てる。近接武器の命中"},
  forge: {n:"鍛 冶",d:"金属を打つ。装備をこしらえる"},
  cook:  {n:"料 理",d:"火と素材を扱う。道具をこしらえる"},
};
const SKJOB={
  knight:{search:20, shoot:15, fight:55, forge:30, cook:20},
  archer:{search:40, shoot:55, fight:25, forge:20, cook:25},
  scout: {search:55, shoot:35, fight:45, forge:15, cook:20},
  mage:  {search:30, shoot:30, fight:20, forge:20, cook:30},
};
const SKRACE={
  hume: {search: 5, shoot: 5, fight: 5, forge: 5, cook: 5},
  dwarf:{search: 0, shoot:-5, fight: 5, forge:20, cook: 0},
  elf:  {search:10, shoot:10, fight:-5, forge: 0, cook: 5},
  beast:{search:15, shoot: 0, fight:10, forge:-5, cook:-5},
};
const SKORIG={
  greed:   {search:10},
  wrath:   {fight:10},
  sloth:   {cook:10},
  gluttony:{cook:15, forge:-5},
  pride:   {forge:10},
  envy:    {search:10, shoot:5},
  lust:    {shoot:10},
};
/* 技能値。職業・種族・欲望だけで決まる */
function skillOf(k){
  return Math.max(0,Math.min(SKMAXV,
     ((SKJOB[sel.job]||{})[k]||0)
    +((SKRACE[sel.race]||{})[k]||0)
    +((SKORIG[sel.orig]||{})[k]||0)));
}
/* いま持っている武器で使う技能 */
function wepSkill(){ return (me&&me.wep&&me.wep.type==="ranged")?"shoot":"fight"; }
/* 技能値の一覧。いま持っている武器で使う技能に印を付ける */
function skillLine(sep){
  const use=wepSkill();
  return Object.keys(SK).map(k=>{
    const on=(k===use);
    return `<span${on?' style="color:var(--brass)"':""}>${SK[k].n} <b${
      on?' style="color:var(--brass)"':""}>${skillOf(k)}</b></span>`;
  }).join(sep||"　");
}

const CAT={act:{n:"ス キ ル",c:"cskill"},   /* 盤面の .cact（予告アイコン）と名前を分ける */
           pass:{n:"パッシブ",c:"cpass"},
           gear:{n:"装 備",c:"cgear"}};
const PCOND={
  always:()=>true,
  r1:()=>round===1,
  hp70:()=>me.HP<=Math.ceil(me.maxHP*0.7),
  hp50:()=>me.HP<=Math.ceil(me.maxHP*0.5),
  hp30:()=>me.HP<=Math.ceil(me.maxHP*0.3),
  front:()=>me.rank==="front",
  back:()=>me.rank==="back",
  def10:()=>(me.DEF+(me.block||0))>=10,
  guarded:()=>(me.block||0)>0,
  mp50:()=>me.MP>=me.maxMP*0.5,
  hpfull:()=>me.HP>=me.maxHP,
  hp80:()=>me.HP>=me.maxHP*0.8,
  mpfull:()=>me.MP>=me.maxMP,
  solo:()=>true,        /* 味方がいないので今は常に成立する */
};
function passList(){return (me&&me.pass)||[];}
function passOn(k){
  let v=0;
  passList().forEach(p=>{if(p.ef.k===k&&PCOND[p.ef.w]())v+=p.ef.v;});
  return v;
}
function passNames(k){
  return passList().filter(p=>p.ef.k===k&&PCOND[p.ef.w]()).map(p=>p.n);
}

/* ---------- 幸 運 ----------
   幸運は 0〜100 の百分率。判定はいつも 1d100 ≦ 幸運。
   職業にも種族にも欲望にも属さない。生まれつきのもので、
   キャラを作るときに 2d6×2（4〜24）を振って決まる。
   そのあと動かせるのは装備だけ。レベルでは伸びない（DEF と同じ考え方）。
   働く場所は3つ。
     ① 攻撃で一つも当たらなかったとき   1d100 ≦ 幸運      → もう一つ振る
     ② 宝箱に並ぶ装備の等級の上限 +1     1d100 ≦ 幸運
     ③ 宝箱に並ぶ数 3 → 4               1d100 ≦ 幸運 ÷ 2
   ②③ は宝箱と打ち捨てられた箱だけ。戦利品とレベルアップには効かない。 */
/* 能力値の上限。決めたものだけ書く（書いていない能力値は青天井のまま）。
   DEX は 回避・行動順 に効き、しかも装備で大きく伸びるので、
   放っておくと後半でどこまでも伸びて相手が当てられなくなる。
   一時的な上乗せ（バフ・パッシブ）も dexOf() で同じ上限に丸める。 */
const STATMAX={DEX:100};

const LUKMAX=95;                 /* 確定にはしない。必ず外れる余地を残す */
const r100=()=>1+Math.floor(Math.random()*100);
function lukOf(){return (me&&me.LUK)||0;}

/* 成功にも段階がある（クトゥルフ神話TRPG 7版のやり方に倣った）。
     出目 ≦ 幸運 ÷ 5  … 超あたり
     出目 ≦ 幸運 ÷ 2  … 大あたり
     出目 ≦ 幸運      … あたり
     それ以外          … はずれ
   出目 1 は幸運がいくつでも必ず超あたり。出目 100 は必ずはずれ。
   段階の数（k = 0〜3）がそのまま効き目の大きさになる。 */
const LUKRANK=[
  {n:"は ず れ",s:"はずれ",  c:"#7d6b68"},
  {n:"あ た り",s:"あたり",  c:"#8fa261"},
  {n:"大 あ た り",s:"大あたり",c:"#c9a227"},
  {n:"超 あ た り",s:"超あたり",c:"#d98f3f"},
];
function lukCuts(pct){
  const p=Math.max(0,Math.min(LUKMAX,pct||0));
  return {p,hit:p,hard:Math.floor(p/2),ext:Math.floor(p/5)};
}
/* 1d100 の判定はひとつだけ。幸運も技能もこれを使う。
   k は段階（0=失敗 1=成功 2=ハード 3=エクストリーム）。
   crit は出目1、fumble は出目100。ファンブルは ただの失敗より悪い扱いにする。 */
function roll100(pct){
  const c=lukCuts(pct), v=r100();
  let k=0, crit=false, fumble=false;
  if(v===1){k=3;crit=true;}          /* 目の 1 は必ず最上 */
  else if(v===100){k=0;fumble=true;} /* 目の 100 は必ず最低 */
  else if(v<=c.ext)k=3;
  else if(v<=c.hard)k=2;
  else if(v<=c.hit)k=1;
  return {v,k,crit,fumble,...c};
}
function lukRoll(pct){
  const r=roll100(pct);
  return {...r,...LUKRANK[r.k]};
}

function makeMe(){
  const J=JOB[sel.job];
  const base={STR:0,DEX:0,INT:0,VIT:0,DEF:0,LUK:0};
  [J.st,RACE[sel.race].st,ORIG[sel.orig].st].forEach(o=>{
    for(const k in o)base[k]=(base[k]||0)+o[k];});
  base.LUK=sel.luk||0;      /* 幸運だけは職業・種族・欲望から来ない */
  const m={name:`${RACE[sel.race].n}の${JOB[sel.job].n}`,short:J.n,art:J.art,
    baseWep:J.wep,isFoe:false,
    base:base,grow:{STR:0,DEX:0,INT:0,VIT:0,DEF:0},
    eq:{wep:null,armor:null,acc:[]},stash:[],
    blkBonus:0,gold:0,bag:{},mats:{},recipes:[],lv:1,exp:0,
    sk:[],pass:[],block:0,half:false,rank:"front"};
  recalcMe(m,true);
  return m;
}
function recalcMe(m,full){
  m=m||me;
  const st={STR:0,DEX:0,INT:0,VIT:0,DEF:0,LUK:0};
  let hp=0,blk=0,bag=0;
  [m.eq.armor].concat(m.eq.acc||[]).forEach(g=>{
    if(!g)return;
    if(g.st)for(const q in g.st)st[q]+=g.st[q];
    if(g.hp)hp+=g.hp;
    if(g.blk)blk+=g.blk;
    if(g.bag)bag+=g.bag;
  });
  m.raw={};
  ["STR","DEX","INT","VIT","DEF"].forEach(k=>{
    const raw=m.base[k]+m.grow[k]+st[k];
    m.raw[k]=raw;                                   /* 丸める前 */
    m[k]=Math.max(1,Math.min(STATMAX[k]||9999,raw));
  });
  /* 幸運は伸びない。生まれの値と装備だけで決まる */
  m.LUK=Math.max(0,Math.min(LUKMAX,(m.base.LUK||0)+st.LUK));
  m.gearBlk=blk;
  m.bagPlus=bag;
  m.wep=WEP[m.eq.wep?m.eq.wep.key:m.baseWep];
  const oldMax=m.maxHP||0;
  const pHP=(m.pass||[]).filter(p=>p.ef&&p.ef.k==="maxhp").reduce((a,p)=>a+p.ef.v,0)
    -(m.pass||[]).filter(p=>p.ef&&p.ef.k==="slim").length*10;
  const pMP=(m.pass||[]).filter(p=>p.ef&&p.ef.k==="maxmp").reduce((a,p)=>a+p.ef.v,0);
  m.maxHP=Math.round((m.VIT*4+35+hp)
    *((ORIG[sel.orig]&&ORIG[sel.orig].hpMul)||1)*(1+pHP/100));
  const pMPP=(m.pass||[]).filter(p=>p.ef&&p.ef.k==="maxmpp").reduce((a,p)=>a+p.ef.v,0);
  const pINT=(m.pass||[]).filter(p=>p.ef&&p.ef.k==="statINT").reduce((a,p)=>a+p.ef.v,0);
  m.maxMP=Math.round((Math.round(m.INT*(1+pINT/100)*0.56)+6+pMP)*(1+pMPP/100));
  if(full){m.HP=m.maxHP;m.MP=m.maxMP;}
  else{m.HP=Math.min(m.maxHP,m.HP+Math.max(0,m.maxHP-oldMax));m.MP=Math.min(m.maxMP,m.MP);}
}
/* 区画を抜けるごとに敵が重くなる。
   これまで depthMul は「その区画の何段目か」しか見ておらず、
   何区画目かを一切見ていなかった。だから後半が物足りなくなる。
   ボスに至っては常に等倍で、同じ区画の奥の雑魚より弱かった。 */
function depthAt(tier){ return 1+((tier||1)-1)*0.34; }
function depthMul(){
  const r=(RUN&&RUN.cur)?RUN.cur.r:0;
  const d=depthAt(areaTier());
  if(RUN&&RUN.boss)return 1.3*d;        /* ボスは その区画の最奥より重い */
  return (r<2?0.9:(r<5?1:(r<10?1.14:1.3)))*d;
}
function makeFoes(){
  const dm=depthMul();
  return ENCS[sel.enc].list.map((k,i)=>{
    const f=FOE[k];
    return {...f,id:i,key:k,name:f.n+(ENCS[sel.enc].list.filter(x=>x===k).length>1?" "+"ABC"[i]:""),
      maxHP:Math.round(f.HP*dm),HP:Math.round(f.HP*dm),
      STR:Math.round(f.STR*(1+(dm-1)*0.6)),
      rank:(f.flex?(Math.random()<0.5?"front":"back"):f.rank),turn:0,
      block:0,buffs:[],ail:[],stun:false,isFoe:true,tele:null,lastAid:null,sumCd:0,sumUsed:false};
  });
}
const alive=()=>foes.filter(f=>f.HP>0);
const onBoard=()=>foes.filter(f=>f.HP>0);
const aliveIn=r=>alive().filter(f=>f.rank===r);
function frontOpen(){return aliveIn("front").length===0;}
/* 近接で狙えるか：敵前列が生きているなら前列のみ、全滅なら後列も殴れる */
function vowTarget(){
  if(!me.vow||me.vow.id===null)return null;
  return foes.find(x=>x.id===me.vow.id)||null;
}
function vowGone(){
  const t=vowTarget();
  return !!(me.vow&&(!t||t.HP<=0));
}
function canTarget(f){
  if(f.HP<=0)return false;
  if(me.vow&&me.vow.id!==null&&f.id!==me.vow.id&&!(pending&&pending.item))return false;
  if(pending&&pending.item)return true;      // 投げる道具はどこにでも届く
  if(pending&&pending.backOnly)return f.rank==="back";
  if(pending&&pending.slower)return f.DEX<dexOf();
  if(me.wep.type==="ranged")return true;
  if(me.rank!=="front")return false;
  return f.rank==="front"||frontOpen();
}

/* ---------- 予告 ---------- */
const AIDK=["buff","cheer","hex","veil"];
function chooseTele(f){
  /* 決まった順番の行動（seq）。味方が絶えたら solo の行動だけを回す */
  const alone=aliveIn("front").filter(x=>x!==f).length===0;
  if(f.acts.some(a=>a.solo)&&alone){
    const sp=f.acts.filter(a=>a.solo);
    const st=sp.reduce((x,a)=>x+(a.w||1),0);
    let sr=Math.random()*st;
    for(const a of sp){sr-=(a.w||1);if(sr<=0)return {...a};}
    return {...sp[0]};
  }
  const seq=f.acts.find(a=>a.seq===(f.turn||0)+1);
  if(seq&&!alone){f.turn=(f.turn||0)+1;return {...seq};}
  if(f.forceNext){
    const fa=f.acts.find(a=>a.n===f.forceNext);
    f.forceNext=null;
    if(fa)return {...fa,dice:fa.diceRand?(1+Math.floor(Math.random()*fa.diceRand)):fa.dice};
  }
  const pool=f.acts.filter(a=>{
    if(a.hidden)return false;                       // 単体では選ばれない
    if(a.seq)return false;                          // 決まった手番でのみ出る
    if(a.needFront&&aliveIn("front").filter(x=>x!==f).length===0)return false;
    if(a.noFront&&aliveIn("front").filter(x=>x!==f).length>0)return false;
    if(a.pos&&a.pos!==f.rank)return false;          // 立ち位置で使い分ける
    if(a.k==="cheer")return aliveIn("front").length>0;
    if(a.k==="summon"){
      if(f.sumUsed&&a.once)return false;
      if(f.sumCd>0)return false;
      if(a.alone&&alive().filter(x=>x!==me).length>1)return false;
      return aliveIn("front").length<3;
    }
    if(AIDK.includes(a.k)&&f.lastAid===a.n)return false;   // 同じ強化・弱体は連続しない
    return true;
  });
  if(!pool.length)return {...f.acts[0]};
  const tot=pool.reduce((s,a)=>s+(a.w||1),0);
  let r=Math.random()*tot;
  for(const a of pool){r-=(a.w||1);if(r<=0)return pick(a);}
  return pick(pool[0]);
  function pick(a){
    const o={...a};
    if(a.diceRand)o.dice=1+Math.floor(Math.random()*a.diceRand);
    return o;
  }
}
function telePreview(f,tt){
  const t=tt||f.tele;
  if(!t)return {txt:"—",sub:"",danger:false};
  if(t.k==="atk"){
    let per=perHit(Math.max(1,Math.round((f.STR+(t.pow||0)+buffSum(f)-ailSum(f,"weak"))
      *(1-Math.min(0.6,ailSum(f,"weakp")/100)))),defOf(me));
    const far=(f.rank==="front"&&me.rank==="back");
    if(far)per=Math.max(1,Math.round(per*0.6));
    const thr=threshold(f,me,{});
    const R=hitRange(per,t.dice,thr);
    return {txt:"⚔ "+t.n,
      sub:`${t.dice}d6 ・ 1ヒット ${per} ・ 最大 ${R.hi*t.dice}`+
        (t.drain?`　／　与えた分の ${Math.round(t.drain*100)}% を吸う`:"")+
        (far?`　／　後衛なので4割減`:""),danger:true};
  }
  if(t.k==="guard")return {txt:"◈ "+t.n,sub:`防御 +${t.block}（1ヒットごと）`,danger:false};
  if(t.k==="buff")return {txt:"▲ "+t.n,sub:`自分の威力 +${t.pow}　${(t.dur||1)+1}ターン`,danger:false};
  if(t.k==="cheer")return {txt:"▲ "+t.n,sub:`前列すべての威力 +${t.pow}`,danger:false};
  if(t.k==="summon")return {txt:"✚ "+t.n,
    sub:`${FOE[t.who].n} を 1〜3 体 呼ぶ`,danger:true};
  if(t.k==="regen")return {txt:"✚ "+t.n,sub:`自分の HP を ${t.heal} 回復する`,danger:false};
  if(t.k==="hex")return {txt:"✦ "+t.n,
    sub:[t.curse?`こちらのDEF −${t.curse}`:"",t.weak?`こちらの威力 −15%`:"",
      t.slow?`こちらのDEX −${t.slow}`:"",t.blind?`こちらの命中閾値 +${t.blind}`:""]
      .filter(Boolean).join("　")+
      `　${(t.dur||2)+1}ターン`+(t.dice?`　＋ ${t.dice}d6 の侵蝕`:""),danger:true};
  if(t.k==="veil")return {txt:"◈ "+t.n,sub:`前列すべてに DEF +${t.block}`,danger:false};
  return {txt:t.n,sub:"",danger:false};
}

/* ---------- 描画 ---------- */
/* すでにこの手番を終えた敵は、次の手番の行動を出す */
function shownTele(u){
  const i=queue.indexOf(u);
  const acted=(i>=0&&i<qi);
  return acted?{t:u.next||u.tele,lbl:"次のターン",nx:null}
              :{t:u.tele,lbl:"このターン",nx:u.next};
}
function unitCell(u,isMine){
  const st=isMine?null:shownTele(u);
  const p=isMine?null:telePreview(u,st.t);
  const target=!isMine&&pending&&canTarget(u);
  const col=isMine?"#8fa261":"#b1544a";
  return `<div class="cell ${u.HP<=0?"dead":""} ${target?"sel":""}"
      ${isMine?'data-me="1"':`data-id="${u.id}"`}>
    <div class="por">${isMine?meFig(40):foeFig(u.key,40)}</div>
    <div class="cn ${isMine?"mine":"foe"}">${u.name}</div>
    <div class="chp">${Math.max(0,u.HP)}/${u.maxHP}</div>
    <div class="bar ${isMine?"me":""}"><i style="width:${Math.max(0,u.HP/u.maxHP*100)}%"></i></div>
    ${isMine?`<div class="cmp">MP ${u.MP}/${u.maxMP}</div>
      <div class="bar mpb"><i style="width:${u.maxMP?u.MP/u.maxMP*100:0}%"></i></div>`:""}
    ${ailText(u)?`<div class="celrow">${ailText(u)}</div>`:""}
    ${isMine&&u.half?`<div class="cst">被弾 半減</div>`:""}
    ${target&&u.HP>0?`<div class="ctarget">${
       threshold(me,u,pending&&pending.kind==="skill"&&me.sk[pending.i]
         ?{thr:me.sk[pending.i].thr||0,even:me.sk[pending.i].even}:{})}以上</div>`:""}
    ${!isMine?(u.HP>0?(()=>{const ic=actIcon(st.t);
        return `<div class="cact ${p.danger?"bad":"ok"}" title="${p.txt}">${ic.g}</div>`;})()
      /* 倒れても枠は空けておく。消すとセルが縮み、行動一覧が毎ターン動く */
      :`<div class="cact" style="visibility:hidden"></div>`):""}
  </div>`;
}
function emptyCell(){return `<div class="cell"></div>`;}
function slotRows(list){
  const out=[null,null,null], order=[1,0,2];
  list.slice(0,3).forEach((u,i)=>{out[order[i]]=u;});
  return out;
}
/* 盤面に並べる顔ぶれ。枠は3つしかないので、倒れた者は空きがあるときだけ残す。
   生きている者を押し出すと、その敵は絵が出ず、的として押せなくなる
   （仲間を呼ぶ敵がいると起きる）。並び順は変えないので位置は動かない。 */
function boardList(list){
  if(list.length<=3)return list;
  const live=list.filter(f=>f.HP>0);
  if(live.length>=3)return live.slice(0,3);
  const keep=new Set(live);
  list.filter(f=>f.HP<=0).slice(0,3-live.length).forEach(f=>keep.add(f));
  return list.filter(f=>keep.has(f));
}
/* 行動の種類をアイコンに */
function actIcon(t){
  if(t&&t.k==="hex")return {g:"✦",c:"hex"};
  if(t&&t.k==="regen")return {g:"✚",c:"buf"};
  if(t&&t.k==="summon")return {g:"✚",c:"hex"};
  if(!t)return {g:"…",c:"me",n:"—"};
  if(t.k==="atk")return {g:"⚔",c:"atk",n:"攻撃"};
  if(t.k==="guard"||t.k==="veil")return {g:"◈",c:"def",n:"防御"};
  if(t.k==="buff"||t.k==="cheer")return {g:"▲",c:"buf",n:"溜め"};
  return {g:"→",c:"me",n:"移動"};
}
function drawOrder(){
  const host=$("#ordList");if(!host)return;
  const st=$("#stageLbl");
  if(st&&RUN&&RUN.cur)
    st.textContent=`${areaOf().n||""}　${RUN.cur.name}`+(RUN.elite?"　［手練れ］":RUN.boss?"　［ボス］":"");
  /* 1枚のふだ。act に null を渡すと「？」になる（自分の手は自分で決めるので） */
  const card=(u,{no,act,cls})=>{
    const mine=(u===me);
    const ic=mine?{g:"？",c:"me"}:actIcon(act);
    return `<div class="ord ${mine?"mine":"foe"} ${cls}" title="${u.name}" ${
      mine?'data-om="1"':`data-oid="${u.id}"`}>
      <div class="oface">
        ${mine?faceFig(sel.job,sel.race,34):foeFaceFig(u.key,34)}
        <div class="oact ${ic.c}">${ic.g}</div>
        <div class="oi">${no}</div>
      </div></div>`;
  };
  /* いまのラウンド。済んだ者は薄くする */
  let h=queue.map((u,i)=>{
    if(u!==me&&u.HP<=0)return "";
    const done=(i<qi||u.HP<=0);
    return card(u,{no:i+1,
      act:done?(u.next||u.tele):u.tele,
      cls:(i===qi?"now ":"")+(done?"done":"")});
  }).join("");
  /* 次のラウンド。並びも技も いまの値から決まるので前もって出せる */
  const later=orderOf().filter(u=>u===me||u.HP>0);
  if(later.length){
    h+=`<div class="orddiv"><b>R${round+1}</b><span>次</span></div>`;
    h+=later.map((u,i)=>card(u,{no:i+1,act:u.next||u.tele,cls:"later"})).join("");
  }
  host.innerHTML=h;
  host.querySelectorAll("[data-oid]").forEach(el=>{
    el.onclick=()=>{const f=foes.find(x=>x.id===+el.dataset.oid);if(f)foeModal(f);};});
  host.querySelectorAll("[data-om]").forEach(el=>{el.onclick=()=>charModal();});
  const now=host.querySelector(".ord.now");
  if(now&&now.scrollIntoView)now.scrollIntoView({block:"nearest",inline:"nearest"});
  if(!$("#detail").classList.contains("hide"))drawDetail();
}

function draw(){
  const myBack =slotRows(me.rank==="back" ?[me]:[]);
  const myFront=slotRows(me.rank==="front"?[me]:[]);
  /* 倒れた敵も置いたままにする。後列は元からそうしており、前列だけ消していた。
     消すと生き残りが詰めて動き、盤面が縮んで行動一覧の位置が毎ターンずれる。
     倒れた枠は unitCell が dead で灰色にし、canTarget が的から外す。 */
  const fFront=slotRows(boardList(foes.filter(f=>f.rank==="front")));
  const fBack =slotRows(boardList(foes.filter(f=>f.rank==="back")));
  /* 使う段だけ描く。3段を常に敷くと、敵1体の戦闘で 200px 以上が空のまま残り、
     行動一覧が画面の外へ押し出される。
     段数は倒れた敵を数に入れたまま決めるので、戦闘の途中で盤面の高さは動かない
     （行動一覧の位置がずれると押し間違える）。呼ばれた仲間が増えたときだけ伸びる。 */
  const held=[slotRows(me.rank==="back"?[me]:[]),slotRows(me.rank==="front"?[me]:[]),
              slotRows(boardList(foes.filter(f=>f.rank==="front"))),
              slotRows(boardList(foes.filter(f=>f.rank==="back")))];
  const rows=[0,1,2].filter(r=>held.some(c=>c[r]));
  if(!rows.length)rows.push(1);
  let h="";
  rows.forEach(r=>{
    h+=myBack[r] ?unitCell(myBack[r],true) :emptyCell();
    h+=myFront[r]?unitCell(myFront[r],true):emptyCell();
    h+=`<div class="gap"></div>`;
    h+=fFront[r] ?unitCell(fFront[r],false):emptyCell();
    h+=fBack[r]  ?unitCell(fBack[r],false) :emptyCell();
  });
  $("#board").innerHTML=h;
  drawOrder();
  bindCells();
  if(pending)bindTargets();   /* 的を選ぶ最中は、選べるマスだけそちらで上書きする */
}
/* 盤面の誰かを押したら、その者の詳細を開く。
   的を選んでいる最中は選択のほうが大事なので何もしない（bindTargets が受け持つ）。 */
function bindCells(){
  document.querySelectorAll("#board .cell[data-id],#board .cell[data-me]").forEach(el=>{
    const dead=el.classList.contains("dead");
    if(!dead)el.classList.add("look");
    el.onclick=()=>{
      if(pending)return;
      if(el.dataset.me)return charModal();
      const f=foes.find(x=>x.id===+el.dataset.id);
      if(f)foeModal(f);
    };
  });
}
function bindTargets(){
  document.querySelectorAll(".cell.sel").forEach(el=>{
    el.onclick=()=>{const id=+el.dataset.id;const f=foes.find(x=>x.id===id);
      const p=pending;pending=null;$("#prompt").textContent="";
      if(p&&p.item)return doItem(p.item,f);
      resolvePlayer(p,f);};
  });
}

/* ---------- 判定 ---------- */
/* 出目ごとに、そのダイス分の威力が変わる
   ちょうど閾値 = ±0 ／ 1つ上 = +5% ／ 2つ上 = +10% … 上限 +25%
   閾値4なら 4→±0・5→+5%・6→+10% */
function dieRate(v,thr){
  let r=Math.min(0.25,Math.max(0,(v-thr)*0.05));
  /* 激昂：6 の目だけ 上昇率が大きくなる */
  if(v===6&&typeof me!=="undefined"&&me&&passOn("rush")>0)
    r=Math.min(0.35,r+passOn("rush")/100);
  return r;
}
function hitDmg(per,v,thr){return Math.max(1,Math.round(per*(1+dieRate(v,thr))));}
function perHit(pow,def){return Math.max(Math.ceil(pow*0.25),pow-def);}
function pctText(r){return "+"+Math.round(r*100)+"%";}
function hitRange(per,dice,thr){
  return {lo:Math.max(1,per),hi:Math.max(1,hitDmg(per,6,thr))};
}
/* 武器ごとの威力倍率。手数の多い武器ほど低い */
function statMul(w){return w.mul||1;}
function orgMul(k){return (ORIG[sel.orig]&&ORIG[sel.orig][k])||1;}
/* 持続つきの強化・弱体。自分の手番が来るたび 1 減り、切れたら消える */
function buffSum(u){return (u.buffs||[]).reduce((a,b)=>a+b.v,0);}
function tickBuffs(u){
  if(!u.buffs)return;
  u.buffs.forEach(b=>b.t--);
  u.buffs=u.buffs.filter(b=>b.t>=0);
}
function addBuff(u,v,t){(u.buffs=u.buffs||[]).push({v,t:t||1});}
/* 弱体は状態異常（me.ail）に一本化した。
   前は me.debuffs という別の配列と me.curse / me.weak というスカラーもあり、
   3通りの持ち方が並んでいた。うち2つは書く側と読む側が繋がっておらず、
   敵の hex は数字を動かしていなかったし、アンチポーションは何も解いていなかった。 */
function slowSum(){return ailSum(me,"slow");}
/* 上限の扱いは、どこから来た上乗せかで変える。
     成長・装備・パッシブ … 上限で止まる。積んでも無駄になる
     スキルのバフ        … 上限を越えられる。その戦闘のあいだだけの伸び
   鈍足で下がるぶんは丸めない。
   （me.order を読む枝があったが、書く場所がどこにも無かったので消した） */
function dexPassive(){
  const dp=1+passOn("statDEX")/100;
  return Math.round(me.DEX*dp)+passOn("dex")+passOn("light")*15
    +passOn("allround")*3+passOn("slim")*10+passOn("fang")*6;
}
function dexBuff(){
  return (me.beast?me.beast.dex:0)+(me.dexUp||0);
}
function dexOf(){
  return Math.max(1,Math.min(STATMAX.DEX,dexPassive())+dexBuff()-slowSum());
}
/* その上乗せ(add)のうち、上限を超えて無駄になっている量。
   「外したら実際にいくつ下がるか」を引いて出すので、
   何個も積んでいても一つひとつについて正しい数が出る。 */
function statWaste(k,add){
  const cap=STATMAX[k];
  if(!cap||!add||add<=0||!me||!me.raw)return 0;
  const raw=me.raw[k];
  const now    =Math.max(1,Math.min(cap,raw));
  const without=Math.max(1,Math.min(cap,raw-add));
  return Math.max(0,add-(now-without));
}
/* パッシブぶんが上限で削られている量 */
function dexPassiveWaste(){
  const cap=STATMAX.DEX;
  const p=dexPassive();
  return Math.max(0,p-cap);
}
/* 装備が持っている上乗せのうち、上限で捨てられているぶんを一言で返す */
function wasteNote(g){
  if(!g||!g.st)return "";
  const out=[];
  for(const k in STATMAX){
    const w=statWaste(k,g.st[k]||0);
    if(w>0)out.push(`${k} の <b>+${w}</b>`);
  }
  return out.length
    ? `<br><span style="color:var(--blood)">この装備の ${out.join("　")} は 上限 ${
        STATMAX.DEX} を超えていて無駄になっている</span>`
    : "";
}
function powOf(u,opt){
  opt=opt||{};
  if(u.isFoe){
    const wk=ailSum(u,"weak"), wp=ailSum(u,"weakp");
    return Math.max(1,Math.round((u.STR+(opt.pow||0)+buffSum(u)-wk)*(1-Math.min(0.6,wp/100))));
  }
  let base=u[u.wep.stat];
  if(u===me){
    let bm=1+passOn("stat"+u.wep.stat)/100;
    if(me.whim===u.wep.stat)bm+=passOn("whim")/100;
    base=Math.round(base*bm);
  }
  let p=Math.round(base*statMul(u.wep))+(opt.pow||0);
  if(opt.powMul)p=Math.round(p*opt.powMul);
  if(u===me){                    /* 弱体は敵と同じ扱い。固定値を引いてから割合を掛ける */
    const wk=ailSum(me,"weak"), wp=ailSum(me,"weakp");
    if(wk||wp)p=Math.max(1,Math.round((p-wk)*(1-Math.min(0.6,wp/100))));
  }
  return p;
}
/* 図鑑の段階。META.codex[k] は「その敵と戦った回数」。
   同じ敵が3体並ぶ遭遇でも1戦につき1しか増えない（数えるのは戦闘の回数）。

   前は 体数 をそのまま段階にしていたため、3体そろう遭遇を2回こなすだけで
   カンストし、草原1階層が終わる前に主要な敵が全部 5/5 になっていた。

     1段目  1戦   名前と列
     2段目  3戦   HP・攻　＋命中閾値 −1
     3段目  6戦   DEF・速　＋命中閾値 さらに −1
     4段目 10戦   使う技の名前
     5段目 15戦   弱点と耐性（突いていなくても分かる）

   段階を増やしたい・遅くしたいときはこの表だけ触ればよい。 */
const CODEXN=[1,3,6,10,15];
function codexLv(k){
  const n=META.codex[k]||0;
  let lv=0;for(const t of CODEXN)if(n>=t)lv++;
  return lv;
}
/* 次の段階まであと何戦か。0 なら最後まで進んでいる */
function codexNext(k){
  const n=META.codex[k]||0;
  for(const t of CODEXN)if(n<t)return t-n;
  return 0;
}
/* 弱点と耐性。実際に突いて覚えたぶんに加え、5段目まで進むと分かる */
function knownElem(key,kind){
  const r=META.elem[key];
  if(r&&r[kind])return r[kind];
  return codexLv(key)>=5?(FOE[key]&&FOE[key][kind])||null:null;
}
function threshold(u,tgt,opt){
  opt=opt||{};
  let t=4;
  t+=ailSum(u,"blur");                   /* 盲目：狙いが定まらない */
  if(!u.isFoe&&tgt.key){
    const c=codexLv(tgt.key);
    if(c>=2)t-=1;      /* 3戦 */
    if(c>=3)t-=1;      /* 6戦。段階を遅くしたぶん、ここは前の4段目から繰り上げた */
  }
  if(!u.isFoe){
    if(u.wep.type==="ranged"&&u.rank==="front")t+=1;      // 近すぎて撃ちにくい
    if(u.wep.type==="ranged"&&tgt.rank==="back")t+=1;     // 後列は遠い
    t-=(opt.thr||0);
    if(me.focus)t-=me.focus.v;
    if(passOn("rank")>0&&tgt.maxHP<me.maxHP)t-=1;
  }
  /* 当てる側と避ける側で、見る数字を分ける。
       自分が攻めるとき … 武器に応じた技能（射撃 / 格闘）。DEX は見ない
       敵が攻めるとき   … こちらの DEX（回避）。技能は見ない
     こうすると DEX の仕事が「回避と行動順」だけになり、
     遠隔と近接に別々の腕前が生まれる。                        */
  if(u===me){
    t-=skillHit(wepSkill());
    /* 相手の素早さ。速い相手ほど当てにくい。
       ここは相手の DEX そのものを見る（こちらの DEX との差では見ない）。
       差にすると自分の DEX がまた命中に効いてしまい、
       DEX から命中を剥がした意味が薄れるため。
       鈍足をかければ相手の DEX が下がるので、そのぶん当てやすくなる。 */
    t+=Math.floor(Math.max(1,tgt.DEX-ailSum(tgt,"slow"))/15);
  }else{
    const td=(tgt===me)?dexOf():Math.max(1,tgt.DEX-ailSum(tgt,"slow"));
    t+=Math.max(0,Math.floor((td-u.DEX)/15));            /* こちらの回避 */
  }
  return Math.max(2,Math.min(6,t));
}
/* 技能 40 を並として、25 ごとに命中閾値が 1 動く。
   技能 15 → −1（当てにくい）　40 → 0　65 → +1　90 → +2 */
function skillHit(k){ return Math.round((skillOf(k)-40)/25); }

/* 判定の段階の呼び名。技能はこれ、幸運は LUKRANK を使う */
const SKRANK=[
  {n:"失 敗",       s:"失敗",       c:"#7d6b68"},
  {n:"成 功",       s:"成功",       c:"#8fa261"},
  {n:"ハ ー ド 成 功", s:"ハード成功", c:"#c9a227"},
  {n:"エ ク ス ト リ ー ム", s:"エクストリーム", c:"#d98f3f"},
];
/* 索敵は段階のぶんだけ先制ダイスが増える（最初の攻撃だけ） */
const SCOUTGAIN=[0,1,2,3];

/* ---------- こしらえる（鍛冶・料理） ----------
   レシピを持っていることは前提。そのうえで技能を振る。
     ファンブル … 素材も加工賃も失う
     失 敗     … 加工賃だけ失う。**素材は手元に残る**
     成 功     … そのまま
     ハード     … 上物
     エクストリーム … 業物
     クリティカル  … 会心の出来
   料理は品質が「個数」に、鍛冶は「性能の倍率」になる。
   道具は me.bag が {鍵:個数} なので一つひとつに品質を持たせられないが、
   装備は me.eq に実体が入るので倍率をかけられる。            */
const CRAFTQ=[
  {n:"失 敗",       c:"#7d6b68", mul:0,    num:0, tag:""},
  {n:"成 功",       c:"#8fa261", mul:1,    num:1, tag:""},
  {n:"上 物",       c:"#c9a227", mul:1.15, num:2, tag:"＋"},
  {n:"業 物",       c:"#d98f3f", mul:1.3,  num:3, tag:"＋＋"},
];
const CRAFTCRIT={n:"会 心 の 出 来", c:"#e9c46a", mul:1.5, num:4, tag:"★"};
function craftSkill(id){ return RECIPES[id].kind==="forge"?"forge":"cook"; }
function craftQuality(r){
  if(r.fumble)return {...CRAFTQ[0],fumble:true};
  if(r.crit)return CRAFTCRIT;
  return CRAFTQ[r.k];
}
/* 装備に品質の倍率をかける。名前に印を付けて、見て分かるようにする */
function gearWithQuality(g,q){
  if(!q||q.mul<=1)return {...g};
  const out={...g, n:g.n+q.tag};
  if(g.st){out.st={};for(const k in g.st)out.st[k]=Math.round(g.st[k]*q.mul);}
  if(g.hp)out.hp=Math.round(g.hp*q.mul);
  if(g.blk)out.blk=Math.round(g.blk*q.mul);
  const d=[];
  if(out.st)for(const k in out.st)d.push(`${k} ${out.st[k]>=0?"+":""}${out.st[k]}`);
  if(out.hp)d.push(`最大HP ${out.hp>=0?"+":""}${out.hp}`);
  if(out.blk)d.push(`防御時の上乗せ +${out.blk}`);
  if(out.bag)d.push(`道具を ${out.bag} つ多く持てる`);
  out.d=d.join("　")+`　<span style="color:${q.c}">${q.n.replace(/ /g,"")}</span>`;
  return out;
}
function defOf(u){
  let d=u.DEF+(u.block||0)+(u===me?passOn("guard")+(me.tmpDef||0)-passOn("light")*10
    +passOn("allround")*3+(me.selfDef||0):0);
  if(u===me)d+=passOn("grace")*4;
  if(u===me&&passOn("clean")>0&&!me.hurtThisRound)d+=passOn("clean");
  if(u===me&&me.beast)d=Math.round(d*me.beast.def);
  d=Math.max(0,d-ailSum(u,"break"));   /* 防壊は敵にも自分にも同じように効く */
  return d;
}   // 構えは防御値に上乗せされる
function blockValue(){return 5+Math.floor(me.VIT/7)+(me.blkBonus||0)+(me.gearBlk||0);}
const GUARD_MP=4;

/* ---------- 行動一覧 ---------- */
/* 狙える相手ぜんぶの命中閾値。ボタンを描く時点では相手が決まっていないので、
   幅があるときは「4〜5」のように範囲で出す。opt は技の補正（thr など）。 */
function thrText(opt,filter){
  const list=alive().filter(f=>(filter?filter(f):canTarget(f)));
  if(!list.length)return "";
  const v=[...new Set(list.map(f=>threshold(me,f,opt||{})))].sort((a,b)=>a-b);
  return v.length===1?`${v[0]}以上`:`${v[0]}〜${v[v.length-1]}以上`;
}

      : (s.slower? !alive().some(f=>f.DEX<dexOf()) : !foes.some(canTarget)))
      ||(s.kind==="atk"&&vowGone());
    const why=needFront?"前衛でのみ":noTgt?"届く相手がいない":

    /* 当てる技だけ、その技の補正込みの閾値を出す */

    if(s.kind==="atk"&&!noTgt&&!needFront&&!tooLate){
      const f=s.backOnly?(x=>x.rank==="back"&&x.HP>0)
             :s.slower ?(x=>x.DEX<dexOf()&&x.HP>0)
             :null;

/* ---------- 逃 走 ----------
   1戦闘に1回だけ、1ターンを使って挑戦できる。
   こちらの素早さと、いちばん速い追っ手の素早さの 1d100 対抗。
   倒した数だけ包囲がゆるむので、追っ手の値はそのぶん下がる。
   DEX の上限が 100 なので、40 を下駄にしてそのまま百分率として使える。 */
const FLEEBASE=40, FLEEDOWN=12;
function fleeOdds(){
  const ls=alive();
  const fast=ls.reduce((a,f)=>(a&&a.DEX>=f.DEX)?a:f, ls[0]);
  const down=Math.max(0,foeStart-ls.length);
  const cl=v=>Math.max(5,Math.min(95,Math.round(v)));
  return {
    mine  : cl(FLEEBASE+dexOf()),
    theirs: cl(FLEEBASE+(fast?Math.max(1,fast.DEX-ailSum(fast,"slow")):0)-down*FLEEDOWN),
    fast, down, left:ls.length,
  };
}
/* 逃げ切れたか。段階が高いほうが勝ち。
   同じ段階なら 出目の小さいほう（より深く踏み込めたほう）が勝つ。

    od.theirs,"foe",od.down?`<span style="color:#8fa261">倒した ${od.down} 体ぶん −${od.down*FLEEDOWN}</span>`:"");

      ` 対 ${od.fast?od.fast.name:"追っ手"} <span class="m">${SCLV[lb+1]}</span>`+
      (ok?` → <span class="m">振り切った</span>`:` → <span class="c">回り込まれた</span>`));

/* 逃げ切ったあと。ひとつ前のノードに戻し、次を選び直せる状態にする。

async function rollDice(rolls,thr,label,top,noBonus){
  const row=ovShow(label||`判 定　<em>${thr} 以上で命中</em>`,top);
  const els=rolls.map((_,i)=>{const s=document.createElement("span");
    s.className="dv enter";
    s.style.animationDelay=(i*0.06)+"s";

  const spin=setInterval(()=>els.forEach(e=>{if(e.classList.contains("roll"))e.textContent=r6();}),70);
  await wait(760);
  for(let i=0;i<els.length;i++){
    els[i].classList.remove("roll");els[i].classList.add("land");els[i].textContent=rolls[i];
    if(rolls[i]>=6){els[i].classList.add("six");SFX.crit();}

      else els[i].classList.add("weak");
