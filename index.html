/* ---------- せり出す窓 ---------- */
/* 外側を押して閉じてよいのは「見るだけの窓」だけ。
   選ぶことで流れが進む窓（報酬・レベルアップ・枠の入れ替え・戦利品など）を
   外側クリックで閉じると、続きを呼ぶ処理が走らず先に進めなくなる。
   そのため既定は閉じない。閉じてよい窓だけ openModal(h,true) で開く。 */
function openModal(html,dismissible){
  $("#mbox").innerHTML=html;
  const m=$("#modal");
  m.dataset.free=dismissible?"1":"";
  m.classList.remove("hide");
}
function closeModal(){$("#modal").classList.add("hide");}
function modalOpen(){return !$("#modal").classList.contains("hide");}
function modalFree(){return modalOpen()&&$("#modal").dataset.free==="1";}

/* 3つから1つ選ぶ窓 */
function choiceModal(title,note,list,onPick,skipTxt,onSkip){
  let h=`<div class="mtitle">${title}</div>`;
  if(note)h+=`<div class="mgrow">${note}</div>`;
  h+=`<div class="msub">${(list||[]).some(x=>x.cat==="gear")
    ?"スキル／パッシブ／装備 から ひとつ選ぶ":"覚えるものを ひとつ選ぶ"}</div><div class="acts">`;
  list.forEach(({cat,r},i)=>{
    const C=CAT[cat];
    let meta="";
    if(cat==="act")meta=`MP ${r.mp}　再使用 ${r.cd} ターン　`+
      (me.sk.length<SKMAX?`枠 ${me.sk.length}/${SKMAX}`:`<span style="color:var(--blood)">枠 満杯</span>`);
    else if(cat==="pass")meta="操作は不要・自動で働く　"+
      (me.pass.length<PASSMAX?`枠 ${me.pass.length}/${PASSMAX}`:`<span style="color:var(--blood)">枠 満杯</span>`);
    else meta=tierTag(r.tier)+"　"+slotNote(r.slot);
    const pt=(cat==="gear")?"":poolTag(cat,r.id);
    h+=`<button class="act rew ${C.c}" data-i="${i}">
      <span class="rcat">${C.n}</span><span class="an">${r.n}</span>
      <span class="ad">${r.d}</span>
      <span class="rmeta">${pt}${pt?"　":""}${meta}</span></button>`;
  });
  h+=`<button class="act cancel wide" data-skip="1">
    <span class="an">${skipTxt||"取らない"}</span>
    <span class="ad">HP を 20% 回復する</span></button></div>`;
  openModal(h);
  $("#mbox").querySelectorAll("[data-i]").forEach(b=>{
    b.onclick=()=>{const {cat,r}=list[+b.dataset.i];
      const res=applyReward(cat,r);SFX.found();closeModal();
      if(res&&res.full)swapModal(res.kind||"acc",res.full,()=>onPick(r));
      else onPick(r);};
  });
  const sk=$("#mbox").querySelector("[data-skip]");
  if(sk)sk.onclick=()=>{me.HP=Math.min(me.maxHP,me.HP+Math.round(me.maxHP*0.2));
    closeModal();(onSkip||onPick)(null);};
}
function pickList(cats,n){
  n=n||3;
  const list=[];
  if(cats.length===1){
    const pool=catPool(cats[0]);
    while(list.length<n&&pool.length)
      list.push({cat:cats[0],r:pool.splice(Math.floor(Math.random()*pool.length),1)[0]});
  }else{
    cats.forEach(c=>{const pool=catPool(c);
      if(pool.length)list.push({cat:c,r:pool[Math.floor(Math.random()*pool.length)]});});
    if(ORIG[sel.orig]&&ORIG[sel.orig].extraPick){
      const c=cats[Math.floor(Math.random()*cats.length)];
      const pool=catPool(c).filter(r=>!list.some(x=>x.r.id===r.id));
      if(pool.length)list.push({cat:c,r:pool[Math.floor(Math.random()*pool.length)]});
    }
  }
  return list;
}

/* ---------- 報酬 ---------- */
function catPool(cat){
  if(cat==="gear"){
    const maxT=(RUN?RUN.act:0)+1+LUKGRADE;   /* 宝箱では幸運で 1 段上がる */
    const list=[];
    (GEAR.wep[sel.job]||[]).forEach(g=>list.push({...g,slot:"wep",
      d:(()=>{const w=WEP[g.key];
        const now=powOf(me,{});
        const nx=Math.round(me[w.stat]*statMul(w));
        return `攻撃ダイス ${w.hands}　威力 ${Math.round(statMul(w)*100)}% = ${nx}（いま ${now}）　${
        w.type==="melee"?"近接":"遠隔"}<br><span style="color:var(--ink)">${w.d}</span>`;})()}));
    GEAR.armor.forEach(g=>list.push({...g,slot:"armor"}));
    GEAR.acc.forEach(g=>list.push({...g,slot:"acc"}));
    return list.filter(r=>!owned.includes(r.id)&&!r.made&&(r.tier||1)<=maxT);
  }
  const P=REW[cat];
  return P.common
    .concat(P[sel.job]||[]).concat(P[sel.race]||[]).concat(P[sel.orig]||[])
    .filter(r=>!owned.includes(r.id));
}
function drawRewards(){
  const out=[];
  ["act","pass","gear"].forEach(c=>{
    const pool=catPool(c);
    if(pool.length)out.push({cat:c,r:pool[Math.floor(Math.random()*pool.length)]});
  });
  return out;
}
const SLOTN={wep:"武器",armor:"防具",acc:"装飾"};
const ACCMAX=4;
/* 装備の予備。武器・防具・装飾を種類を問わずここに置いておける。
   宝箱で武器が出るたびに いまの武器が問答無用で置き換わっていたのを、
   ここへ一度受けてから自分で着け替える形にした。 */
const STASHMAX=2;
const SKMAX=6;
const EXPNEED=[0,18,28,38,48,58,68,78,88,98,108,118,128,138,148,158,168,178,188,198,208,218,228,238,248,258];
function expCap(){return EXPNEED[Math.min(EXPNEED.length-1,me.lv)];}
function expToNext(){return expCap()-me.exp;}
function expFor(kind){
  const base={battle:24,elite:55,boss:110}[kind]||24;
  return Math.round(base*(1+RUN.act*0.55));
}
const PASSMAX=10;
const TIERN={0:"初期",1:"一等",2:"二等",3:"三等"};
function madeTag(g){
  return (g&&g.made)?`<span class="tierb" style="color:#c98a3a;border-color:#c98a3a">作</span>`:"";
}
function tierTag(t){
  if(t===undefined||t===null)t=1;
  const c={0:"#5a6150",1:"#8b9080",2:"#6f92ab",3:"#c9a227"}[t]||"#8b9080";
  return `<span class="tierb" style="color:${c};border-color:${c}">${TIERN[t]}</span>`;
}
function slotNote(slot){
  const sp=STASHMAX-((me.stash||[]).length);
  const spare=sp>0?`　予備 ${sp} つ空き`:`　予備も満杯`;
  if(slot==="acc"){
    const n=(me.eq.acc||[]).length;
    return n<ACCMAX?`装飾の枠　${n} / ${ACCMAX}　まだ空いている`
                   :`装飾の枠　満杯${spare}`;
  }
  if(slot==="wep"||slot==="armor"){
    if(!me.eq[slot])return `${slot==="wep"?"武器":"防具"}の枠　空いている`;
    return `いまの ${slot==="wep"?me.wep.n:me.eq.armor.n} は外さない${spare}`;
  }
  const cur=me.eq[slot];
  return `${SLOTN[slot]} の枠`+(cur?`　いまの「${cur.n}」と入れ替え`:"　空いている");
}
function markSeen(id){if(id){META.seen[id]=true;touchMeta();}}
function applyReward(cat,r){
  markSeen(r.id);
  owned.push(r.id);
  if(cat==="act"){
    if(me.sk.length<SKMAX)me.sk.push({...r,cdLeft:0});
    else return {full:{...r,cdLeft:0},kind:"act"};
  }
  else if(cat==="pass"){
    if(me.pass.length<PASSMAX){me.pass.push(r);recalcMe(me,false);}
    else return {full:r,kind:"pass"};
  }
  else if(cat==="gear"){
    /* 空いている枠にはそのまま着ける。
       埋まっていれば予備へ。予備も満杯なら、何と入れ替えるか訊く。 */
    me.eq.acc=me.eq.acc||[];
    me.stash=me.stash||[];
    if(r.slot==="acc"&&me.eq.acc.length<ACCMAX){me.eq.acc.push(r);recalcMe(me,false);return null;}
    if(r.slot!=="acc"&&!me.eq[r.slot]){me.eq[r.slot]=r;recalcMe(me,false);return null;}
    if(me.stash.length<STASHMAX){me.stash.push(r);return {stashed:true};}
    return {full:r};
  }
  return null;
}
/* 装備の一行説明。武器の等級表は d を持たないので、武器の型から組み立てる */
function gearDesc(g){
  if(!g)return "";
  if(g.slot==="wep"&&WEP[g.key]){
    const w=WEP[g.key];
    return `攻撃ダイス ${w.hands}　威力 ${Math.round(statMul(w)*100)}%　${
      w.type==="melee"?"近接":"遠隔"}　${w.d||""}`;
  }
  return g.d||"";
}
/* 予備の1つを着ける。外れたものは予備の同じ場所に戻る */
function stashEquip(i){
  const g=me.stash[i]; if(!g)return;
  if(g.slot==="acc"){
    if((me.eq.acc||[]).length<ACCMAX){me.eq.acc.push(g);me.stash.splice(i,1);}
    else return accPickModal(g,i);
  }else{
    const old=me.eq[g.slot]||null;
    me.eq[g.slot]=g;
    if(old)me.stash[i]=old; else me.stash.splice(i,1);
  }
  recalcMe(me,false);SFX.pick();
}
/* 装飾の枠が満杯のとき、予備のどれと入れ替えるか */
function accPickModal(g,i){
  let h=`<div class="mtitle">装 飾 の 枠 が 満 杯</div>
    <div class="mgrow"><b>${g.n}</b>　${gearDesc(g)}</div>

  me.eq.acc.forEach((x,j)=>{
    h+=`<button class="act rew cgear" data-j="${j}">
      <span class="rcat">外す</span><span class="an">${x.n}</span>
      <span class="ad">${x.d}</span></button>`;});
  h+=`<button class="act cancel wide" data-keep="1">
    <span class="an">やめる</span><span class="ad">予備に置いたままにする</span></button></div>`;
  openModal(h);
  $("#mbox").querySelectorAll("[data-j]").forEach(b=>{
    b.onclick=()=>{const j=+b.dataset.j;const old=me.eq.acc[j];

function swapModal(kind,newR,after){
  if(kind==="acc"||(newR&&newR.slot))return gearSwapModal(newR,after);
  const isAct=(kind==="act");
  const list=isAct?me.sk:me.pass;
  const label=isAct?"ス キ ル":"パ ッ シ ブ";
  const cls=isAct?"cskill":"cpass";
  let h=`<div class="mtitle">${label} の 枠 が 埋 ま っ て い る</div>
    <div class="mgrow"><b>${newR.n}</b>　${newR.d}</div>
    <div class="msub">忘れるものを選ぶ（上限 ${isAct?SKMAX:PASSMAX}）</div><div class="acts">`;
  list.forEach((g,i)=>{
    h+=`<button class="act rew ${cls}" data-i="${i}">
      <span class="rcat">忘れる</span><span class="an">${g.n}</span>
      <span class="ad">${g.d}</span></button>`;});
  h+=`<button class="act cancel wide" data-keep="1">
    <span class="an">受け取らない</span><span class="ad">いまのままで進む</span></button></div>`;
  openModal(h);
  $("#mbox").querySelectorAll("[data-i]").forEach(b=>{
    b.onclick=()=>{list[+b.dataset.i]=newR;
      if(isAct)list[+b.dataset.i].cdLeft=0;
      recalcMe(me,false);SFX.found();closeModal();after&&after();};});
  const kb=$("#mbox").querySelector("[data-keep]");
  if(kb)kb.onclick=()=>{closeModal();after&&after();};
}
/* 装備の置き場が全部埋まったときに、何と入れ替えるか訊く。
   いま着けている同じ種類のものと、予備の2つが並ぶ。
   選ばなかったものは捨てることになるので、そう書く。 */
function gearSwapModal(newR,after){
  const SLOTN={wep:"武 器",armor:"防 具",acc:"装 飾"};
  const cur=[];
  if(newR.slot==="acc")(me.eq.acc||[]).forEach((g,i)=>cur.push({g,kind:"acc",i}));
  else if(me.eq[newR.slot])cur.push({g:me.eq[newR.slot],kind:"eq"});
  (me.stash||[]).forEach((g,i)=>cur.push({g,kind:"stash",i}));

  let h=`<div class="mtitle">置 き 場 が 満 杯</div>
    <div class="mgrow">${tierTag(newR.tier)}${madeTag(newR)} <b>${newR.n}</b>　${gearDesc(newR)}
      <br><span class="s">${SLOTN[newR.slot]||""}　装備の枠も予備の ${STASHMAX} つも埋まっている</span></div>
    <div class="msub">捨てるものを選ぶ</div><div class="acts">`;
  cur.forEach((c,i)=>{
    h+=`<button class="act rew cgear" data-i="${i}">
      <span class="rcat">${c.kind==="stash"?"予備を捨てる":"外して捨てる"}</span>
      <span class="an">${c.g.n}</span>
      <span class="ad">${gearDesc(c.g)}</span></button>`;});
  h+=`<button class="act cancel wide" data-keep="1">
    <span class="an">受け取らない</span>
    <span class="ad">${newR.n} を置いていく</span></button></div>`;
  openModal(h);
  $("#mbox").querySelectorAll("[data-i]").forEach(b=>{
    b.onclick=()=>{
      const c=cur[+b.dataset.i];
      if(c.kind==="acc")me.eq.acc[c.i]=newR;
      else if(c.kind==="eq")me.eq[newR.slot]=newR;
      else me.stash[c.i]=newR;
      recalcMe(me,false);SFX.found();closeModal();after&&after();};});
  const kb=$("#mbox").querySelector("[data-keep]");
  if(kb)kb.onclick=()=>{closeModal();after&&after();};
}
function growUp(){
  const g=GROW[sel.job];
  for(const k in g)me.grow[k]+=g[k];
  recalcMe(me,false);
  return g;
}
/* 戦利品を1つ選ぶ */
function lootModal(list,after){
  const CLS={gold:"cgold",mat:"cmat",food:"cheal",item:"cheal",recipe:"crec",gear:"cgear"};
  const LBL={gold:"金 貨",mat:"素 材",food:"食 材",item:"道 具",recipe:"レシピ",gear:"装 備"};
  let h=`<div class="mtitle">戦 利 品</div>
    <div class="mgrow">Lv <b>${me.lv}</b>　経験 <b>${me.exp}</b> / ${expCap()}　
      金貨 <b style="color:#c9a227">${me.gold}</b></div>
    <div class="msub">持ち出せるのは ひとつだけ。</div><div class="acts">`;
  list.forEach((o,i)=>{
    h+=`<button class="act rew ${CLS[o.t]}" data-i="${i}">
      <span class="rcat">${LBL[o.t]}</span><span class="an">${o.n}</span>
      <span class="ad">${o.d}</span></button>`;});
  h+=`</div>`;
  openModal(h);
  $("#mbox").querySelectorAll("[data-i]").forEach(b=>{
    b.onclick=()=>{
      const o=list[+b.dataset.i];
      SFX.found();
      RUN.lootLines=[];
      if(o.t==="gold"){me.gold+=o.v;
        RUN.lootLines.push(`金貨 <b>+${o.v}</b>　<span class="s">（所持 ${me.gold}）</span>`);}
      else if(o.t==="mat"){
        touchMeta();
        o.keys.forEach(k=>{me.mats[k]=(me.mats[k]||0)+o.num;META.mats[k]=true;
          RUN.lootLines.push(`<b>${MATS[k].n}</b> ×${o.num}　`+
            `<span class="s">（手持ち ${me.mats[k]}　1つ ${MATS[k].v} 金貨）</span>`);});
      }
      else if(o.t==="food"){
        const g=gainFood(o.num);
        Object.keys(g).forEach(k=>RUN.lootLines.push(
          `<b>${MATS[k].n}</b> ×${g[k]}　<span class="s">（手持ち ${me.mats[k]}　${MATS[k].d}）</span>`));}
      else if(o.t==="recipe"){
        me.recipes.push(o.key);markSeen(o.key);
        const R=RECIPES[o.key];
        RUN.lootLines.push(`<b>${R.n}</b> を覚えた　<span class="s">（${
          R.kind==="cook"?"料理":"鍛冶"}）</span>`);
        RUN.lootLines.push(`<span class="s">必要 ${Object.keys(R.need).map(k=>
          MATS[k].n+"×"+R.need[k]).join("　")}　加工賃 ${R.cost}</span>`);}
      else if(o.t==="item"){
        if(bagCount()>=bagMax()){closeModal();
          return itemSwapModal(o.key,()=>{
            RUN.lootLines=[`<b>${ITEMS[o.key].n}</b>　<span class="s">${ITEMS[o.key].d}</span>`];
            after();});}
        me.bag[o.key]=(me.bag[o.key]||0)+1;markSeen("i_"+o.key);
        RUN.lootLines.push(`<b>${ITEMS[o.key].n}</b> ×${me.bag[o.key]}　`+
          `<span class="s">${ITEMS[o.key].d}</span>`);
        RUN.lootLines.push(`<span class="s">持ち物 ${bagCount()} / ${bagMax()}</span>`);
      }
      else if(o.t==="gear"){
        const res=applyReward("gear",o.gear);
        RUN.lootLines.push(`<b>${o.gear.n}</b>　<span class="s">${o.gear.d}</span>`);
        if(!res)RUN.lootLines.push(`<span class="s">${SLOTN[o.gear.slot]} に装備した</span>`);
        closeModal();
        if(res&&res.full)return swapModal(res.kind||"acc",res.full,after);
        return after();
      }
      closeModal();after();
    };
  });
}
/* レベルが上がると スキル／パッシブ を計3つ提示して1つ選ぶ */

      d:`${RECIPES[rk].kind==="cook"?"料理":"鍛冶"}　${RECIPES[rk].d}`,key:rk});
  }else if(roll<0.46){
    const gp=catPool("gear");
    if(gp.length){const gg=gp[Math.floor(Math.random()*gp.length)];
      list.push({t:"gear",n:gg.n,d:gg.d,gear:gg});}
  }
  /* 候補から 3 つだけ見せる（強欲は 4 つ） */
  const want=3+((ORIG[sel.orig]&&ORIG[sel.orig].extraPick)?1:0)+passOn("pick");
  const shown=[];
  const pool=list.slice();
  while(shown.length<want&&pool.length)
    shown.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
  lootModal(shown,()=>{
    if(expToNext()<=0)return levelUpModal(()=>nextStage());
    nextStage();
  });
}
function nextStage(){
  const r=RUN.cur;
  if(r)r.done=true;
  const out=[`${ENCS[sel.enc].n} を退けた`];
  /* 同じ敵が何体並んでいても、1戦は1戦 */
  [...new Set(ENCS[sel.enc].list)].forEach(k=>{META.codex[k]=(META.codex[k]||0)+1;});
  touchMeta();
  const g=gainGold(RUN.boss?"boss":(RUN.elite?"elite":"battle"));
  if(RUN.lootLines&&RUN.lootLines.length){
    out.push(`<span class="gain">手に入れたもの</span>`);
    RUN.lootLines.forEach(l=>out.push(`　${l}`));
    RUN.lootLines=null;
  }
  out.push(`金貨 <span class="gain">+${g}</span>　<span class="s">（所持 ${me.gold}）</span>`);
  if(RUN.boss){
    RUN.boss=false;
    const h=Math.min(Math.round(me.maxHP*0.3),me.maxHP-me.HP);
    me.HP+=h;me.MP=me.maxMP;
    const ways=findEntrances();
    const cleared=`${areaOf().n} を抜けた`;
    /* 最後まで抜けて、はじめてこの場所の名前が地図に残る */
    const firstTime=!areaKnown(RUN.area);
    META.areas[RUN.area]=true;touchMeta();
    if(firstTime)out.push(
      `<span class="gain">${areaOf().n}</span> の名を知った　<span class="s">（世界地図に残る）</span>`);
    if(!ways.length){
      /* 行ける先が見つからない。ここが終点 */
      drawFloor();showScreen("floor");
      resultModal(cleared,
        out.concat([`HP <span class="gain">+${h}</span>　MP 全快`,
          `<span class="gain">この先へ続く道は見つからなかった</span>`,
          `　<span class="s">${RUN.act+1} 区画を抜けた</span>`]),
        [{n:"地上へ戻る",cb:()=>endRun(true)}]);
      return;
    }
    drawFloor();showScreen("floor");
    resultModal(cleared,
      out.concat([`HP <span class="gain">+${h}</span>　MP 全快`,
        ways.length>1?`<span class="gain">道が二股に分かれていた</span>`
                     :`<span class="gain">先へ続く入口が見つかった</span>`]),
      [{n:"入口を見る",cb:()=>gateModal(ways)}]);
    return;
  }
  backToFloor(r?r.name:"戦闘",out);
  if(RUN.pendingItem)itemSwapModal(RUN.pendingItem,()=>drawFloor());
}

/* 料理は グルメ を持つと 専用枠に入る */
function isCook(k){return !!(ITEMS[k]&&ITEMS[k].made);}
function cookMax(){return passOn("gourmet");}
function cookCount(){
  if(!cookMax())return 0;
  return Object.keys(me.bag||{}).filter(isCook)
    .reduce((a,k)=>a+me.bag[k],0);
}
function bagCount(){
  const all=Object.keys(me.bag||{}).reduce((a,k)=>a+me.bag[k],0);
  return Math.max(0,all-Math.min(cookMax(),cookCount()));
}
/* 道具の上限。基本3つ。装備と来歴で広がる */
const BAGBASE=3;
function bagMax(){
  return BAGBASE+(me.bagPlus||0)+((ORIG[sel.orig]&&ORIG[sel.orig].bagPlus)||0);
}
function bagLabel(){
  return cookMax()
    ? `${bagCount()}/${bagMax()}　料理 ${Math.min(cookMax(),cookCount())}/${cookMax()}`
    : `${bagCount()}/${bagMax()}`;
}
function bagPanel(){

async function useItem(k){
  const it=ITEMS[k];
  if(it.target){
    pending={item:k};
    $("#prompt").textContent=`▸ ${it.n} を投げる相手を選ぶ`;

async function doItem(k,tgt){
  const it=ITEMS[k];
  busy=true;pending=null;
  me.bag[k]--;if(!me.bag[k])delete me.bag[k];
  $("#acts").innerHTML="";$("#prompt").textContent="";
  if(it.heal){
    const h=Math.min(Math.round(me.maxHP*it.heal),me.maxHP-me.HP);
    me.HP+=h;draw();fxOn(me,"charge");popSelf("+"+h,"heal");SFX.found();
    log(`<span class="a">${it.n}</span> を使った　HP <span class="m">+${h}</span>`);
  }else if(it.mp){
    const g=Math.min(Math.round(it.mp*(it.made&&cookMax()?1.3:1)),me.maxMP-me.MP);
    me.MP+=g;draw();fxOn(me,"charge");popSelf("MP+"+g,"blk");SFX.open();
    log(`<span class="a">${it.n}</span> を使った　MP <span class="m">+${g}</span>`);
  }else if(it.cure){
    const had=(me.ail||[]).map(a=>AIL[a.k].n);
    me.ail=[];draw();fxOn(me,"charge");
    popSelf(had.length?"解 除":"変化なし","blk");SFX.found();
    log(`<span class="a">${it.n}</span> を使った　`+
      (had.length?`<span class="m">${[...new Set(had)].join("・")}</span> を解いた`
                 :`解くべきものはなかった`));
  }else if(it.half){
    me.half=true;draw();fxOn(me,"guard");popSelf("半減","blk");SFX.buff();
    log(`<span class="a">${it.n}</span> を使った　次の被害が半分になる`);
  }else if(it.pow){
    me.tmpPow=(me.tmpPow||0)+it.pow;draw();fxOn(me,"charge");popSelf("威力+"+it.pow,"blk");SFX.open();
    log(`<span class="a">${it.n}</span> を使った　この戦闘の間 威力 <span class="m">+${it.pow}</span>`);
  }else if(it.def){
    me.tmpDef=(me.tmpDef||0)+it.def;draw();fxOn(me,"guard");popSelf("防御+"+it.def,"blk");SFX.open();
    log(`<span class="a">${it.n}</span> を使った　この戦闘の間 防御 <span class="m">+${it.def}</span>`);
  }else if(it.stun&&tgt){
    tgt.stun=true;draw();fxOn(tgt,"guard");popOn(tgt,"行動不能","blk");SFX.open();
    log(`<span class="a">${it.n}</span> が <span class="b">${tgt.name}</span> を捕らえた`);
  }else if(it.dmg){
    const list=it.all?alive().filter(f=>f!==me&&f.rank===(tgt?tgt.rank:"front")):[tgt];
    for(const t of list){
      if(!t)continue;
      const d=it.dmg+Math.round(it.dmg*0.25*RUN.act);
      t.HP=Math.max(0,t.HP-d);
      fxOn(t,"blunt");popOn(t,"−"+d);SFX.dmg();
      log(`<span class="a">${it.n}</span> → <span class="b">${t.name}</span>　`+
        `<span class="m">${d}</span>（防御を無視）`);
      await wait(180);
    }
    draw();
  }
  await wait(620);
  if(!alive().length)return finish(true);
  qi++;
  await runQueue();
}

/* ---------- 索敵 ---------- */
async function doScout(){
  /* こちらの探索と、相手の気配の対抗判定。
     どちらも 1d100 を振り、成功の段階が高いほうが勝つ。
     段階の差がそのまま最初の攻撃の攻撃ダイスになる（最大 +3）。

     前は敵のぶんを数字にしてこちらの技能から引いていたので、
     画面に出るのが「1d100 66／27」だけになり、
     27 がどこから来たのか・勝ったのか負けたのかが分からなかった。 */
  ovMsg("索 敵 開 始",true);
  SFX.open();
  await wait(800);

  const pen=(ORIG[sel.orig]&&ORIG[sel.orig].scoutPenalty)?15:0;
  const mine=Math.max(5,Math.min(SKMAXV,skillOf("search")+passOn("scout")*5-pen));
  /* いちばん勘のいい一匹が、群れを代表して気づく */
  const lead=foes.reduce((a,f)=>scoutHide(f)>scoutHide(a)?f:a,foes[0]);
  const theirs=Math.max(5,Math.min(SKMAXV,scoutHide(lead)));

  const o=$("#diceOv");
  o.className="diceOv on";
  o.innerHTML=`<div class="ovTop">索 敵</div>
    <div class="scRow" id="scMine"></div>
    <div class="scRow" id="scFoe"></div>
    <div class="scEnd" id="scEnd"></div>`;

  const side=async(id,name,pct,cls)=>{
    const el=$("#"+id);
    el.innerHTML=`<div class="scName ${cls}">${name}</div>
      <div class="scPct">1d100 ・ <b>${pct}</b> 以下</div>
      <div class="d100 roll" id="${id}D">00</div>
      <div class="scRes" id="${id}R">—</div>`;
    const d=$("#"+id+"D");
    SFX.shake();
    const spin=setInterval(()=>{d.textContent=String(r100()).padStart(2,"0");},55);
    await wait(780);
    clearInterval(spin);
    const r=roll100(pct);
    d.textContent=String(r.v).padStart(2,"0");
    d.className="d100 land";
    const lv=scoutLevel(r);
    const nm=r.crit?"クリティカル":r.fumble?"ファンブル":SKRANK[r.k].s;
    const c=r.crit?"#e9c46a":(r.fumble?"#b1544a":SKRANK[r.k].c);
    d.style.color=c;d.style.borderColor=c;
    $("#"+id+"R").innerHTML=`<span style="color:${c}">${nm}</span>`;
    if(r.k>=2||r.crit)SFX.crit();else SFX.tick();
    await wait(420);
    return lv;
  };

  const a=await side("scMine",me.name,mine,"mine");
  const b=await side("scFoe",lead.name+(foes.length>1?` ほか ${foes.length-1}`:""),theirs,"foe");
  scoutBonus=Math.max(0,Math.min(3,a-b));
  /* 片方だけが成功したときは、1ラウンド目だけ素早さを飛び越えて先に動く。
     気配に気づいたほうが先に身構える、という理屈。 */
  scoutFirst = (a>0&&b<=0) ? "me" : (b>0&&a<=0) ? "foe" : null;

  const diff=a-b;
  const vd=diff>=3?"完全に出し抜いた":diff===2?"はっきり先を取った"
    :diff===1?"わずかに先に気づいた":diff===0?"互いに気づいた":"こちらが出遅れた";
  $("#scEnd").innerHTML=
    `<div class="scDiff" style="color:${scoutBonus?"#8fa261":"#7d6b68"}">${vd}</div>`+
    (scoutBonus?`<div class="scGain">最初の攻撃に 攻撃ダイス <b>+${scoutBonus}</b></div>`
      :`<div class="scGain lose">先制の利はない</div>`)+
    (scoutFirst==="me"?`<div class="scGain">1ラウンド目は <b>こちらが先に動く</b></div>`
     :scoutFirst==="foe"?`<div class="scGain lose">1ラウンド目は <b style="color:var(--blood)">相手が先に動く</b></div>`
     :"");
  SFX.found();
  log(`<span class="a">索敵</span> ${me.short||"自分"} <span class="m">${SCLV[a+1]}</span>`+
      ` 対 ${lead.name} <span class="m">${SCLV[b+1]}</span>`+
    (scoutBonus?` → 最初の攻撃に ダイス <span class="m">+${scoutBonus}</span>`:` → 先制なし`)+
    (scoutFirst==="me"?`　<span class="m">1ラウンド目は先手</span>`
     :scoutFirst==="foe"?`　<span class="c">1ラウンド目は後手</span>`:""));
  await wait(1500);
  ovHide();
}
/* 敵の気配。勘のよさと素早さから出す */
function scoutHide(f){ return (f.scout||0)*8+Math.floor(f.DEX/2); }
/* 判定の結果を −1〜4 の段階にならす（ファンブル −1、クリティカル 4） */
function scoutLevel(r){ return r.fumble?-1:(r.crit?4:r.k); }
const SCLV=["ファンブル","失敗","成功","ハード","エクストリーム","クリティカル"];

function dunArt(k){
  const parts=PXDUN[k];if(!parts)return "";
  const r=parts.map(p=>
    `<rect x="${p[0]}" y="${p[1]}" width="${p[2]}" height="${p[3]}" fill="${p[4]}"/>`).join("");

    shape-rendering="crispEdges" aria-hidden="true">${r}</svg>`;
}

const MKSTEPS=[
  {k:"job", ttl:"職 業", data:()=>JOB,  sub:"何で戦うか"},
  {k:"race",ttl:"種 族", data:()=>RACE, sub:"どんな体か"},
  {k:"orig",ttl:"欲 望", data:()=>ORIG, sub:"何を求めるか"},
  {k:"__ok",ttl:"確 認", sub:""},

];
let mkStep=0;
function mkFig(){
  const j=sel.job||"knight", r=sel.race||"hume";
  return (sel.job||sel.race)?pixFig(j,r,72):"";
}
function drawMake(){
  const S=MKSTEPS[mkStep];
  $("#mkStep").innerHTML=MKSTEPS.map((x,i)=>
    `<span class="mkdot${i===mkStep?" on":(i<mkStep?" done":"")}"></span>`).join("");
  $("#mkFig").innerHTML=mkFig();
  $("#mkTtl").textContent=S.k==="__ok"?"こ の 者 で 良 い か":"キ ャ ラ を 作 る";
  if(S.k==="__ok")return drawMakeConfirm();
  const D=S.data();
  let h=`<div class="mkq">${S.ttl}　<span>${S.sub}</span></div>`;
  if(S.k==="area"){
    h+=`<div class="wmwrap mkmap">${
      worldMap("make",Object.keys(D).map(k=>({key:k,a:D[k]})))}</div>
      <div class="wmnote">光っている場所を押しても選べる<br>
        <span class="s">最後まで抜けた場所だけ名前がわかる</span></div>`;
  }
  h+=`<div class="acts">`;
  Object.keys(D).forEach(k=>{
    const o=D[k], on=(sel[S.k]===k);
    const ic=tagFig(k,15);const nm=o.n;
    if(S.k==="area"){
      h+=`<button class="duncard${on?" mkon":""}" data-k="${k}">
        <div class="dcart">${dunArt(o.art||"plains")}</div>
        <div class="dcbody">
          <div class="dcn">${o.n}</div>
          <div class="dcm">第 ${o.tier} 階層　${o.start}</div>
          <div class="dcd">${o.d||""}</div>
          <div class="dcacts">${routeFrom(k).join("　→　")}${
            (AREAS[k].to||[]).length>1?"　…ほか":""}</div>
        </div></button>`;
      return;
    }
    h+=`<button class="act rew${on?" mkon":""}" data-k="${k}">
      <span class="an">${ic} ${nm||o.n}</span>
      <span class="ad">${o.d||""}</span></button>`;
  });
  h+=`</div>`;
  if(mkStep>0)h+=`<button class="mclose" id="mkPrev">ひとつ もどる</button>`;
  $("#mkBody").innerHTML=h;
  const pickIt=k=>{
    sel[S.k]=k;
    if(S.k==="area"){SFX.pick();return startRun();}
    SFX.open();mkStep++;drawMake();window.scrollTo(0,0);
  };
  $("#mkBody").querySelectorAll("[data-k]").forEach(b=>{
    b.onclick=()=>pickIt(b.dataset.k);});
  $("#mkBody").querySelectorAll("[data-w]").forEach(g=>{
    g.onclick=()=>pickIt(g.dataset.w);});
  const pv=$("#mkPrev");
  if(pv)pv.onclick=()=>{mkStep--;drawMake();window.scrollTo(0,0);};
}

/* 図鑑の総数と、書き込まれた数 */
function codexCount(){
  const P=(o)=>Object.values(o).reduce((a,b)=>a+b.length,0);
  const G=(o)=>Object.values(o).reduce((a,b)=>a+b.filter(r=>META.seen[r.id]).length,0);
  const wepAll=Object.keys(JOB).reduce((a,j)=>a+1+GEAR.wep[j].length,0);
  const wepGot=Object.keys(JOB).reduce((a,j)=>a
    +(META.seen["w_"+JOB[j].wep]?1:0)
    +GEAR.wep[j].filter(g=>META.seen[g.id]).length,0);
  const all=Object.keys(FOE).length + P(REW.act) + P(REW.pass)
    + wepAll + GEAR.armor.length + GEAR.acc.length + Object.keys(ITEMS).length
    + Object.keys(MATS).length + Object.keys(RECIPES).length;
  const got=Object.keys(META.codex).length + G(REW.act) + G(REW.pass)
    + wepGot
    + GEAR.armor.filter(g=>META.seen[g.id]).length
    + GEAR.acc.filter(g=>META.seen[g.id]).length
    + Object.keys(ITEMS).filter(k=>META.seen["i_"+k]).length
    + Object.keys(MATS).filter(k=>META.mats[k]).length
    + Object.keys(RECIPES).filter(k=>META.seen[k]).length;
  return {all,got,pct:Math.round(got/all*100)};
}

const CXTABS=[
  {k:"foe",n:"モンスター"},{k:"skill",n:"スキル"},{k:"pass",n:"パッシブ"},
  {k:"gear",n:"武器・装備"},{k:"mat",n:"素材"},{k:"recipe",n:"レシピ"},
];
let cxNow="foe";
const POOLN2={common:"共通",knight:"ナイト",archer:"アーチャー",scout:"スカウト",mage:"ウィザード",
  hume:"ヒューム",dwarf:"ドワーフ",elf:"エルフ",beast:"ビースト",
  greed:"強欲",wrath:"憤怒",sloth:"怠惰",gluttony:"暴食",pride:"傲慢",envy:"嫉妬",lust:"色欲"};
/* タブごとの 書き込まれた数 */
function cxCount(k){
  const P=(o)=>({all:Object.values(o).reduce((a,b)=>a+b.length,0),
                 got:Object.values(o).reduce((a,b)=>a+b.filter(r=>META.seen[r.id]).length,0)});
  if(k==="foe")return {all:Object.keys(FOE).length,got:Object.keys(META.codex).length};
  if(k==="skill")return P(REW.act);
  if(k==="pass")return P(REW.pass);
  if(k==="gear"){
    const wAll=Object.keys(JOB).reduce((a,j)=>a+1+GEAR.wep[j].length,0);
    const wGot=Object.keys(JOB).reduce((a,j)=>a
      +(META.seen["w_"+JOB[j].wep]?1:0)+GEAR.wep[j].filter(g=>META.seen[g.id]).length,0);
    return {all:wAll+GEAR.armor.length+GEAR.acc.length+Object.keys(ITEMS).length,
            got:wGot+GEAR.armor.filter(g=>META.seen[g.id]).length
               +GEAR.acc.filter(g=>META.seen[g.id]).length
               +Object.keys(ITEMS).filter(x=>META.seen["i_"+x]).length};
  }
  if(k==="mat")return {all:Object.keys(MATS).length,
                       got:Object.keys(MATS).filter(x=>META.mats[x]).length};
  return {all:Object.keys(RECIPES).length,
          got:Object.keys(RECIPES).filter(x=>META.seen[x]).length};
}
function drawCodex(){
  $("#cxTabs").innerHTML=CXTABS.map(t=>{
    const c=cxCount(t.k);
    return `<button class="tab${t.k===cxNow?" on":""}" data-t="${t.k}">
      <span class="tabn">${t.n}</span>
      <span class="tabc">${c.got}/${c.all}（${Math.round(c.got/c.all*100)}%）</span>
    </button>`;}).join("");
  $("#cxTabs").querySelectorAll("[data-t]").forEach(b=>{
    b.onclick=()=>{cxNow=b.dataset.t;drawCodex();};});
  const c=codexCount();
  $("#cxAll").innerHTML=`<b>${c.got}</b> / ${c.all}　（${c.pct}%）`;
  $("#cxBody").innerHTML=cxBody();
}

      }).join("");
  }
  if(cxNow==="gear"){
    const wepAll=Object.keys(JOB).reduce((a,j)=>a+1+GEAR.wep[j].length,0);
    const wepGot=Object.keys(JOB).reduce((a,j)=>a
      +(META.seen["w_"+JOB[j].wep]?1:0)
      +GEAR.wep[j].filter(g=>META.seen[g.id]).length,0);
    const gAll=GEAR.armor.length+GEAR.acc.length+Object.keys(ITEMS).length;
    const gGot=GEAR.armor.filter(g=>META.seen[g.id]).length

    let h=`<div class="cxnote">手にしたものだけ 書き込まれる。</div>`;

  }).join("");
}

  const d=$("#detail"),b=$("#detBtn");
  d.classList.toggle("hide");
  b.classList.toggle("on",!d.classList.contains("hide"));
  if(!d.classList.contains("hide"))drawDetail();
};
/* 音のON/OFF。♪ のボタンは戦闘画面にしかないので、設定のつまみからも戻せる */
function soundToggle(){
  const o=SFX.toggle(); Music.toggle();

  if(!$("#setwrap").classList.contains("hide"))drawSet();
  return o;
}

/* ---------- 設定（歯車） ---------- */
const SLIDERS=[["master","sMaster","vMaster","rowMaster"],
               ["sfx","sSfx","vSfx","rowSfx"],
               ["bgm","sBgm","vBgm","rowBgm"]];
function drawSet(){
  const muted=!SFX.isOn();
  SLIDERS.forEach(([k,sid,vid,rid])=>{
    $("#"+sid).value=AUDIO[k];
    $("#"+vid).textContent=AUDIO[k]+"%";
    /* 全体が 0 なら他の2本も効かないので、揃えて薄くする */
    $("#"+rid).classList.toggle("off",muted||(k!=="master"&&AUDIO.master===0));
  });
  const t=Music.track;
  $("#setNow").innerHTML=muted
    ? `いま <b>音を止めている</b>　<span style="color:var(--ink)">つまみを動かすと戻る</span>`
    : (t?`いま流れている曲　<b>${t}</b>`
        :`いまの場面に曲は入っていない`);
  $("#setVer").textContent=VERSION;
  drawRec();
  drawCloud();
}
/* 記録をクラウドに置く話 */
function drawCloud(){
  const el=$("#setCloud");if(!el)return;
  const c=Cloud.info();
  const when=c.syncedAt
    ? `<span style="color:var(--ink)">　最後の同期 ${
        new Date(c.syncedAt).toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"})}</span>`
    : "";
  const btn=(id,t)=>`<button id="${id}">${t}</button>`;
  let h="";
  if(!c.configured){
    h=`記録は<b>この端末だけ</b>　<span style="color:var(--ink)">クラウド保存は未設定`+
      `（<b>FIREBASE.md</b> の手順で firebaseConfig を入れると使える）</span>`;
  }else if(c.state==="loading"){
    h=`<b>つないでいる…</b>`;
  }else if(c.state==="anon"){
    h=`<b>クラウドに保存中</b>${when}<br>`+
      `<span style="color:var(--ink)">いまは この端末だけの名無しの記録。`+
      `Google と連携すると 別の端末でも続きが遊べる</span><br>`+
      btn("cLink","Google と連携する")+btn("cSync","今すぐ同期")+btn("cOut","同期をやめる");
  }else if(c.state==="user"){
    h=`<b>クラウドに保存中</b>　<span style="color:var(--ink)">${c.who}</span>${when}<br>`+
      btn("cSync","今すぐ同期")+btn("cOut","サインアウト");
  }else if(c.state==="out"){
    h=`記録は<b>この端末だけ</b>　<span style="color:var(--ink)">同期を止めている`+
      `（端末内の記録はそのまま残っている）</span><br>`+
      btn("cIn","同期を始める")+btn("cLink","Google でサインイン");
  }else if(c.state==="error"){
    h=`<span class="warn">クラウドに繋がっていない</span><br>`+
      `<span style="color:var(--ink)">${c.err}</span><br>`+
      `<span style="color:var(--ink)">記録は端末内に残っているので遊ぶぶんには困らない</span><br>`+
      btn("cIn","もう一度つなぐ");
  }else{
    h=`記録は<b>この端末だけ</b>`;
  }
  el.innerHTML=h;
  const go=(id,f)=>{const b=$("#"+id);if(b)b.onclick=()=>{SFX.click();f();};};
  go("cLink",()=>Cloud.linkGoogle());
  go("cSync",()=>Cloud.sync());
  go("cOut", ()=>Cloud.signOut());
  go("cIn",  ()=>Cloud.signIn());
}
/* 記録の状態と、消す道 */
function drawRec(){
  const el=$("#setRec");if(!el)return;
  const cx=codexCount();
  if(metaBroken){
    el.innerHTML=`<span class="warn">記録を残せていない</span><br>`+
      `<span style="color:var(--ink)">この環境では保存が使えない（プライベート窓など）。`+
      `図鑑と殿堂はページを閉じると消える</span>`;
    return;
  }
  el.innerHTML=`記録は<b>この端末に残る</b>　`+
    `<span style="color:var(--ink)">図鑑 ${cx.got}/${cx.all}　潜った回数 ${META.runs}　最高 ${META.best} 階層</span>`+
    `<br><button id="recClear">記録を消す</button>`;
  $("#recClear").onclick=()=>{
    const b=$("#recClear");
    if(b.dataset.sure!=="1"){
      b.dataset.sure="1";b.textContent="本当に消す（もう一度押す）";b.style.color="var(--blood)";
      b.style.borderColor="var(--blood)";
      setTimeout(()=>{if(b.isConnected&&b.dataset.sure==="1")drawRec();},4000);
      return;
    }
    metaClear();SFX.click();
    if(!$("#home").classList.contains("hide"))drawHome();
    drawRec();
  };
}
/* ---------- お知らせ（封筒） ---------- */
function drawMail(){
  const b=$("#mail");if(!b)return;
  const n=newsUnread();
  b.classList.toggle("unread",n>0);
  b.innerHTML=`✉${n>0?`<span class="dot">${n>9?"9+":n}</span>`:""}`;
  b.title=n>0?`お知らせ ${n} 件`:"お知らせ";
}
function drawNews(){
  const unread=newsUnread();
  $("#newsBody").innerHTML=NEWS.length?NEWS.map((x,i)=>{
    const T=NEWSTAG[x.tag]||NEWSTAG.info;
    return `<div class="nwitem ${i<unread?"new":""}">
      <div class="nwh">
        <span class="nwtag" style="color:${T.c};border-color:${T.c}">${T.n}</span>
        <span class="nwv">${x.v}</span>
        ${i<unread?`<span class="nwnew">NEW</span>`:""}
        <span class="nwd">${x.d}</span></div>
      <div class="nwt">${x.n}</div>
      ${x.b.map(t=>`<div class="nwb">${t}</div>`).join("")}
    </div>`;
  }).join(""):`<div class="nwnone">まだ お知らせはない</div>`;
}
function openNews(){
  drawNews();                       /* 開いた時点の未読を印として見せてから */
  $("#newswrap").classList.remove("hide");
  if(NEWS.length&&META.newsSeen!==NEWS[0].id){
    META.newsSeen=NEWS[0].id;touchMeta();
  }
  drawMail();                       /* 封筒の印はその場で消す */
}
function closeNews(){$("#newswrap").classList.add("hide");}
$("#mail").onclick=()=>{SFX.click();openNews();};
$("#newsClose").onclick=closeNews;
$("#newswrap").onclick=e=>{if(e.target.id==="newswrap")closeNews();};
drawMail();

Cloud.on(()=>{ if(!$("#setwrap").classList.contains("hide"))drawCloud(); });
Cloud.start();                      /* 設定が空なら何も起きない */
function openSet(){$("#setwrap").classList.remove("hide");drawSet();}
function closeSet(){$("#setwrap").classList.add("hide");}
$("#gear").onclick=()=>{SFX.click();openSet();};
$("#setClose").onclick=closeSet;
$("#setwrap").onclick=e=>{if(e.target.id==="setwrap")closeSet();};
document.addEventListener("keydown",e=>{
  if(e.key!=="Escape")return;
  if(!$("#setwrap").classList.contains("hide"))return closeSet();
  if(!$("#newswrap").classList.contains("hide"))return closeNews();
  if(modalFree())closeModal();});
SLIDERS.forEach(([k,sid])=>{
  const el=$("#"+sid);
  el.oninput=()=>{
    const v=+el.value;            /* soundToggle が drawSet でつまみを戻すので、先に控える */
    if(!SFX.isOn()&&v>0)soundToggle();   /* 消音中でもつまみで戻せる */
    AUDIO[k]=v;audioApply();drawSet();};
  el.onchange=()=>{audioSave();SFX.click();};   /* つまみを離したときだけ書き込む */
});
/* 自動再生を止められていたら、最初に何か押されたときに鳴らし直す */
document.addEventListener("click",()=>{SFX.init();Music.resume();});
/* 書く前に閉じられても記録を落とさない。pagehide は iOS でも呼ばれる */
window.addEventListener("pagehide",metaFlush);
document.addEventListener("visibilitychange",()=>{if(document.hidden)metaFlush();});
</script>
</body>
</html>
